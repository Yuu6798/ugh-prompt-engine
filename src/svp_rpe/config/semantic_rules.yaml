schema_version: "2.0"

perceptual:
  - id: perc.high_tempo
    condition: {bpm_min: 140}
    labels:
      - {label: high_tempo, confidence: 0.95}
  # brightness の正規センサーは spectral_centroid（Hz, 抽出 sr=22050）。
  # 旧 band-ratio（high/(low+mid+high), >=4kHz）は HF エネルギーの乏しい素材で
  # 0 に張り付き盲目になる（K1 grip 測定で確認、controllability_poc.md §5.1）。
  # 目盛り: dark <= 1200 / neutral 1200-2500 / bright >= 2500。
  # hyp.melancholic の spectral_centroid_max: 2000（非 bright の先例）と無矛盾。
  - id: perc.bright
    condition: {spectral_centroid_min: 2500}
    labels:
      - {label: bright, confidence: 0.90}
  - id: perc.dark
    condition: {spectral_centroid_max: 1200}
    labels:
      - {label: dark, confidence: 0.85}
  - id: perc.bass_heavy
    condition: {low_ratio_min: 0.4}
    labels:
      - {label: bass-heavy, confidence: 0.90}
      - {label: grounded, confidence: 0.80}
  - id: perc.mid_focused
    condition: {mid_ratio_min: 0.45}
    labels:
      - {label: mid-focused, confidence: 0.80}

structural:
  - id: struct.dynamic
    condition: {valley_depth_min: 0.3}
    labels:
      - {label: dynamic, confidence: 0.85}
      - {label: contrastive, confidence: 0.80}
  - id: struct.gradual_motion
    condition: {valley_depth_min: 0.15}
    labels:
      - {label: evolving, confidence: 0.75}
  - id: struct.continuous
    condition: {valley_depth_max: 0.1, active_rate_min: 0.8}
    labels:
      - {label: continuous, confidence: 0.85}
      - {label: wall-like, confidence: 0.75}
  - id: struct.spacious
    condition: {stereo_width_min: 0.7}
    labels:
      - {label: spacious, confidence: 0.85}

semantic_hypothesis:
  - id: hyp.melancholic
    condition: {mode: minor, spectral_centroid_max: 2000, valley_depth_min: 0.15}
    labels:
      - {label: melancholic, confidence: 0.55}
      - {label: introspective, confidence: 0.50}
  - id: hyp.energetic
    condition: {bpm_min: 140, spectral_centroid_min: 2500, active_rate_min: 0.8}
    labels:
      - {label: energetic, confidence: 0.68}
      - {label: driving, confidence: 0.65}
  - id: hyp.cinematic
    condition: {valley_depth_min: 0.3, stereo_width_min: 0.7}
    labels:
      - {label: cinematic, confidence: 0.60}

# --- ジャンル/楽器セクション（旧 semantic_rules.py ハードコードから config 化） ---
# Phase A は **振る舞い保存リファクタ**。旧ハードコードのジャンル/楽器推定を宣言的
# ルールへ移管しただけで、出力は変えていない（snapshot 不変）。
# 評価方式: cultural_context は全マッチを収集（dedup・順序保持）、default は no-match 時のみ。
# instrumentation は first-match-wins（旧 elif チェーンを温存。順序が意味を持つ）。
# 条件演算子: _min(>=)/_max(<=)/_gt(>)/_lt(<)/==。旧ハードコードは厳密 >/< だったため
# _gt/_lt で**境界まで完全に等価**に温存する（bpm==140 等の knob 値でも挙動不変）。
#
# orchestral/rock/bass-music の low-heavy 分離は magnitude brilliance を優先。
# Phase B-3-rock (2026-06-26): rock 5 サンプル追加で brilliance が 3 ジャンルを
# 重なりゼロの 3 バンドに分離することを確認（orchestral ≤0.0954 | rock 0.139-0.196
# | EDM ≥0.2119）。旧単一閾値 0.1537 は rock クラスタ中央を貫き classic/hard/blues→
# bass-music、indie/punk→orchestral に裂いていた。gap 中点で 2 線に置換:
#   brilliance < 0.117 -> cinematic/orchestral
#   0.117 <= brilliance < 0.204 -> rock
#   brilliance >= 0.204 -> bass-music
# 閾値根拠は docs/genre_calibration_planning.md。bands 欠落時のみ B-2 の power
# high_ratio split へ fallback（後方互換、rock/EDM は high_ratio が重なるため
# fallback は 2 値据え置き＝rock 判定は bands 必須）。Phase C / Q1-5 Ph2 で再校正。
cultural_context:
  default: general
  rules:
    - id: ctx.electronic_dance
      condition: {bpm_gt: 140, active_rate_gt: 0.8}
      context: electronic/dance
    - id: ctx.ambient_downtempo
      condition: {bpm_lt: 90}
      context: ambient/downtempo
    - id: ctx.bass_music_brilliance
      condition: {low_ratio_gt: 0.4, spectral_bands.brilliance_min: 0.204}
      context: bass-music
    - id: ctx.edm_sub_bass
      # Phase D: 本物 EDM は brilliance が rock 帯に重なる(Strobe 0.146 / Levels 0.202)が
      # sub_bass で分離(rock real/suno ≤0.048 vs edm ≥0.055)。深い sub_bass + 非暗で bass-music。
      condition: {low_ratio_gt: 0.4, spectral_bands.sub_bass_min: 0.052, spectral_bands.brilliance_min: 0.12}
      context: bass-music
    - id: ctx.rock_brilliance
      # Phase D: 下限 0.117→0.105(本物 grunge HSB=0.108 を捕捉、Suno orch ≤0.095 で無影響)。
      # sub_bass_lt 0.052 で深 sub_bass の EDM を除外し rock 単独ラベルを保つ。
      condition: {low_ratio_gt: 0.4, spectral_bands.brilliance_min: 0.105, spectral_bands.brilliance_lt: 0.204, spectral_bands.sub_bass_lt: 0.052}
      context: rock
    - id: ctx.orchestral_brilliance
      condition: {low_ratio_gt: 0.4, spectral_bands.brilliance_lt: 0.105}
      context: cinematic/orchestral
    - id: ctx.bass_music
      condition: {low_ratio_gt: 0.4, high_ratio_gt: 0.017, spectral_bands.brilliance_absent: true}
      context: bass-music
    - id: ctx.orchestral
      condition: {low_ratio_gt: 0.4, high_ratio_lt: 0.017, spectral_bands.brilliance_absent: true}
      context: cinematic/orchestral
    - id: ctx.cinematic_dynamic
      condition: {valley_depth_gt: 0.3}
      context: cinematic/orchestral

instrumentation:
  default: Unknown instrumentation
  rules:
    - id: instr.bass_heavy
      condition: {low_ratio_gt: 0.35}
      summary: Bass-heavy production with prominent low-end
    - id: instr.bright
      condition: {high_ratio_gt: 0.3}
      summary: Bright production with emphasis on highs
    - id: instr.mid_focused
      condition: {mid_ratio_gt: 0.5}
      summary: Mid-focused production
