schema_version: "2.0"

perceptual:
  - id: perc.high_tempo
    condition: {bpm_min: 140}
    labels:
      - {label: high_tempo, confidence: 0.95}
  # brightness の正規センサーは spectral_centroid（Hz, 抽出 sr=22050）。
  # 旧 band-ratio（high/(low+mid+high), >=4kHz）は HF エネルギーの乏しい素材で
  # 0 に張り付き盲目になる（K1 grip 測定で確認、controllability_poc.md §5.1）。
  # 目盛り: dark <= 1200 / neutral 1200-2500 / bright >= 2500。
  # hyp.melancholic の spectral_centroid_max: 2000（非 bright の先例）と無矛盾。
  - id: perc.bright
    condition: {spectral_centroid_min: 2500}
    labels:
      - {label: bright, confidence: 0.90}
  - id: perc.dark
    condition: {spectral_centroid_max: 1200}
    labels:
      - {label: dark, confidence: 0.85}
  - id: perc.bass_heavy
    condition: {low_ratio_min: 0.4}
    labels:
      - {label: bass-heavy, confidence: 0.90}
      - {label: grounded, confidence: 0.80}
  - id: perc.mid_focused
    condition: {mid_ratio_min: 0.45}
    labels:
      - {label: mid-focused, confidence: 0.80}

structural:
  - id: struct.dynamic
    condition: {valley_depth_min: 0.3}
    labels:
      - {label: dynamic, confidence: 0.85}
      - {label: contrastive, confidence: 0.80}
  - id: struct.gradual_motion
    condition: {valley_depth_min: 0.15}
    labels:
      - {label: evolving, confidence: 0.75}
  - id: struct.continuous
    condition: {valley_depth_max: 0.1, active_rate_min: 0.8}
    labels:
      - {label: continuous, confidence: 0.85}
      - {label: wall-like, confidence: 0.75}
  - id: struct.spacious
    condition: {stereo_width_min: 0.7}
    labels:
      - {label: spacious, confidence: 0.85}

semantic_hypothesis:
  - id: hyp.melancholic
    condition: {mode: minor, spectral_centroid_max: 2000, valley_depth_min: 0.15}
    labels:
      - {label: melancholic, confidence: 0.55}
      - {label: introspective, confidence: 0.50}
  - id: hyp.energetic
    condition: {bpm_min: 140, spectral_centroid_min: 2500, active_rate_min: 0.8}
    labels:
      - {label: energetic, confidence: 0.68}
      - {label: driving, confidence: 0.65}
  - id: hyp.cinematic
    condition: {valley_depth_min: 0.3, stereo_width_min: 0.7}
    labels:
      - {label: cinematic, confidence: 0.60}

# --- ジャンル/楽器セクション（旧 semantic_rules.py ハードコードから config 化） ---
# 評価方式: cultural_context は全マッチを収集（dedup・順序保持）、default は no-match 時のみ。
# instrumentation は first-match-wins（旧 elif チェーンを温存。順序が意味を持つ）。
# 注意: 条件演算子は _min(>=)/_max(<=)/==。旧コードの厳密 >/< は >= / <= に丸めた
# （float の境界一致は稀のため挙動差は無視できる）。
#
# orchestral 系ルールは Phase A の **暫定閾値**。harmonic_ratio>=0.78 かつ
# spectral_centroid<=2500 は手元 2 曲（Portals 管弦 harmonic=0.81/centroid=1588 と
# UZA 電子 harmonic=0.71、UZA 生成 harmonic=0.82/centroid=3447=bright で除外）由来。
# defensible な閾値再導出は Phase B（ジャンル校正コーパス）に defer。
# 参照: docs/genre_calibration_planning.md
cultural_context:
  default: general
  rules:
    - id: ctx.electronic_dance
      condition: {bpm_min: 140, active_rate_min: 0.8}
      context: electronic/dance
    - id: ctx.ambient_downtempo
      condition: {bpm_max: 90}
      context: ambient/downtempo
    - id: ctx.bass_music
      condition: {low_ratio_min: 0.4}
      context: bass-music
    - id: ctx.cinematic_dynamic
      condition: {valley_depth_min: 0.3}
      context: cinematic/orchestral
    # Phase A 暫定: 倍音優位かつ非 bright な素材を orchestral として捕捉
    # （旧ロジックでは bass-music に丸められ orchestral を取りこぼした）
    - id: ctx.orchestral_harmonic
      condition: {harmonic_ratio_min: 0.78, spectral_centroid_max: 2500}
      context: cinematic/orchestral

instrumentation:
  default: Unknown instrumentation
  rules:
    # Phase A 暫定: orchestral を bass-heavy より先に判定（first-match-wins）
    - id: instr.orchestral
      condition: {harmonic_ratio_min: 0.78, spectral_centroid_max: 2500}
      summary: Orchestral/acoustic instrumentation with harmonic richness
    - id: instr.bass_heavy
      condition: {low_ratio_min: 0.35}
      summary: Bass-heavy production with prominent low-end
    - id: instr.bright
      condition: {high_ratio_min: 0.3}
      summary: Bright production with emphasis on highs
    - id: instr.mid_focused
      condition: {mid_ratio_min: 0.5}
      summary: Mid-focused production
