schema_version: "1.0"
generator: "musicgen"

# MusicGen PR B（2026-07-03）の実測 K2 型 grip を control_profile 未宣言フィールドの
# 既定値として投入する。score 側の control_profile が同一キーを宣言していれば常に
# そちらが勝つ（docs/control_profile.md 参照）。
# 実測条件: facebook/musicgen-small (revision 4c8334b0…)・CPU・12s×R=8・
# examples/control/k2_musicgen/plan.yaml。
# lyrics_presence は MusicGen では未計測のため記録しない（suno.yaml との差は honesty）。
#
# K2-seg（2026-07-05）: compose が送出する未計測プロンプト欄（active rate / valley
# depth / Avoid / semantic.core / time signature）を同一条件（12s×R=8・同一
# model/revision pin）で追加実測し、5 欄を control_defaults に追記した
# （examples/control/k2_musicgen_segments/plan.yaml・expected_grip.json、実測結果は
# docs/musicgen_backend.md §7.6）。`semantic.avoid` / `semantic.core` はドット付き
# のまま `SEMANTIC_CONTROL_FIELDS`（`compose/models.py`）に登録し、
# `_segments_for` の実描画トークンと一致させている（compile 経路が実際に
# grip_class を引けることを確認済み）。
#
# K2-seg 後始末（2026-07-06、#152 フォローアップ）: 上記 semantic.avoid の attractor 実測
# を受け、musicgen backend は本文 "Avoid: X" セグメントの送出自体を停止する（送出側の
# ルーティング是正・BackendDescriptor.omit_body_negative）。negative_tags への記録は
# 従来どおり維持（楽譜の意図保全）。suno は K2-seg Suno 転移バッチ 1（#162, 2026-07-09）
# の同種実測（d=+4.03）を受けて同様に停止済み。external は不変（実測は Suno 生成に
# 対するもので汎用 external への横展開はしない — #153 と同じ規律）。
#
# バッチ M2（2026-07-13）: §7.6 で確認された 2 件の交絡を M1 規律（30.6 秒・compose
# 実出力 verbatim・事前登録 canonical、AGENTS.md §8「ローカル決定論バッチの canonical
# 条件」#172 適用第二号）で再計測し、以下 3 欄を supersede した
# （examples/control/musicgen_m2_knobs/m2_expected_grip.json）:
#   - active_rate_target: low 処方を "0.55"→"0.30" に拡大（headroom 確保）しても
#     grip は 0.394025→0.414395 とほぼ不変 — loose は §7.6 で疑われた天井
#     アーティファクトでないことが確定（loose 維持、grip 値更新）。
#   - valley_depth_target: セル処方値は §7.6 と同値のまま素材長のみ 12s→30.6s に
#     伸ばしたところ dead（0.152499）→loose（0.3518）に反転 — §7.6 の dead は
#     「ツマミ死」ではなく「12 秒定常ビート素材の valley 床（0.078）」との合流
#     だったことが確定（dead→loose に supersede）。ただし観測絶対値は処方値への
#     追従としてなお部分的（限界は knob_quirks 参照）。
#   - time_signature: §7.6 と同一処方（4/4 / 3/4）で再計測。combined match_rate
#     0.5625 は機械分類で loose に見えるが、per-cell 値（low 1.0 / high 0.125）で
#     事前登録ヌルゲート（high セル match_rate <= low セル match_rate）が発火し
#     dead へ格下げ（dead 維持）。3/4 の初達成は 1/8（§7.6 は 0/8）だが帰属
#     （生成器不達 vs 抽出器 4/4 バイアス）は未分離のまま。
control_defaults:
  bpm:
    grip_class: loose
    grip: 0.21
    sensor: bpm
    evidence: examples/control/k2_musicgen/expected_grip.json
  brightness:
    grip_class: tight
    grip: 2.25
    sensor: spectral_centroid
    evidence: examples/control/k2_musicgen/expected_grip.json
  active_rate_target:
    grip_class: loose
    grip: 0.414395
    sensor: active_rate
    evidence: examples/control/musicgen_m2_knobs/m2_expected_grip.json
  valley_depth_target:
    grip_class: loose
    grip: 0.3518
    sensor: valley_depth
    evidence: examples/control/musicgen_m2_knobs/m2_expected_grip.json
  semantic.avoid:
    grip_class: dead
    sensor: spectral_centroid
    evidence: examples/control/k2_musicgen_segments/expected_grip.json
  semantic.core:
    grip_class: loose
    grip: 1.9
    sensor: "clap:energy"
    evidence: examples/learned/clap/musicgen_segments_semantic_core_contrast_fixture.json
  time_signature:
    grip_class: dead
    sensor: time_signature
    evidence: examples/control/musicgen_m2_knobs/m2_expected_grip.json

# 既知の癖。advisory が非 null のもののみ GeneratedPrompt.advisories を発火する
# （プロンプト本文・tags は変えない＝自動補正しない）。
knob_quirks:
  - field: bpm
    status: observed
    applies_above: 160
    advisory: "MusicGen の高テンポ指定は素朴 bpm センサーが半折り/subharmonic 読みしやすい（170 指定→既定 prior で 86.13×4 / 117.45×2 / 172.27×1、start_bpm=180 の高 prior 再推定では 7/8 が 172.27 に回復、K2-musicgen 2026-07-03）。生成後は R2-2 系診断（高 prior 再推定）での実測確認を推奨。"
    description: "高テンポの抽出器 halving 交絡（loose 判定は knob_dead でなくセンサー半折りが支配的）"
    evidence: "examples/control/k2_musicgen/expected_grip.json / docs/musicgen_backend.md PR B 実測"
  - field: brightness
    status: observed
    advisory: null
    description: "dark 指定で絶対 dark 帯（centroid ≤1200Hz）へ到達可能（3/8、Suno は 0/4 不到達）。ただし分散大（dark 指定で 4517Hz の外れ値 1 本）"
    evidence: "examples/control/k2_musicgen/fixture.json / docs/musicgen_backend.md PR B 実測"
  - field: semantic.avoid
    status: observed
    advisory: "K2-seg 実測（本文 'Avoid: X' が X を正方向に引き寄せる attractor、bright 系 Avoid で centroid d=+1.10 上昇、2026-07-05）に基づき、musicgen backend は本文へ Avoid を送出しない（compose/prompt_renderer.py の BackendDescriptor.omit_body_negative によるルーティング是正・後始末 #152 フォローアップ）。avoid は negative_tags には引き続き保持されるが、MusicGen はネイティブの negative conditioning を持たないため実質 unenforceable — 排除要件は生成後の実測確認を推奨。"
    description: "否定語無視・内容語 attractor 化（本文送出はルーティングで停止・negative_tags 記録は維持）"
    evidence: "examples/control/k2_musicgen_segments/expected_grip.json"
  - field: active_rate_target
    status: observed
    advisory: null
    description: "M2（2026-07-13）で §7.6 の天井交絡を supersede: low 処方を '0.55'→'0.30' に拡大（headroom 0.033→0.192）しても grip は 0.394025→0.414395 とほぼ不変＝loose は天井アーティファクトでないことが確定（旧所見は削除せず本行で上書き）"
    evidence: "examples/control/musicgen_m2_knobs/m2_expected_grip.json（旧: examples/control/k2_musicgen_segments/expected_grip.json、§7.6 12s 計測）"
  - field: valley_depth_target
    status: observed
    advisory: null
    description: "M2（2026-07-13）で §7.6 の dead 判定を supersede: セル処方値据え置き・素材長のみ 12s→30.6s に伸ばしたところ dead（0.152499）→loose（0.3518）に反転＝旧 dead は「ツマミ死」ではなく 12s 定常ビート素材の valley 床（0.078）という物理制約との合流だったと確定。ただし観測絶対値（low mean 0.100837 / high mean 0.139687）は処方値 0.15/0.70 への追従としてなお部分的（限界は残る）"
    evidence: "examples/control/musicgen_m2_knobs/m2_expected_grip.json（旧: examples/control/k2_musicgen_segments/expected_grip.json、§7.6 12s 計測）"
  - field: time_signature
    status: observed
    advisory: null
    description: "M2（2026-07-13）で §7.6 と同一処方（4/4 / 3/4）を再計測し dead を維持（per-cell ヌルゲート: high セル match_rate 0.125 <= low セル 1.0 で発火・combined match 0.5625 単独では loose に誤読しうるため per-cell 併記が必須）。3/4 の初達成は high セル 1/8（§7.6 は 0/8）— 完全不達ではなくなったが、帰属（生成器不達 vs 抽出器の 4/4 バイアス）は未分離のまま"
    evidence: "examples/control/musicgen_m2_knobs/m2_expected_grip.json（旧: examples/control/k2_musicgen_segments/expected_grip.json、§7.6 12s 計測）"

# K3 直交性行列は MusicGen ではまだ実測していないため cross_couplings は記録しない。
# genre calibration（spectral_biases）も MusicGen 生成コーパス未取得のため記録しない。
cross_couplings: []
spectral_biases: []

notes: "PR B 実測（R=8）に基づく初期プロファイル。bpm loose は素朴センサー読み（R2 closeout の規律: faster-side 回復は post-hoc 緩和でありコンパイル時保証には使わない）。brightness は Suno（0.86）より強い tight（2.25）で dark 到達も可能。K3 直交性・genre bias は未計測。実測スコープは facebook/musicgen-small のみ — medium/large 等の未計測バリアントには本 defaults の転移保証がない（backend seam の粒度上コンパイル側はモデル id を知らないため、runbook 側の profile_scope_advisory が stderr で注意喚起する。docs/musicgen_backend.md §7.1）。K2-seg（2026-07-05）: compose 送出プロンプト欄 5 本を同条件で追加実測（tight 0 / loose 2 / dead 3）。semantic.avoid は符号逆転（意図と逆方向に効く attractor）で dead、semantic.core は CLAP energy d=+1.90 と tight 域だが学習センサー由来ノブの昇格ゲート（#126）に従い loose に honesty 固定（docs/musicgen_backend.md §7.6）。バッチ M2（2026-07-13）: §7.6 の active_rate_target / valley_depth_target / time_signature 3 欄を 30.6 秒・compose 実出力 verbatim・事前登録 canonical（AGENTS.md §8 #172）で再計測し supersede。active_rate_target は天井交絡を解消し loose を確定（grip 0.394025→0.414395）、valley_depth_target は 12s 素材制約との合流と判明し dead→loose に反転（grip 0.152499→0.3518・観測絶対値の処方追従はなお部分的）、time_signature は per-cell ヌルゲート（high 0.125 <= low 1.0）が発火し dead を維持（3/4 初達成 1/8・§7.6 は 0/8 だが帰属未分離）。fixture: examples/control/musicgen_m2_knobs/m2_expected_grip.json。"
