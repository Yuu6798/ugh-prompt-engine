# --- human_audit_mode: pin 欄ではなく通常欄（User 外部レビュー PR #317
# P2-2 採用）。DISABLED（既定・今回の User 裁定）は「監査を実施しない」、
# ADVISORY_PREDECLARED は「監査を予定した」の明示宣言 — 結果を見た後に
# advisory audit を追加する余地を塞ぐ。ADVISORY_PREDECLARED を宣言した
# 場合は human_evaluation_protocol_sha が PINNED でなければ
# gate_state() が READY を返さない（run9_schema.gate_state() 参照）。
# holdout 開封後のモード変更は禁止し、SCIENTIFIC_NULL/Identity SHIFTED
# の救済に人間監査を使わない規律は DESIGN_RUN9_REVISION_0.3.md に明記する。
human_audit_mode: DISABLED

# --- performance_source: pin 欄ではなく通常欄（rev 0.4 新設、
# DESIGN_RUN9_REVISION_0.4.md、外部指摘（AQUEST 山崎信英氏）を受けた派生設計変更メモの変更1 +
# 2026-08-25 User 追加裁定「確認メモ / RUN9 用語整理」指示2）。
# `run9_schema.validate_performance_source_block()` が構造を検証する
# （id/role は凍結値へ厳密一致、teacher_terminology_note は非所有の趣旨
# 2要件を含む非空文字列）。既存 teacher 表記（v0.1 §7.4/§11/§19
# R9-G6/R9-G7 等、byte-pin 不変の運用上の呼称）は本欄の新設によって
# 書き換わらない——置換ではなく追加である。teacher_reference 相当の
# 既存 contract 欄は元々存在しない（rev 0.3 で `interventions` 構造へ
# 既に移行済み）。
performance_source:
  id: PJS
  role: EXTERNAL_PERFORMANCE_SOURCE
  rights_manifest_ref: inputs/rights_manifest.json#performance_rights
  teacher_terminology_note: >-
    Teacher は運用上の呼称であり Voice 所有者・Voice Identity Owner を
    意味しない（Voice Source ≠ Performance Source ≠ Performance Author
    の分離は rev 0.4 / inputs/rights_manifest.json の provenance を
    正とする——2026-08-25 User 追加裁定「確認メモ / RUN9 用語整理」
    指示1、DESIGN_RUN9_REVISION_0.4.md §7 逐語収載）。
