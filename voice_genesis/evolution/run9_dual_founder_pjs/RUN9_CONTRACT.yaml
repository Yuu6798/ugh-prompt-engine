# は run9_schema.DESIGN_REVISION の凍結値照合により意図どおり fail-closed
# 拒否される。同 protocol の raw byte sha256 を hypothesis_algebra_sha へ
# PINNED 化する（下記同欄参照）。**本改訂（第2 PR）は上記の事前登録一式の
# 実装までを範囲とし、Birth Gate の実行自体は含まない**（裁定 §8: 実行順
# の区切りどおり——C0/C1/positive reference/d12/PJS confuser/post-learning
# retention のいずれも本 PR 時点では未実測）。
