# RUN9_CONTRACT.yaml — voicegenesis-run-contract/1.0 (DESIGN_RUN9 §23)
#
# R9-G0 (RUN_CONTRACT_COMPLETE): この contract が全 pre-run 欄で status ==
# PINNED になるまで本学習開始禁止。現状の gate_state()（run9_schema.py）は
# "BLOCKED"（pre-run 欄の一部が依然 PENDING — 2026-08-25 User attestation
# 実行により User rights attest 待ちは解消済み（下記「2026-08-25 User
# attestation 実行」節参照）。〔履歴: 本節は当初「founder genome 文書の
# 実体未生成」も残る主因に含めていたが、同日中の RUN9-BIRTH-PREP-1
# （本改訂）で issue_founder_genome_document() により正式発行済み——
# `founders/R9F-01_genome.json`/`R9F-02_genome.json` を書き出し
# `founder_genome_shas` を実 raw sha256 で PINNED 化した（下記
# founder_genome_shas 欄参照）→ RUN9-BIRTH-PREP-1 で解消済み〕。〔履歴:
# 本節は当時「VG-L0 学習ハーネス未実装 + practice/education/learning-
# recipe manifest の実体未生成」を残る主因として挙げていたが、
# 2026-08-25 実 PJS practice split 実行（下記 practice_audio_split_
# manifest_sha 欄参照）で PRACTICE 側 manifest は実体生成・PINNED 済み
# となり解消した〕。残る主因は VG-L0 学習ハーネス未実装 +
# education/learning-recipe manifest の実体未生成のみ）。これは正直な
# 状態表現であり、捏造して PINNED にしていない。
#
# 2026-08-24 User 裁定 5件により design_revision 0.1 → 0.2
# （DESIGN_RUN9_REVISION_0.2.md）。本改訂で af0/ritsu anchor・backbone
# checkpoint が新たに PINNED になった（詳細は各欄の reason/source、および
# DESIGN_RUN9_REVISION_0.2.md を参照）。backbone_runtime_bundle_sha は
# PR #316 第1巡レビュー（P2, 866fcc8）採用により PENDING（bundle 内
# render_code_commit が INFERRED_UNCONFIRMED のため — backbone_checkpoint_sha
# 単体は直接記録4件一致で PINNED のまま）。
#
# 同日、PoR メモ「RUN9 v0.2 PoR整理・設計裁定メモ」の編入により
# design_revision 0.2 → 0.3（DESIGN_RUN9_REVISION_0.3.md）。PoR メモは
# 自称 "v0.2 design revision input" だが、rev 0.2 が既にマージ済みのため
# 本編入は rev 0.3 として発行する（詳細は同ファイル冒頭「番号注記」）。
# 核心は `LEARN_PERFORMANCE` 単一エッジを CONTROL / PRACTICE_FROM_AUDIO /
# TRANSFER_TECHNIQUE の三枝へ分離する改訂A — `single_intervention` を
# `interventions` 構造へ改める（旧 "0.1"/"0.2" 形式の contract は
# run9_schema.DESIGN_REVISION の凍結値照合、および
# `interventions`/`single_intervention` キー不一致の双方で意図どおり
# fail-closed 拒否される）。
#
# 2026-08-25 外部指摘（AQUEST 山崎信英氏）を受けた派生設計変更メモ
# （DERIVED_DESIGN_CHANGES_FROM_EXTERNAL_FEEDBACK_20260825.txt、byte-pin
# 不変）の編入により design_revision 0.3 → 0.4（DESIGN_RUN9_REVISION_0.4.md）。
# 山崎氏に帰属するのは外部指摘の核心（VoiceBank に歌い方情報はほぼ含まれず、
# Voice Source の権利者 ≠ Performance の権利・来歴主体、の分離指摘）のみ
# ——「変更1」〜「変更8」の具体設計・schema・gate 拡張はこの指摘を受けて
# 我々が起草した派生設計であり、山崎氏の逐語著述ではない（本ファイルは
# 2026-08-25 まで当該メモ・ファイルを「外部レビュー原文」と誤って特徴付け
# ていた — 実在の外部者への誤帰属だったため P0 訂正。詳細は
# DESIGN_RUN9_REVISION_0.4.md「P0 訂正」節）。
#
# rev 0.4 実装時、User 裁定「aとbを承認」の b により
# `backbone_runtime_bundle.json` の `render_code_commit.status` を
# INFERRED_UNCONFIRMED → USER_ATTESTED へ一時昇格したが、これは過大
# だった（2026-08-25 User 追加裁定①）: render_code_commit は RUN6 の
# 歴史的 export provenance であり、歴史的事実は遡って attest しない。
# 同日中に INFERRED_UNCONFIRMED へ差し戻し、代わりに RUN9 が今後の
# render に使用する commit を独立に前方宣言する新欄
# `run9_render_code_commit`（status: DECLARED_FOR_RUN9）を新設した
# （値は同じ e2307b1 だが意味論は歴史的推定と独立 — 詳細は下記
# backbone_runtime_bundle_sha コメント参照）。`backbone_runtime_bundle_sha`
# はこの構造変更を反映して実バイト sha を再計算し PINNED を維持（旧値
# b92dac0e... は履歴として同コメントに保持）。
#
# 同追加裁定②により rights_manifest.json の provenance を是正
# （performer/composer に外部資料出典付きで Junya Koguchi を充填、
# voice_source.owner の主体誤り訂正、placeholder 語彙を
# `<PENDING_USER_ATTESTATION>`＝User 帰属欄専用 /
# `<UNRESOLVED_EXTERNAL>`＝外部事実欄専用へ分離、CC BY-SA 4.0 の
# share-alike 義務が合成出力へ及ぶかは事実でなく解釈である旨を
# `interpretations` 節で分離）。同③により
# `run9_schema.PERFORMANCE_TRAIT_VOCAB` を `PERFORMANCE_RESIDUAL_VOCAB`
# へ改名（既存 TRAIT_CONTROL 層との用語衝突回避、9項目の中身は不変）。
# 新設トップレベル欄 `performance_source`（2026-08-25 User 追加裁定「確認メモ
# / RUN9 用語整理」指示2）は既存 pin 値・構造を破壊しない追加のみ——
# teacher_reference 相当の既存欄は元々存在しない（rev 0.3 で
# `interventions` 構造へ既に移行済み）。旧 "0.1"〜"0.3" 形式の contract は
# run9_schema.DESIGN_REVISION の凍結値照合、および必須キー
# `performance_source` の欠落により意図どおり fail-closed 拒否される。
#
# 2026-08-25 User attestation 実行（本セッション、User 裁定「承認する」
# — 宣誓文・署名者・日時は inputs/rights_manifest.json
# voice_identity_rights.attestation / history に逐語記録）: 同ファイルの
# voice_identity_rights.attestation を pending 形態から attested 形態へ
# 遷移し（attested_by="Yuu6798" / attested_at="2026-08-25T06:47:25Z"）、
# rights_class/consent_status を PENDING_USER_ATTESTATION から
# USER_ATTESTED_OWN_VOICE へ、usage_grants.run9_identity_anchor を
# not_granted から granted へ更新した（raw_audio_publication /
# model_general_distribution は rev 0.2 改訂4の別承認規定により
# not_granted のまま不変）。attest 後の rights_manifest.json 全体の正規形
# sha256（af0_anchor_manifest.json / identity_metric_space.json と同一の
# 規約 — canonicalization_method 参照）を
# domains/identity_domain_run9_v1.json anchor_hashes.user へ直接 pin した
# （旧 `<PIN_BEFORE_RUN>` を実値
# e2755c3db6283e40e5080c5de75a70bb8b88e275e548848b1e2e5b8f4bb512d1 へ
# 置換）。これにより3 anchor（af0/ritsu/user）+ metric_space_sha が全て
# 実 64hex sha256 となり `Run9IdentityDomain.is_pinned()` が初めて True
# を返す（domain 凍結）。凍結の結果、`run9_schema.build_founder()` が
# 現行 domain draft から R9F-01/R9F-02 の genome_id を決定論的に計算
# 可能になった（実測当時: R9F-01 = 2f7df5a90a6c99c9 / R9F-02 =
# 9cd047c667dcb96e、両者相異・再計算で不変であることを確認済み）。
# 〔履歴: `founder_genome_shas` が pin する対象は genome_id ではなく永続
# genome 文書ファイル（founders/R9F-0x_genome.json）バイトの sha256 で
# あり（下記コメント参照）、当時はその文書を実際に `founders/` へ書き出
# して正式発行する builder・pin 手続きが本 repo に配線されておらず
# （事前配線テストも存在せず）、`founder_genome_shas` は本改訂（User
# attestation 実行時点）でも引き続き PENDING のままだった（下記該当欄の
# reason 参照。捏造 PIN はしない）→ 同日中の
# issue_founder_genome_document() 新設・founders/ への正式発行・実 raw
# sha256 での PINNED 化（下記 founder_genome_shas 欄参照）→
# RUN9-BIRTH-PREP-1 で解消済み〕。
#
# 2026-08-25 追記（Codex bot レビュー PR #320 第1巡指摘, P1, 採用, Fix 1）:
# 上記の anchor_hashes.user binding は「rights_manifest.json 全体」の
# 正規形 sha256 だったため、User donor 録音・attestation 自体は不変でも
# 同一文書内の PJS 側外部未解決欄（performance_rights/composition_rights/
# recording_master_rights 配下の `<UNRESOLVED_EXTERNAL>` 欄）が将来解決
# されるだけで anchor が動いてしまう binding scope 過大の欠陥だった。
# binding 対象を `run9_schema.extract_voice_identity_rights_layer()` が
# 返す **voice_identity_rights 層のみ**の正規形 sha256 へ是正し、repin した
# （旧値 e2755c3db6283e40e5080c5de75a70bb8b88e275e548848b1e2e5b8f4bb512d1
# から domains/identity_domain_run9_v1.json anchor_hashes.user の現行値
# へ更新——詳細・理由は同ファイル pin_source_candidates.user と
# inputs/rights_manifest.json voice_identity_rights.binding_note を正と
# する）。連動して genome_id も再計算される（当時実測: R9F-01 =
# f5ea253804728b3b / R9F-02 = 72423141c1add7e8、上記旧値から相異・
# 再計算で不変であることを確認済み）——RUN9 は出生前（founders/ への
# 永続 genome 文書の書き出し・render とも未実施）のため科学的影響はない。
#
# 2026-08-25 追記（Codex bot レビュー PR #320 第2巡指摘, P1, 採用, Fix 3）:
# 上記 Fix 1 の binding（voice_identity_rights 層全体）も usage_grants /
# usage_grants_note を含んでおり、raw_audio_publication /
# model_general_distribution の別承認（rev 0.2 改訂4が定める設計上正規の
# 可変状態）が発生するたびに anchor が動く欠陥（据え置けば stale pin・
# 追随すれば不要な genome_id 変動という Fix 1 で解消したはずの二律背反の
# 再発）だった。binding 対象を新設
# `run9_schema.extract_user_identity_attestation_projection()` が返す
# 「不変 identity-attestation projection」（schema/source_layer/
# donor_ledger_source/donor_ledger_schema/transcribed_at/entries/
# rights_class/consent_status/attestation の閉じた9キーのみ——
# usage_grants 系・role/note/usage_grants_note/binding_note の散文欄・
# schema_legacy を除外）へさらに再限定し、repin した（旧値
# ad54200af4d42433439702946aa65e4a38848f3d8ec0e52140b351e2a9afae6b から
# domains/identity_domain_run9_v1.json anchor_hashes.user の現行値へ
# 更新——詳細・理由は同ファイル pin_source_candidates.user と
# inputs/rights_manifest.json voice_identity_rights.binding_note を正と
# する）。連動して genome_id も再計算される（実測: R9F-01 =
# 66f420672a154283 / R9F-02 = 63f4b8f24b827cd4、上記旧値から相異・
# 再計算で不変であることを確認済み）——RUN9 は出生前のため科学的影響は
# ない。
#
# 各欄の pin 状況は {value, status, reason, source?} 形（VG_FOUNDRY の
# debt/RUN_CONTRACT_SCHEMA_v1.json pinned_field 慣習に倣うが独立実装 —
# run9_schema.py 参照）。status ∈ {PINNED, PENDING, BLOCKED}。
#
# artifact_manifest_sha / cost_record_sha は post-run 専用欄（実行後にのみ
# 実測できる証拠欄）で、gate_state() の pre-run READY 判定から除外される
# （run9_schema.CONTRACT_POST_RUN_PIN_FIELDS）。

schema: voicegenesis-run-contract/1.0
run_id: RUN9
experiment_id: VG-R9-DUAL-FOUNDER-PJS
design_revision: "0.4"
design_doc: voice_genesis/evolution/run9_dual_founder_pjs/DESIGN_RUN9_TRI_DONOR_DUAL_FOUNDER_PJS_LEARNING_v0.1.md

# rev 0.3 改訂A（DESIGN_RUN9_REVISION_0.3.md、PoR §1/§3/§4）: 旧
# single_intervention（単一 changed_edge = LEARN_PERFORMANCE）を廃し、
# r0 から3枝（CONTROL 無介入 / PRACTICE_FROM_AUDIO 稽古 /
# TRANSFER_TECHNIQUE 教育）へ分岐する interventions 構造へ改める。
interventions:
  # Codex bot レビュー第6巡 Fix B 採用（c5f4205, P2）: 「両枝が同一のrecipeを共有する」という旧記述は
  # PoR §8 の等価性規定と矛盾する誤記だった是正済み文言。recipeは枝別
  # （PRACTICE_FROM_AUDIOとTRANSFER_TECHNIQUEは情報量が本質的に異なる
  # 非対称フローであり、この非対称性そのものが実験変数 — 改訂C参照）。
  # 等条件・等予算が要求されるのは各枝「内」の二体間（同一split・同一
  # 探索空間・同一試行回数・同一render予算・同一評価器・同一停止規則、
  # PoR §8）のみで、PRACTICEとEDUCATIONを「同じ入力」として扱わない。
  description: >
    固定された二つのFounder r0へ、同一PJS教師（音声そのもの=稽古、
    抽出Technique lesson=教育）を枝別recipeで適用する（稽古と教育は
    情報量が異なる非対称フローであり、recipeを共有しない）。各枝の内部
    では二体（R9F-01/R9F-02）へ同一探索空間・同一試行回数・同一budget・
    同一評価器・同一停止規則を適用し、無介入replay（CONTROL）を対照
    として三枝を比較する。
  edges:
    - PRACTICE_FROM_AUDIO
    - TRANSFER_TECHNIQUE
  control_branch: CONTROL
  # Codex bot レビュー PR #318 第7巡 Fix 20 採用（P1）: C0/C1 校正標本の
  # per-founder テイク数を契約 pin する。旧 identity_metric_space.json
  # calibration.freeze_threshold.d_c0_population は「テイク数は本
  # RUN9_CONTRACT.yaml の interventions 規定に従って束縛する」と書きながら、
  # 実体となる欄がこの契約に存在しない欠陥（存在しない参照への委譲）
  # だった。本欄がその実体であり、founder 1体あたりの値（両 founder 共通の
  # 同数、pooling はしない — identity_metric_space.json calibration 節参照）
  # を PINNED で凍結する。
  c0_replay_takes_per_founder:
    value: 20
    status: PINNED
    reason: >-
      P95 線形補間が最大値外挿にならない最小標本数（n=20 で P95 の分位
      position = 0.95*(20-1) = 18.05、上位2標本間の線形補間となり最大値
      そのものへの外挿を回避できる最小 n）。identity_metric_space.json
      calibration.freeze_threshold の theta_cal(F) = P95(D_C0(F)) が
      本欄をテイク数（founder 1体あたり）の束縛元としてフィールド名で
      参照する。
  c1_sham_takes_per_founder:
    value: 20
    status: PINNED
    reason: >-
      同上（P95 線形補間が最大値外挿にならない最小標本数、n=20 で
      position 18.05・上位2標本間の補間）。identity_metric_space.json
      calibration.validity_gates.c1_gate の D_C1(F) が本欄をテイク数
      （founder 1体あたり）の束縛元としてフィールド名で参照する。

baseline_run: null

