# theta_cal(F)=P95(D_C0(F)) が C0 母集団全ゼロの下で解析的に 0 へ退化する
# ことが Birth Probe 実行前に確定したため行う pre-run design correction
# （観測後の救済ではない、裁定前文逐語）。Birth Identity Separation だけ
# でなく学習後 Identity 保持判定を含む Identity decision protocol 全体を
# 新規 `inputs/identity_decision_protocol_v0.6.json`
# （`run9-identity-decision-protocol/0.6`）として再事前登録する——同
# protocol は identity_metric_space.json の feature/distance 定義（無改変）
# を参照した上で、同ファイルの calibration 節（freeze_threshold/
# validity_gates/decision_rule）のみを rev 0.6 実行について supersede
# する。裁定逐語「design_revisionを0.6へ上げ...発行済みFounder Genome、
# coords、genome_id、speaker map、TRI_CROSSOVER/1.0は変更しない」に従い、
# 契約レベルの design_revision を実際に昇格する（本欄・run9_schema.
