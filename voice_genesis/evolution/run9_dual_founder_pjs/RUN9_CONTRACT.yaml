# 再計算で不変であることを確認済み）——RUN9 は出生前のため科学的影響は
# ない。
#
# RUN9-L0-HARNESS-3a（2026-08-26）: User 裁定「RUN9 User裁定 — AF0
# runtime mapping」（DESIGN_RUN9_REVISION_0.5.md、repo 内収載
