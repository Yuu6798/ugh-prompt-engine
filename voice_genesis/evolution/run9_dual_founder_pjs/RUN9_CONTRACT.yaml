# --- backbone_runtime_bundle_sha: inputs/backbone_runtime_bundle.json の
# **ファイル実バイトの sha256**（design_doc_sha256 と同一規約 —
# run9_schema.compute_file_sha256() 参照。Codex bot レビュー PR #316
# 第8巡指摘A採用: 旧 reason 文言が「正規形 sha256」と混在していたため
# 統一した）。af0_anchor_manifest.json の anchor_hashes.af0 pin だけは
# 意図的な例外で正規形（canonical）規約を使う — 両者を混同しないこと
# （compute_file_sha256() の docstring に規約差の理由を記載）。
# bundle 内に PENDING 相当の欄が残る場合はこの欄も PENDING と
# し理由に「bundle 内 PENDING 解消後に pin」と記す規約。
# Codex bot レビュー PR #316 第1巡指摘（P2, 866fcc8, 採用）: bundle 内
# render_code_commit は当時 status: INFERRED_UNCONFIRMED（直接記録ではなく
# run4-8 一貫性からの推論値。RUN6 export 記録 s5_record 自体には commit
# 明記なし）だったため、本欄も PINNED から PENDING へ降格していた
# （backbone_checkpoint_sha は直接記録4件一致のため対象外・PINNED のまま）。
# 完全性の宣言（PR #316 第2巡指摘、1e84892、採用）: acoustic checkpoint/
