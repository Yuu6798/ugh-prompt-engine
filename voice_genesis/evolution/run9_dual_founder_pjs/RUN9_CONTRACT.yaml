# `run9_schema.verify_execution_profile_runtime(contract, ...)` として
# 呼ぶこと。manifest dict を直接注入できる公開経路はこれで存在しない。
#
# 2026-08-26 repin（PR #327 Codex レビュー第15巡指摘27、P2、上限10ラウンド
# 超過後だが3分類「将来汚染」に該当する新しい具体経路として採用。Claude
# 完結ルート）: 第14巡 cross-check (8)（`_cross_check_measured_source_
# line_text()`）は `source_line_text` を持つ2項目（onnxruntime_selected_
