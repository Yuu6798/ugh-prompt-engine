# run9_schema.DESIGN_REVISION 定数・design_revision_doc_sha256 pin の
# 三箇所を同時に更新——rev 0.2→0.3→0.4 と同じ手順）。旧 "0.1"〜"0.4"
# 形式の contract は run9_schema.DESIGN_REVISION の凍結値照合により意図
# どおり fail-closed 拒否される。方式A（ritsu/user 再正規化線形合成）・
# AF0 unrealized mass 明記義務・非主張3点・Birth Identity Separation
# Gate の別途実行は expected_speaker_map_sha 欄参照。
#
# RUN9-L0-HARNESS-3c rev 0.6（2026-08-27、第2 PR フェーズ1）: User 裁定
# 「RUN9 User裁定 — Identity Calibration Degeneracy / design_revision 0.6」
# （DESIGN_RUN9_REVISION_0.6.md、repo 内収載
# USER_ADJUDICATION_20260827_IDENTITY_REV06.txt）の採用により design_
# revision 0.5 → 0.6。既存の render replay byte 決定論実測（RUN9-L0-
