schema: vg-d5-claim-strength/0.1
debt_ref: VG-DEBT-005
purpose: run5-7 の claim（因果・効果・比較・裁定・撤回の主張文）へ claim 単位で causal_evidence_strength を付与する（debt_adjudication_v1.1.yaml 裁定1の実現形態）。既存 verdict は source_verdict として原文保存し、正本 record （s4/s5/s6_record）は一切改変しない。
algebra:
  authority: Fable 設計判定・2026-08-22・PR レビューで User 確認
  vocabulary:
  - strong
  - moderate
  - suggestive
  - descriptive
  class_vocabulary:
  - intervention_effect
  - mechanical_verification
  - observation
  - adjudication
  - process
  rule: strong は sha256/API 実測などの機械検証のみ（claim_class == mechanical_verification を必須とする）。moderate はインフラ根治の非再発実測・対照群つき裁定・バイト同一性による帰属訂正など、部分的機械裏付けを持つ主張。suggestive は単一介入 + baseline 対比の耳判定や、ブラインド反復の存在主張など、方向性は示すが反復走行を経ていない主張。descriptive はそれ以外の全て（生耳判定の逐語記録・相関観測・process/運用記録・record 自身が帰属を保留した裁定を含む）。
  non_upgrade_principle: 'record が「言えない」「帰属できない」「undetermined」「意図的に置かない」と明記した内容は、本台帳がそれより強い strength へ格上げしない（該当 claim はいずれも descriptive のまま — 例: R6-C12/C17/C20, R7-C14/C15/C16/C20/C24/C30）。'
  rationale_codes:
    MB: バイト/hash/API 実測の機械検証
    INFRA: 根治 + 後続 run 非再発
    CTRL: 対照群つき負結果（Q11 系・ritsu 対照 + pin 済み計測）
    BYTE-ATTR: バイト同一性による帰属訂正
    SI-E: 単一介入 + baseline の耳判定
    BLIND: ブラインド反復の存在主張
    CORR: 相関観測・交絡未分離
    OBS: 観測/process/裁定・record 自身が帰属保留
counts:
  total: 83
  run5: 26
  run6: 27
  run7: 30
  strong: 9
  moderate: 13
  suggestive: 13
  descriptive: 48
