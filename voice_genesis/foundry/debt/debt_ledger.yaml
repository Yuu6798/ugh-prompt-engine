        - H0–H5 の supported/refuted/undetermined 裁定
    repayment:
      method: B-1 凍結直後に participating axes / direction / tolerance / minimum supporting cells 等を凍結
      evidence_required:
        - tolerance の導出根拠（同一条件反復誤差・process間再現誤差・数値量子化誤差からの導出）
        - worked example
      evidence_delivered:
        - "voice_genesis/foundry/results_s7/s7_b2_verdict_algebra.json（schema: s7-b2-verdict-algebra/0.1。H0–H5 それぞれの participating_axes/contradiction_rule/direction/tolerance/minimum_supporting_cells/final_aggregation を凍結。epsilon_raw_from_b1 に4軸の ε 導出根拠（measurement-side only: 反復誤差+量子化幅）、worked_example に検算例を記載）"
        - "voice_genesis/foundry/results_s7/s7_run8_closeout.md §3（『B-1 / B-2 の凍結（事前登録の順序規律を3系列すべてで維持）』を達成として記帳）"
      note: "H0–H5 の裁定の実施そのもの（supported/refuted/undetermined の実際の判定）は未達（closeout §3『未達: H0–H5 の裁定』）。本 debt のスコープは代数（判定規則・tolerance・集約規則）の凍結であり裁定の実施ではないため、worked example つきで pin されている本状態で充足する。"
    status: repaid
    adjudication_ref: "voice_genesis/foundry/results_s7/s7_run8_closeout.md §3、voice_genesis/foundry/results_s7/s7_b2_verdict_algebra.json"
    close_condition:
      - B-2（H0–H5 裁定代数）が worked example つきで pin されている

