schema: voicegenesis-debt-ledger/0.1
# スキーマ定義元 = DEBT_REPAYMENT_PLAN_v1.0.md §7「Debt Ledger」
# status 語彙は {open, in_progress, repaid, accepted_residual, unrecoverable} のみ
# （v1.0 §7 逐語。unrecoverable は失敗ではなく証拠境界の明示）
# 任意フィールド: blocked_by（他 debt_id への参照）/ adjudication_ref（裁定文書内の節）/
#                 source_verdict（causal_evidence_strength と併存する既存ラベルの原文保存）

debts:
  - debt_id: VG-DEBT-001
    scope: run7
    class: research
    priority: P0
    problem:
      summary: run-level determinism unknown（run7 の bit 一致再現性が未検査）
      source: "voice_genesis/foundry/DESIGN_S7_run8.md §9-0（run 8-R = run 7 の完全同一設定での反復走行。bit 一致/非一致で因果裁定の可否が分岐する契約）"
    impact:
      affected_claims:
        - run8-B 由来の効果と学習ドリフトの分離
        - run5-7 世代間比較（H5）の走行間変動評価
    repayment:
      method: "Run 8 継続としての run8-R は実行しない（Run 8 = CLOSED）。返済は closeout §5 に従い、別の観測研究として再事前登録した決定論反復（run7 と同一契約の bit 一致検査を新 experiment ID で実施）による"
      evidence_required:
        - 新 experiment ID の checkpoint sha256
        - 新 experiment ID の ONNX sha256
        - 新 experiment ID の fixed probe wav sha256
        - "digest(新experiment.dataset) == digest(run7.dataset) の assert"
      note: "Run 8 は 2026-08-22 User 裁定で CLOSED（8-B/8-R とも未実行のまま。voice_genesis/foundry/results_s7/s7_run8_closeout.md §3『未達: Run 8-B（有料の学習）への進行 — BLOCKED のまま』）。再入は Run 8 継続版としてではなく、別の観測研究としての再事前登録経由（closeout §5『1.3 は作らない。層化設計の再実装にも進まない […] Run 8 の継続版ではなく別の観測研究として再事前登録する』）。関連所見: voice_genesis/foundry/results_s7/s7_reproducibility_finding.md（reference_output 再測定 > samples_sha256 > wav_sha256 という pin 意味論の訂正。ONNX 再 export はグラフシリアライズ差で samples_sha256 は不一致になるが、測定値は全軸 ε 内で再現する）"
    status: open
    adjudication_ref: "voice_genesis/foundry/results_s7/s7_run8_closeout.md §3/§5"
    close_condition:
      - "新 experiment ID の再事前登録を経た決定論反復で bit 一致（または sigma_between 推定つき k>=2 反復）が裁定されている"

  - debt_id: VG-DEBT-002
    scope: run8-B1
    class: research
    priority: P0
    problem:
      summary: B-1（TRF 主観測4値の測定仕様）が未凍結
      source: "voice_genesis/foundry/DESIGN_S7_run8.md §12-0-A/§12-0（B-1/B-2 の二段階凍結。meta-contract freeze は本 memo で完了・数値凍結は PR-1 の校正実測が未実施）"
    impact:
      affected_claims:
        - run8-0 Gate 1 判定
        - run5-7 の現行測定規約による再測定（VG-DEBT-004 の前提）
    repayment:
      method: "PR-1 の calibration harness で校正音源のみを通し TRF measurement spec / 1.0 として凍結（達成形態: spec 1.2。1.0 表記は策定時の想定版数 = note 参照）"
      evidence_required:
        - calibration set の構成記録
        - 凍結された analysis window / hop / F0判定 等の値一式（DEBT_REPAYMENT_PLAN_v1.0.md §3 A-1 の凍結対象リスト）
      evidence_delivered:
        - "voice_genesis/foundry/results_s7/trf_measurement_spec_1_2.json（spec_version: 1.2-rc1、schema: s7-trf-measurement-spec/1.0。excess_tail_voiced_ms / release_after_score_boundary_ms / tail_f0_persistence の3軸が status: frozen。frozen_parameters: threshold=0.2, window_ms=100, hop_ms=10, retuning=禁止）"
        - "voice_genesis/foundry/results_s7/s7_trf_spec_1_2_applicability.json（ruling.voicing_3_axes = 『production resolution 成立。Gate 1 の人間検証へ進行可能』、production_applicability.voicing_3_axes = ESTABLISHED）"
        - "voice_genesis/foundry/results_s7/s7_run8_closeout.md §2-1"
      note: "1.0 では凍結条件（production_range_resolution）に到達せず、1.1 を経て 1.2（形状ベース・振幅不変の検出器 = S_melshape_core_distance）で初めて凍結が成立した（closeout §2-1『Run 8 の核心だった「本番セルを分解できる計器」は、3系列目で初めて成立した』）。凍結は次の境界つきで成立する: (a) voicing 3軸（excess_tail_voiced_ms / release_after_score_boundary_ms / tail_f0_persistence）は production-range resolution が ESTABLISHED（本番縮退群 1–2/10。1.0 は 3–8/10、1.1 は 8/10 だった）。(b) terminal_mel_persistence は現行観測設計では unavailable（closeout §2-2: 終端窓 mel パワー比は相対エネルギー量そのものであり、経路床 0.319 が本番中央値 0.207 を上回る逆転を相続し、3 mel 候補とも production_range_resolution の分離が負（−0.030〜−0.037）。1.0/1.1 の『mel 軸は非縮退』は振幅のばらつきを測っていただけだったとの訂正記録つき）。spec 全体の trf_measurement_spec_1_2.json 内 freeze_status フィールドはこの境界のため blocked のままだが、本 debt のスコープ（voicing 主観測の数値凍結）はこの境界つきで充足する。当初の想定バージョン『1.0』は 1.2 へ置き換わった。"
    status: repaid
    adjudication_ref: "voice_genesis/foundry/results_s7/s7_run8_closeout.md §2-1/§2-2、voice_genesis/foundry/results_s7/s7_trf_spec_1_2_applicability.json"
    close_condition:
      - "TRF measurement spec / 1.0 が pin され、本番360セルを1セルも見ずに確定したことが記帳されている（達成形態: spec 1.2。1.0 表記は策定時の想定版数 = note 参照）"

  - debt_id: VG-DEBT-003
    scope: run8-B2
    class: research
    priority: P0
    problem:
      summary: B-2（H0–H5 の裁定代数）が未凍結
      source: "voice_genesis/foundry/DESIGN_S7_run8.md §12-0-A/§12-0（B-2 は B-1 凍結後・同一 PR 内で凍結する契約）"
    impact:
