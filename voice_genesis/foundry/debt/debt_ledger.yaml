      summary: run-level determinism unknown（run7 の bit 一致再現性が未検査）
      source: "voice_genesis/foundry/DESIGN_S7_run8.md §9-0（run 8-R = run 7 の完全同一設定での反復走行。bit 一致/非一致で因果裁定の可否が分岐する契約）"
