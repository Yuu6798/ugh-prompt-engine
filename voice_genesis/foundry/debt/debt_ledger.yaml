        - run 間比較（run8-0 台帳の H-TTD 等）
    repayment:
      method: "凍結済み TRF measurement spec 1.2（voice_genesis/foundry/results_s7/trf_measurement_spec_1_2.json。voicing 3軸: excess_tail_voiced_ms / release_after_score_boundary_ms / tail_f0_persistence）で run5-7 の fixed probe を再測定。実行手順は voice_genesis/foundry/debt/d4/d4_remeasure_spec.json（1.2/計器/ハーネス/セル定義を sha256 pin した事前登録。measurement より前にコミット済み）+ d4_runner.py（render/measure 二相・起動時に spec 自身と pins 全件を実ファイルと照合し不一致は abort・結果 JSON に spec sha256 を束縛）として machine-independent 部分の配線は完了。実測実行そのもの（render サブコマンド。checkpoint 実体依存）は machine-dependent のため別途"
      evidence_required:
        - run5/run6/run7 各 checkpoint からの再生成 wav sha256
        - "TRF measurement spec 1.2 適用後の軸値（voicing 3軸のみ。terminal_mel_persistence は unavailable のためスコープ外）"
      note: "checkpoint 実体は repo 非同梱（voice_genesis/README.md『WAV は非同梱』節と同型の運用）のため実測実行自体が machine-dependent。B-1（1.2 として凍結。VG-DEBT-002 参照）により unblocked — 実行の前提はもはや欠けていない。実行は checkpoint 実体依存で machine-dependent のまま。計画時点（DEBT_REPAYMENT_PLAN_v1.0.md §4）の『current TRF v1.0』は『凍結済み測定仕様』を指す想定表記であり、実現形態は 1.2（v1.0 の検出器は本番セルで 3–8/10 群縮退のため棄却された = voice_genesis/foundry/results_s7/s7_run8_closeout.md §2-1）。terminal_mel_persistence は現行観測設計では unavailable（closeout §2-2）であるため、再測定のスコープは voicing 3軸に限る。"
    status: open
    close_condition:
      - "run5-7 全てで凍結済み TRF measurement spec 1.2（voicing 3軸）再測定が完了し軸値が記帳されている"

