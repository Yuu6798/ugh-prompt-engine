# RUN10_CONTRACT.yaml — voicegenesis-run-contract/1.1 (DESIGN_RUN10 §23)
#
# 正本設計は Drive 上の凍結文書
# `VoiceGenesis_RUN10_AQUEST_VG_Phenotype_Compatibility_Audit_v0.4.md`
# （実バイト sha256 = cc05f0254aa1ee4a7302edac847a3d07d2fd385f115865185bcfe1343a350957）。
# 文書本文は本 public リポジトリへ commit しない（§2.2 — private_boundary.py が機械強制）。
#
# 現状: R10-G0 (RUN_CONTRACT_COMPLETE) = BLOCKED。
# Core 欄にはなお PENDING が残る。これは正直な状態表現であり、捏造して PINNED に
# していない。2026-08-28 時点で A0 inventory、標準 UTAU toolchain、private storage、
# cost cap は実測または User 裁定により凍結済み。残る主因は 2 系統:
#
#   (a) neutral carrier / UST と UTAU ExecutionProfile、A0 recorded pitch inventory。
#   (b) rights archive、measurement/calibration、V1、blind/evaluation 手順等の未実装成果物。
#
# AF0 / AF-P0 historical reference は User 裁定により Hard 判定へ使わず BLOCKED。
# Primary VoiceGenesis reference は AF01 v1.0 のままである。
#
# design_revision の erratum: 文書ヘッダと §37 は v0.4 だが §23/§27 の雛形は
# "0.3" のまま。v0.4 で AF01 凍結登録という実体的改訂が入っているため、
# 本 contract は "0.4" を正典とする（run10_schema.py モジュール docstring 参照）。

schema: voicegenesis-run-contract/1.1
run_id: RUN10
experiment_id: VG-R10-AQUEST-VG-PHENOTYPE-COMPATIBILITY
design_revision: "0.4"
design_doc: VoiceGenesis_RUN10_AQUEST_VG_Phenotype_Compatibility_Audit_v0.4.md
# 題名だけでは同題名の差し替えと区別できないため、実バイト sha256 を契約欄として持つ。
# 設計文書は本リポジトリへ置かない（§2.2）ので、これが唯一の来歴束縛である。
design_doc_sha256: cc05f0254aa1ee4a7302edac847a3d07d2fd385f115865185bcfe1343a350957

performance_analysis: OUT_OF_SCOPE
identity_copy: PROHIBITED
publication_scope: PRIVATE_ONLY

staged_intervention:
  phase_a:
    description: >
      介入なし。AquesTalk由来UTAUデフォルト音声とVoiceGenesis由来人工音声を、
      VoiceGenesis内部controlと独立E0 controlで事前校正したSource / Identity形質測定系で比較し、
      互換・差分・未説明特徴を記録する。
    changed_edge: NONE_OBSERVATIONAL_AUDIT
  phase_b:
    activation: CONDITIONAL
    description: >
      Phase AとPHASE_B_ENTRYをPASSした既存VoiceGenesis schema内形質だけを、
      G_null / G_target / G_inverseで因果検証し、生成に未使用のconfirmation meterを含めて
      generative compatibilityを評価する。
    changed_edge: SYNTHESIS_VALIDATION

supersedes:
  - document: VoiceGenesis_RUN10_Known_Performance_Trainability_Test_v0.1
    status: SUPERSEDED_BEFORE_EXECUTION

