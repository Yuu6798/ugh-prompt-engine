[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svp-rpe"
version = "0.1.0"
description = "SVP (Semantic Vector Prompt) + RPE (Reverse Prompt Engineering) — UGHer ecosystem prompt infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Yuu6798"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    # librosa 1.0 は pyin/pitch 系の挙動が変わり、観測ゲート（voiced_coverage 全ゼロ化）と
    # RPE スナップショット（hashes.txt ドリフト）を壊す実測あり（PR #259 CI・2026-08-13）。
    # 1.0 系への移行は snapshot 再生成と観測ゲート再校正を伴う専用 PR で行う。
    "librosa>=0.10,<1.0",
    "soundfile>=0.12",
    "pydantic>=2.0",
    "click>=8.0",
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pyloudnorm>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "mir_eval>=0.7", "hypothesis>=6.0"]
separate = ["demucs>=4.0"]
# beat_this (CPJKU) — MIT-licensed beat/downbeat detection. dbn=False is
# enforced inside the adapter so madmom never enters the dependency tree.
# Version range is provisional; tighten after PyPI / py3.11+ compatibility
# verification (see docs/learned_models_policy.md).
beat = ["beat_this"]
# panns_inference (qiuqiangkong) — AudioSet 527-class tagging. PyPI
# distribution is "panns-inference"; import name is "panns_inference".
# Pretrained weights are downloaded lazily by upstream on first use and
# have their own provenance — do NOT widen this extra to bundle weights.
learned-tags = ["panns-inference"]
# basic-pitch (Spotify) — Apache-2.0 polyphonic note transcription. PyPI
# distribution is "basic-pitch"; import name is "basic_pitch".
# basic-pitch 0.4.0 advertises Python 3.8-3.11 and depends on
# tensorflow<2.15.1, which has no Python 3.12 wheel in CI's Linux runtime.
pitch = ["basic-pitch==0.4.0; python_version < '3.12'"]
# laion-clap (LAION-AI) — CLAP audio/text embedding model, the learned
# semantic-similarity sensor (prompt<->audio / score<->audio cosine fit).
# PyPI distribution and import name are both "laion-clap" / "laion_clap".
# Pulls in torch and a ~2GB checkpoint downloaded lazily by upstream on
# first `load_ckpt()` call. Code/weights license verification is recorded
# in docs/learned_models_policy.md Section 3.1 — do NOT widen this extra
# to bundle weights.
# laion-clap 1.1.7 は torch 系を install_requires に宣言しない（上流メタデータ不備、
# PR2b-2 実採取で確認）ため、torch 境界を extra が実際に運ぶよう明示する。
semantic-embed = ["laion-clap", "torch", "torchvision"]
# transformers (Hugging Face) MusicGen pipeline — the second-generator
# track's local runbook backend (`scripts/collect_musicgen_takes.py`).
# Pulls in torch; the ~300MB-1.5GB `facebook/musicgen-*` weights are NOT
# bundled here — they are fetched lazily from HuggingFace at runtime on
# first `from_pretrained()` call, mirroring the `semantic-embed` extra's
# torch-boundary contract. Runs on CPU. CI never installs this extra:
# the full test suite MUST pass without it (guarded import inside
# `collect_musicgen_takes.py generate`, never at module import time).
musicgen = ["transformers", "torch", "scipy", "sentencepiece"]
# faster-whisper (SYSTRAN) — CTranslate2-backed Whisper inference, the
# symbolic lyrics-content sensor (rpe/learned/lyrics_adapter.py). PyPI
# distribution and import name are both "faster-whisper" / "faster_whisper".
# Weights (e.g. Systran/faster-whisper-small) are downloaded lazily by
# upstream on first `WhisperModel(...)` construction; do NOT widen this
# extra to bundle weights. See docs/learned_models_policy.md.
# demucs is bundled because the DEFAULT documented paths (`extract --lyrics`
# / `lyrics-adherence`) isolate the vocals stem first — `pip install -e
# ".[lyrics]"` alone must stand up the default (separation-included) path;
# `--lyrics-no-separate` remains the demucs-free runtime opt-out.
lyrics = ["faster-whisper>=1.0", "demucs>=4.0"]
# NOTE: there is deliberately NO `crepe` extra. CREPE's *code* is MIT, but its
# pretrained model weights (model-*.h5) ship inside the wheel and their license
# has not been separately inspected and pinned. docs/learned_models_policy.md §4
# requires upstream weights to be audited independently of the code license and
# each LearnedModelInfo to pin a concrete `weights_license` — a permissive code
# license does not imply permissive weights. Verifying/pinning the bundled CREPE
# weight license is a machine-dependent slow-lane step (Codex/User per CLAUDE.md
# review routing). Until that pin exists, publishing an installable `[crepe]`
# extra would advertise a runtime dependency whose weights provenance is
# unverified, contradicting the policy. So CREPE is kept as a MANUAL / external
# integration exactly like Melodia (rpe/learned/crepe_adapter.py): install
# `crepe` by hand in the slow/manual lane. Promoting it to a first-class extra
# requires the weights-license pin recorded in docs/learned_models_policy.md.
# NOTE: there is deliberately NO `melodia` extra. The Melodia adapter
# (rpe/learned/melodia_adapter.py) depends on Essentia, which is AGPL-3.0 —
# docs/learned_models_policy.md restricts runtime dependencies to permissive
# licenses and does not grant an AGPL exception. Publishing an installable
# `[melodia]` extra would make this package's advertised dependency surface
# contradict that canonical policy, so Melodia is left as a MANUAL / external
# integration: a user who accepts the AGPL terms installs `essentia` by hand
# and the adapter picks it up. Promoting it to a first-class extra requires an
# approved exception recorded in docs/learned_models_policy.md first.

[project.scripts]
svprpe = "svp_rpe.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"svp_rpe.config" = ["*.yaml"]
"svp_rpe.config.domain_profiles" = ["*.yaml"]
"svp_rpe.config.device_profiles" = ["*.yaml"]
"svp_rpe.config.capability_profiles" = ["*.yaml"]
"svp_rpe.config.mode_overrides" = ["*.yaml"]
"svp_rpe.roundtrip.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "voice_genesis/evolution/tests",
    # foundry/tests 全体は onnxruntime 等の環境依存で collection error になるため、
    # 依存フリーな genome 台帳 shape テストのみファイル単位で常時収集する
    # (2026-08-19 セルフレビュー: 台帳の番人が CI 未収集だった)
    "voice_genesis/foundry/tests/test_genome_ledger_shape.py",
    "voice_genesis/foundry/tests/test_genome_ledger_s4_shape.py",
    # run 8 (S7) PR-1: 台帳 / B-1 校正 / B-2 裁定代数。import 閉包は numpy + librosa
    # （どちらも本体の必須依存）だけなので onnxruntime 等の環境依存に触れない
    "voice_genesis/foundry/tests/test_s7_ledger.py",
    "voice_genesis/foundry/tests/test_s7_b1_calibration.py",
    "voice_genesis/foundry/tests/test_s7_b2_algebra.py",
]
pythonpath = ["src", "."]
markers = [
    "slow: 重い統合 / コーパス / property テスト（音声合成 + 抽出が長い）。日常の反復では `pytest -m \"not slow\"` で除外できる（CI は全件実行）",
    "real_forensics: `_scorer_pins()` 等の実 forensics 実装（rglob+sha256 / import 閉包 / /proc/self/maps 実スキャン / 実測り直し）に接続することを検証するテスト。session 凍結 pin への差し替え対象から除外される（TB-30 PR-T1）",
]

[tool.ruff]
line-length = 100
target-version = "py311"

# voice_genesis/evolution/probes/snapshots/ は「実測を生んだ版」の**バイト同一の
# 凍結物**（probes/snapshots/README.md）。結果 JSON が pin する sha は、この
# ディレクトリの実体と一致することを CI が検査している。lint 由来の自動修正や
# ruff のルール追加でバイトが 1 文字でも変わると **pin が実体と一致しなくなり
# provenance が壊れる**（しかも「直せば直すほど壊れる」形で詰む）。凍結物は
# 実行されないコードでもあるため、lint 対象から外す。
extend-exclude = ["voice_genesis/evolution/probes/snapshots"]

# Pin the lint rule SET to ruff's classic stable defaults so linting is
# version-independent. The CI `dev` extra installs `ruff>=0.1` unpinned, and
# newer ruff releases expand the *default* selection (FURB / UP / PERF / ...),
# which would otherwise silently flag thousands of pre-existing lines repo-wide
# and break CI on a mere toolchain bump — unrelated to any diff. Selecting the
# historical defaults explicitly keeps behavior deterministic across ruff
# versions. Adopting additional rule families is then a deliberate, reviewable
# change to this list rather than an accident of `pip install`.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# voice_genesis/harness/{measure.py,vt3_v4.py} は voice_genesis 仮想検証
# プログラム内で「凍結・無改変」と明記された過去サイクルの基盤ファイル
# （voice_genesis/README.md 参照）。他の多数のモジュールがこれらを無改変
# 前提で import しており、F841（未使用変数）2件のためにバイト列を変更する
# ことは凍結原則に反する。voice_genesis 全体を lint 対象から外すのではなく、
# この2ファイルのみ per-file-ignore で除外する（voice_genesis の他コードは
# 通常どおり lint 対象のまま）。
[tool.ruff.lint.per-file-ignores]
"voice_genesis/harness/measure.py" = ["F841"]
"voice_genesis/harness/vt3_v4.py" = ["F841"]
