# バッチ M2（MusicGen 3 ノブ grip 実測）active_rate_target の high セル score。
# M1 baseline（examples/control/musicgen_structure/m1_score_low.yaml）を土台に、
# 対象ノブ active_rate_target のみを変更し、他 2 ノブ（valley_depth_target /
# time_signature）は M1 baseline 値に固定・structure は全ファイル共通で []。
# active_rate_target high は旧 K2-seg 計測（0.92、examples/control/k2_musicgen_segments/
# plan.yaml）と同値のまま据え置く（low 側のみ拡大し high 側の素材効果は変えない）。
# `svprpe compose m2_score_active_rate_target_high.yaml --format json` の text が
# m2_plan.yaml の knobs[0].prompt_high verbatim（2026-07-12 実 compose 出力）。
# low ファイルとの差分は physical.active_rate_target の値のみ。
meta:
  title: "M2 MusicGen active_rate_target (high)"
  version: "0.1"

semantic:
  core: "calm"
  grv:
    primary: "synthwave"
    secondary: ""
  delta_e:
    overall: "steady"
  avoid: []
  lyrics_presence: "absent"

physical:
  bpm: 120
  key: "A minor"
  time_signature: "4/4"
  active_rate_target: "0.92"
  valley_depth_target: "0.3"
  brightness: "balanced"
  stereo_width: "wide"

structure: []

rendering:
  target_backend: "musicgen"
  prompt_max_chars: 300
  priority:
    - semantic.core
    - semantic.grv
    - physical.bpm
    - physical.key
    - physical.time_signature
    - structure
    - semantic.avoid
    - physical.optional
