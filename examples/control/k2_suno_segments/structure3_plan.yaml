# K2-seg Suno 転移バッチ 3: structure 欄 grip 確定追試（ABBA カウンターバランス・直交処方）
#
# docs/controllability_poc.md §「バッチ 2 実測結果」で「測定済みだが confounded・
# 未確定」に据え置かれた structure 欄 grip を確定させるための追試。バッチ 2
# （#166/#168）レビューで確定した設計変更 3 点を適用する:
#   1. ABBA カウンターバランス生成順（run 1 low → run 2 high → run 3 high →
#      run 4 low）— 単純交互では片セルの平均生成時刻が系統的に遅れるため不十分
#      と #168 レビューで確定
#   2. 処方の直交化: quiet–loud–quiet → loud–quiet–loud（生成器デフォルト形状
#      [low,high,high] との一致が 2/3 → 1/3 に落ち、判別ヘッドルームが 2 倍）
#   3. margin 併記（knife-edge 検出、#167 で計器凍結済み）
#
# 発注書: order_sheet_k2seg_suno_batch3_structure.md（本 PR には非同梱、scratchpad
# 由来）。発行日 2026-07-10 = 判定規約の事前登録日（同日生成）。
schema_version: "1.0"
fixture_id: k2seg_suno_batch3_structure
generator: suno
# Suno のユーザーオリジナル・カスタムモデルで生成（ユーザー申告 2026-07-10、
# バッチ 2 と同一系）。標準 stock モデルへの一般化は未検証（バッチ 1 honesty (g)
# / バッチ 2 honesty (2) と同型）。
model: "user-custom (Suno カスタムモデル・ユーザー申告 2026-07-10、バッチ 2 と同一系)"
repetitions: 4
preregistered_date: "2026-07-10"  # 発注書発行日 = 判定規約の事前登録日（同日生成）
# 発注書 §1-4: Exclude Styles 欄は全セル空で統一（ユーザー申告）。
exclude_styles: ""

generation_order:
  design: "ABBA (run1 low -> run2 high -> run3 high -> run4 low)"
  evidence: >-
    端末ダウンロード一覧スクリーンショット（1000004931.png・順序一致）+ 各 run の
    ダウンロード時刻（ユーザー提供・生成直後ダウンロード規約による代理証跡）。
    詳細は structure3_batch_metadata_2026-07-10.yaml。
  timestamps_jst:
    run1_low: "23:31"
    run2_high: "23:34"
    run3_high: "23:37"
    run4_low: "23:39"
  balance_gate:
    formula: "B = |(t2+t3) - (t1+t4)| / (2*(t4-t1))"
    computation: "t=[0,3,6,8]分 -> B = |9-8| / 16 = 0.0625"
    B: 0.0625
    threshold: 0.1
    result: "PASS（canonical 資格）"
    granularity_caveat: >-
      分単位粒度による最悪ケース検討: 各時刻 ±0.5 分で分子誤差最大 ±2 分・
      B ∈ [0, 0.19]。点推定 0.0625 は閾値内だが、粒度起因の上限は 0.1 を超え得る。
      判定は事前登録どおり提供時刻の額面値（点推定 B=0.0625）で行い、粒度 caveat
      は honesty 注記として併記する（order_sheet §1-2 verbatim）。
  replenishment: "ゼロ（全 4 run・8 テイクが 30s 以上 — part1/part2 とも検収済み）"

cells:
  - name: low
    role: "structure ノブの low セル（structure: []、バッチ 2 low の再生成）"
    # svprpe compose（suno/external descriptor）実出力 verbatim（2026-07-10）。
    # 155 字。バッチ 2 low とバイト完全一致（セル定義の継続性、report.txt GATE-5）。
    prompt: >-
      120 BPM. Brightness balanced. Instrumental, no vocals. Calm atmosphere.
      synthwave track. A minor. 4/4 time. Wide stereo. Active rate 0.8.
      Valley depth 0.3.
    prompt_source: score_structure3_low.yaml (compose 実出力, 2026-07-10)
    prompt_max_chars: 300
  - name: high
    role: "structure ノブの high セル（intro/breakdown/outro 3 区間、bars 16/16/16・loud-quiet-loud）"
    # svprpe compose（suno/external descriptor）実出力 verbatim（2026-07-10）。
    # 290 字。低セルとの差分は structure 3 セグメントの挿入のみ（他フィールド文は
    # バイト単位で同一、検算照合ゲート 5/5 PASS 済み — report.txt 参照）。
    prompt: >-
      120 BPM. Brightness balanced. Instrumental, no vocals. Calm atmosphere.
      synthwave track. A minor. 4/4 time. intro: loud dense full energy;
      role=intro. breakdown: quiet sparse minimal; role=breakdown. outro:
      loud dense full energy; role=outro. Wide stereo. Active rate 0.8.
      Valley depth 0.3.
    prompt_source: score_structure3_high.yaml (compose 実出力, 2026-07-10)
    prompt_max_chars: 300

# compose 入力 score の要点（発注書付録より、再現用参照）。
compose_input_summary:
  low:
    structure: []
  high:
    structure:
      - section: intro
        bars: 16
        role: "intro"
        physical: "loud dense full energy"
      - section: breakdown
        bars: 16
        role: "breakdown"
        physical: "quiet sparse minimal"
      - section: outro
        bars: 16
        role: "outro"
        physical: "loud dense full energy"
  shared_physical:
    bpm: 120
    key: "A minor"
    time_signature: "4/4"
    active_rate_target: "0.8"
    valley_depth_target: "0.3"
    brightness: "balanced"
    stereo_width: "wide"

knobs:
  - name: structure
    primary_sensor: rms_section_pattern
    secondary_sensor: novelty_boundaries
    low_level: low
    high_level: high
    expected_sign: 1
    prescribed_pattern: ["high", "low", "high"]
    decision_rule: >-
      主センサー: 比例 3 分割・線形 RMS 算術平均比較（canonical 22050 /
      load_audio 経路）。処方パターン [high, low, high]（loud-quiet-loud）との
      per-song 一致率 = 一致区間数 / 3、セル値 = R=4 の平均。規約（high セルに
      適用）: ≥0.7 tight / 0.3-0.7 loose / <0.3 dead（time_signature の match_rate
      規約を流用）。ヌル格下げ規則: high セル match_rate <= low セル match_rate
      の場合は分類によらず dead へ格下げする（K3-1b の known-dead ヌル天井と同型
      ―「calm な曲が偶然 loud-quiet-loud に見える」chance 水準と不可分な効果を
      tight/loose と誤認しない）。ABBA 順の遵守により本バッチでは cross-cell 比較
      が canonical 資格を持つ（順序違反時は confounded 格下げが自動適用）。
      canonical verdict の 4 条件: (a) ABBA 順（生成順の証跡込み）、(b) 補充ゼロ
      完走、(c) 生成タイムスタンプ記録、(d) 均衡ゲート B <= 0.1。全充足時のみ
      primary_verdict に verdict_canonical: true を付す。canonical verdict は
      「線形ドリフト保護下」の限定付き（ABBA + 均衡ゲートが打ち消すのは線形
      セッションドリフトのみ。凸/凹の曲線ドリフトは 4 run 設計では同定不能のため、
      low run 1 vs low run 4 の within-cell 差を定常性の記述的注記として必須併記
      する）。副センサー: novelty 境界数の d（`structure_novelty` の検出境界数を
      low vs high の Cohen's d、K 系列既定閾値 |d|>=0.8 tight / 0.2-0.8 loose /
      <0.2 dead・expected_sign +1 で判定）。order_sheet §4 verbatim。
    exclusion_rule: >-
      曲長 30 秒未満のテイクは除外する（構造が物理的に展開し得ない極端な短尺）。
      本バッチは補充ゼロで完走（除外なし）。除外・補充が発生した場合は grip
      verdict について一律 non-canonical へ格下げする（order_sheet §3 verbatim）。
    margin_instrument: >-
      各区間 margin = (RMS - 3 区間平均) / 平均 を記録し、|margin| < 0.005 の
      区間に knife_edge フラグを付す（honesty 注記のみ・match 計算は不変更、
      #167 で計器凍結済み）。

# バッチ 2 との関係: 同方向（confounded だった dead が canonical で再現）。
# バッチ 2 の verdict（confounded・非 canonical）は本 fixture では変更しない
# — 本バッチが確定を与える立場（structure3_expected_grip.json 参照）。
batch2_relationship: "same-direction reproduction under canonical protocol (batch2 stays confounded/non-canonical)"
