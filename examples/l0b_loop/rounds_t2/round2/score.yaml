meta:
  title: "Fourfold Dark"
  version: "0.2"

semantic:
  core: "静寂な導入から力強い暗いコーラスへ向かい、静かに閉じる短い器楽曲"
  grv:
    primary: "dark ambient"
    secondary: "minimal"
  delta_e:
    overall: "静寂 -> 高揚 -> 静寂への情動変化"
  avoid: []

physical:
  bpm: 96
  key: "D minor"
  time_signature: "4/4"
  active_rate_target: "0.85-0.92"
  valley_depth_target: "0.15-0.25"
  brightness: "dark"
  stereo_width: "narrow"

structure:
  - section: intro
    bars: 3
    role: "曲を静かに開く導入部"
    physical: "silence, sparse, low density, no kick"
  - section: chorus
    bars: 3
    role: "主題を提示するコーラス"
    physical: "full energy, sub bass"
  - section: chorus
    bars: 3
    role: "コーラスの反復、テーマを強調"
    physical: "full energy"
  - section: outro
    bars: 3
    role: "曲を静かに閉じる終結部"
    physical: "release, low density, no kick"

rendering:
  target_backend: "external"
  prompt_max_chars: 650
  priority:
    - semantic.core
    - physical.key
    - physical.bpm
    - structure
