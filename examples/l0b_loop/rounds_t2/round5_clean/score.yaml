meta:
  title: "Fourfold Dark"
  version: "0.5"

semantic:
  core: "無ドラムの単純な導入から力強い暗いコーラスへ向かい、静かに閉じる短い器楽曲。全内部境界をsub_bassの単一軸トグルのみで統一し、多軸同時変化を排除した最終形"
  grv:
    primary: "dark ambient"
    secondary: "minimal"
  delta_e:
    overall: "平静(no sub bass) -> 高揚(sub bass on) -> 平静(sub bass off) -> 静寂への情動変化"
  avoid: []

physical:
  bpm: 96
  key: "D minor"
  time_signature: "4/4"
  active_rate_target: "0.85-0.92"
  valley_depth_target: "0.15-0.25"
  brightness: "dark"
  stereo_width: "narrow"

structure:
  - section: intro
    bars: 5
    role: "導入部。chorus1との差分軸をsub_bassのみに限定するため、no kick等の追加トークンを全廃しfull energy単独とした"
    physical: "full energy"
  - section: chorus
    bars: 3
    role: "主題を提示するコーラス。introとの唯一の差分はsub_bass(off→on)の単一軸"
    physical: "full energy, sub bass"
  - section: chorus
    bars: 3
    role: "コーラスの反復。chorus1との唯一の差分はsub_bass(on→off)。この遷移は4周回連続で高精度検出済みの実証済み機構"
    physical: "full energy"
  - section: outro
    bars: 5
    role: "静かに閉じる終結部。release/low densityによるエネルギー低下遷移は4周回連続で検出済み(境界は毎回約2.7秒早いがラベル順序は常に正しい)"
    physical: "release, low density, no kick"

rendering:
  target_backend: "external"
  prompt_max_chars: 650
  priority:
    - semantic.core
    - physical.key
    - physical.bpm
    - structure
