meta:
  title: "Fourfold Dark"
  version: "0.5"

semantic:
  core: "無ドラムに近いfull energyの導入(F major)から、キック+サブベースが加わり主調D minorへ転じる力強いコーラスへ向かい、静かに閉じる短い器楽曲。intro/chorus1境界はコード(F→D)+打楽器軸(kick/sub bass)の二重対比で、chorus1/chorus2境界はsub bassのみの単軸対比で、chorus2/outro境界はrelease/低密度/no kickの対比で明示する"
  grv:
    primary: "dark ambient"
    secondary: "minimal"
  delta_e:
    overall: "高揚（無ドラム, F major）-> 高揚（ドラム+サブベース, D minor）-> 静寂への情動変化"
  avoid: []

physical:
  bpm: 96
  key: "D minor"
  time_signature: "4/4"
  active_rate_target: "0.85-0.92"
  valley_depth_target: "0.15-0.25"
  brightness: "dark"
  stereo_width: "narrow"

structure:
  - section: intro
    bars: 5
    role: "full energyだが無ドラムの導入部。chorus1とはkick(有無)+sub bass(有無)+コード(F major vs D minor)の複合対比で境界を狙う"
    physical: "full energy, no kick"
  - section: chorus
    bars: 3
    role: "主題を提示するコーラス。introとはkick+sub bass+コード(D minor, 主調復帰)で対比"
    physical: "full energy, sub bass"
  - section: chorus
    bars: 3
    role: "コーラスの反復。chorus1とはsub bassの単軸対比のみ（3周回実証済みの機構、コードはD minorのまま変更しない）"
    physical: "full energy"
  - section: outro
    bars: 5
    role: "曲を静かに閉じる終結部。chorus2とはrelease/低密度/no kickで対比。コードはD minor（トニック回帰）"
    physical: "release, low density, no kick"

rendering:
  target_backend: "external"
  prompt_max_chars: 650
  priority:
    - semantic.core
    - physical.key
    - physical.bpm
    - structure

events:
  chord_progression:
    - root: "F"
      quality: major
    - root: "D"
      quality: minor
    - root: "D"
      quality: minor
    - root: "D"
      quality: minor
