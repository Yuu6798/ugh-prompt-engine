meta_note: "round2の変更（intro に silence 追加、outro に no kick 追加）は観測境界を1つも動かさず round1と完全一致した。これはトークン変更が音響に無効であることを実証しているため、round3ではレバーをトークンから長さ（bars）へ完全に切り替えた。唯一実証済みで機能しているメカニズム（chorus1/chorus2 の sub_bass 有無による境界、宣言15.0に対し観測14.9304、誤差0.07秒という高精度）は一切変更しない。"
section_intro:
  reason: "round1/round2ともintro(3 bars=7.5秒)はchorus1と完全融合し境界が消失した（観測列に7.5秒付近の境界が皆無）。契約書の『6.2秒は吸収された。7.5秒は3分割ちょうどで成立した』という長さ依存性の記述は中間セクションの実測点だが、intro（先頭セクション）でも短い区間が隣接セクションに吸収される同型の現象が起きたとみて、3→5 bars（7.5秒→12.5秒）に延長し吸収を回避することを狙った。physical文字列はround1/round2で変更しても無効だったため据え置いた。"
section_chorus:
  reason: "chorus1/chorus2の境界（sub_bass有無による唯一の周波数領域コントラスト）はround1/round2で観測境界14.9304秒として再現され、宣言境界15.0秒との誤差はわずか0.07秒と極めて高精度だった。bars/physicalとも一切変更せず、この境界検出の再現性を温存することを最優先した。"
section_outro:
  reason: "round1/round2ともchorus2/outro境界は宣言22.5秒より2.55秒早い19.9459秒で検出され、outro側の先頭2.55秒がchorus2側に取り込まれていた（完全消失ではなく部分吸収）。introと同じ長さ依存性仮説のもと、5 bars（7.5秒→12.5秒）に延長し、outroが独立した観測ゾーンとして十分な絶対長を持つようにした。"
risk: "『吸収』が絶対長不足に起因するという仮説が誤りで、実際には振幅ベースのトークン（silence/no kick/low density等）が周波数領域ベースの検出器（sub_bassのように機能する唯一の実証済みレバー）に対して原理的に無効という可能性が残る。その場合、introとoutroの延長だけでは境界は動かない。次周のobserved_sectionsで、(1) intro/chorus1間に新規境界が出現したか、(2) chorus2/outro境界が27.5秒付近に近づいたか、の2点を最優先で確認する。もし境界がround1/round2と同一（相対位置）のまま動かなければ、round4では長さではなくトークンの周波数領域コントラストをintro/outro境界にも導入する方針（例: introまたはoutro側でsub_bass相当のスペクトル差を作る）へ転換する。"
tools_used: none
