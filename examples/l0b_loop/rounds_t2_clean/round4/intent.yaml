meta_note: "round3の結果: intro を3→5 bars（7.5s→12.5s）に伸ばしても intro/chorus1 境界は依然未検出。observed の第1境界（19.8763s）は declared の chorus1/chorus2 境界（20.0s）とほぼ完全一致（誤差0.12s）だった一方、declared intro/chorus1 境界（12.5s: 無音→full energy+sub bass という理論上最大級の対比点）は intro の長さを変えても一度も検出されていない。これは bars 単独では解けない問題と判断し、round4 は変数をvocabに切り替える。"
diagnosis: "round1/2/3を通じ一貫して観測される現象: 'silence' 区間直後の遷移だけが常に未検出、'sub bass' の on/off という比較的小さな対比の方が高精度に検出される。これは音量差の大小の問題ではなく、'silence'（実質ゼロ信号）が構造検出器の特徴量抽出（エネルギー比・スペクトル特徴等）を不安定化させ、有効な信号が十分蓄積するまで intro ラベルが後方（chorus1 の途中〜終端）まで実質的に持ち越されている可能性が高いと推定した。round2で『語彙追加は無効』と判定されたのは synonyms の追加であり、'silence' という認識語彙そのものの有無を切り替える実験は未実施だった。"
change: "round4の単一変数実験: introのbarsをround1相当の3 bars(7.5s)に戻し（round3の bars 延伸は不採用と結論）、intro.physical から 'silence' を削除し 'sparse, low density, no kick' のみに変更（実信号を保ちながら低密度を表現）。他の3セクション（chorus1/chorus2/outro）は前周から一切変更していない（sub bass on/off 境界とrelease境界は機能しているため据え置き、変数を1つに絞る）。"
risk: "(1) 'silence' 除去後も intro/chorus1 境界が未検出なら、silence起因の特徴量不安定化仮説は棄却され、round5では境界検出器が固定本数（2境界）の予算を持つ可能性を最終検討する必要がある。(2) 逆にもし今回 intro/chorus1 境界は検出されたが chorus1/chorus2 か chorus2/outro のどちらかが崩れたら、silence除去がintro全体のエネルギープロファイルを変え他の境界の相対的な検出優先度を下げた可能性がある。(3) round4のobserved_sectionsで最優先確認するのは observed_sections の要素数が3→4に増えたか、増えた場合その最初の境界がintro/chorus1間（7.5s付近）に来ているかの2点。"
