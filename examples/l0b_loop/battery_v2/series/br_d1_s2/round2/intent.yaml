     stereo_width, active_rate_target, valley_depth_target: round1でkey/brightness
     はともにpreservedだったため一切変更しない。"
  - "intro/chorus1/chorus2 のセクション定義(section名・bars・role・physical)は
     round1と完全に同一のまま維持。intro→chorus1(既定tier5→full energy tier4、
     低→高遷移)は契約が懸念を明記していた組だが round1 の observed_sections
     には intro/chorus/chorus の3区間のみが素直に検出されており(intro→chorus1
