meta:
  title: "Hollow Passage"
  version: "0.1"

semantic:
  core: "静かな導入から力強い主題を経て静かに閉じる器楽曲"
  grv:
    primary: "cinematic"
    secondary: "minimalist"
  delta_e:
    overall: "静けさから高揚へ、そして再び静けさへ戻る"
  avoid: []

physical:
  bpm: 96
  key: "D minor"
  time_signature: "4/4"
  active_rate_target: "0.85-0.92"
  valley_depth_target: "0.15-0.25"
  brightness: "dark"
  stereo_width: "narrow"

structure:
  - section: intro
    bars: 3
    role: "曲を開く静かな導入部。主題への準備を担う。"
    physical: "抑えた音量で開始し、拍とメロディを控えめに提示する"
  - section: chorus
    bars: 3
    role: "第一の主題提示。全体を牽引する山场。"
    physical: "full energy"
  - section: chorus
    bars: 3
    role: "主題の反復再提示。前段と同格の力強さを保つ。"
    physical: "full energy"
  - section: outro
    bars: 3
    role: "主題を静かに収束させる終結部。"
    physical: "sparse"

rendering:
  target_backend: "external"
  prompt_max_chars: 650
  priority:
    - semantic.core
    - physical.key
    - physical.bpm
    - structure
