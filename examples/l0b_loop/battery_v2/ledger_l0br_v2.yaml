preregistered_hypothesis:
  narrative: >-
    v1 台帳 br_d1 の到達率は 1/2（s1=unreached/failure_mode=contract_defect・
    s2=reached/rounds_to_success=1）。s1 の contract_defect 判定根拠は
    「ヒント解決の非加算・優先順位制」という v1 未開示の計器特性に著者が
    嵌ったこと（l0b record §4.1 と同型）だった——この特性は `contract_v2.md`
    §2「演奏ヒントの解決規則」で明示的に開示済み。

    本再測（同一課題 br_d1・同一判定器・同一 section_map_t2・契約文書のみ
    v1→v2 に差し替え）で:
    - v2 で 2/2（両系列とも reached）なら、開示追加が v1 の
      contract_defect を解消したことの支持。
    - v2 で 1/2 以下（v1 と同じか悪化）なら、開示だけでは不十分——または
      到達分岐がそもそも著者サンプリング揺らぎ由来で、契約改訂と未分離
      （`docs/l0br_robustness_record.md` §6 が同一示唆をしている）——のいずれ
      かであり、本再測単独（n=2）では両仮説を分離できないことを事前に
      正直宣言する。
    比較の妥当性は、判定器・演奏者・report 正規形・課題文・section_map が
    v1 と同一であることに依存する（本台帳の `judge` 4 pin と `tasks[0].
    statement` pin が v1 台帳と同一 sha であることの cross-ledger assert が
    この前提を機械的に保証する）。
  result:
    observed: "2/2 reached（br_d1_s1・br_d1_s2 とも round3 で reached）"
    rounds_to_success: {s1: 3, s2: 3}
    judgement: supports
    judgement_note: >-
      実測 2/2（v1 = 1/2）は上記事前登録の「v2 で 2/2 なら開示追加が v1 の
      contract_defect を解消したことの支持」分岐に該当する。v1 契約欠陥
      （ヒント解決の非加算・優先順位制、drone 化セクションでの
      chord_progression 無音化等）は v2 開示により両系列・全周回で初回
      （round1）から回避された（key/brightness は round1 から一貫して
      preserved）——開示の効果はこの点で直接観測されている。
    honesty_notes:
      - >-
        n=2 であり、著者サンプリング揺らぎとの完全な分離はできない（v1 の
        s1=unreached/s2=reached という到達分散も著者戦略選択に帰す仮説と
        未分離だった = `docs/l0br_robustness_record.md` §6 と同一の限界）。
      - >-
        rounds_to_success は両系列とも 3 で、v1 s2 の 1 より遅い。「開示は
        到達可否を改善したが、構造軸の収束速度は改善していない」——理由は
        両系列とも v2 未開示（v3 開示候補）の高→低エネルギー遷移側の
        bridge 過剰検出（chorus→outro 境界）に round1/round2 で嵌ったため。
        v2 §2 は低→高遷移側の過渡帯のみを開示しており、高→低遷移側の
        bridge は本再測で独立 2 系列 4 周回にわたり再現した新規知見
        （v2 開示済みの罠は全て回避された一方、この残存未開示特性に構造軸
        の失敗が集中した）。

