    （v1 と同一課題定義）。

protocol:
  round_limit: 5
  series_per_task: 2
  success_predicate: >-
    周回成功 = report.json が symbolic pass かつ key=preserved かつ
    brightness=preserved かつ structure=exact_match、かつ token_ban 課題では
    check_token_ban.py が pass（br_d1 は token_ban: false のため本項は
    非適用）。系列到達（reached）= round_limit 内に周回成功 1 回以上。
    成功周回で系列は終了する（rounds_to_success = 最初の成功周回）。
    v1 台帳と同文。
  improvement_accounting: >-
    連続周回間の pareto_eval.py 出力（improved/tie/regressed）を全ペア記録。
    Pareto 述語は frozen/pareto.yaml を無変更適用（総合スコア禁止 = D6）。
    v1 台帳と同文。
  failure_mode_vocab: ["unconverged", "missteered", "contract_defect", "instrument_band"]
  failure_mode_rubric: >-
    未到達系列の分類（系列単位・根拠を rationale に明記）。優先順位 =
    contract_defect > instrument_band > missteered > unconverged。
    contract_defect: 著者の編集が契約 v2 の記述下では合理的なのに、未開示の
    計器特性（v2 §2 で開示済みの 6 項目以外の、新規発見の未開示特性）に
    より無効・逆効果になったことが evidence（バイト同一 take・境界不応答
    等）で示せる場合。instrument_band: 著者が陽性対照級の対比設計に到達
    したのに境界検出が分離しなかった場合（計器帯域）。missteered: 著者が
    ペイロード内 evidence と矛盾するレバー選択を続けた、または可視制約
    （R4）への違反を繰り返した場合。unconverged: 周回上限到達でいずれの
    機構も特定できない残余。v1 台帳と同文。
  failure_mode_rubric_v2_correction: >-
    本再測の判定を締める中心規約（v1 台帳には無い v2 固有の補正）:
    `contract_v2.md` §2 で**開示済み**の 6 特性——(1) 演奏ヒント解決の
    非加算・優先順位制（"no kick" 系統の支配・"release"="full energy" の
    等価性）、(2) ヒント照合対象が `physical` と `role` の連結文字列で
    あること、(3) drone 扱いセクションでは `chord_progression` が鳴らない
    こと、(4) 自作 `chord_progression` が `physical.key` 宣言より優勢に
    調推定を決めうること（+ 2 種の修理経路）、(5) 低→高エネルギー遷移
    直後の約 5 秒の過渡帯が `bridge` として観測されうること、(6) 終盤
    境界の約 2.6–2.7 秒の系統的早期検出——のいずれかに著者が嵌った場合、
    その系列は **contract_defect に分類してはならない**（開示済み特性は
    定義上「未開示」の要件を満たさないため）。該当する場合は
    missteered（開示を読んだ上でなお evidence と矛盾する選択をした）
    または unconverged（開示を踏まえてもなお収束しなかった残余）側で
    分類する。contract_defect が許されるのは、上記 6 項目のいずれにも
    該当しない**新規発見の未開示特性**に嵌ったことが evidence で示せる
    場合に限る。
  off_contract_rule: >-
    ペイロードが composer 出力と一致しない周回・著者ツール使用が 0 でない
    周回は off-contract。当該周回以降の系列成果は到達率会計から除外し、
    off_contract_events に記録する。v1 台帳と同文。
  metrics: ["reach_rate", "rounds_to_success", "pareto_improvements", "failure_modes"]

