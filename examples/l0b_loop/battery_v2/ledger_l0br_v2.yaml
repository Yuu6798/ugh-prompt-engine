preregistered_hypothesis: >-
  v1 台帳 br_d1 の到達率は 1/2（s1=unreached/failure_mode=contract_defect・
  s2=reached/rounds_to_success=1）。s1 の contract_defect 判定根拠は
  「ヒント解決の非加算・優先順位制」という v1 未開示の計器特性に著者が
  嵌ったこと（l0b record §4.1 と同型）だった——この特性は `contract_v2.md`
  §2「演奏ヒントの解決規則」で明示的に開示済み。

  本再測（同一課題 br_d1・同一判定器・同一 section_map_t2・契約文書のみ
  v1→v2 に差し替え）で:
  - v2 で 2/2（両系列とも reached）なら、開示追加が v1 の
    contract_defect を解消したことの支持。
  - v2 で 1/2 以下（v1 と同じか悪化）なら、開示だけでは不十分——または
    到達分岐がそもそも著者サンプリング揺らぎ由来で、契約改訂と未分離
    （`docs/l0br_robustness_record.md` §6 が同一示唆をしている）——のいずれ
    かであり、本再測単独（n=2）では両仮説を分離できないことを事前に
    正直宣言する。
  比較の妥当性は、判定器・演奏者・report 正規形・課題文・section_map が
  v1 と同一であることに依存する（本台帳の `judge` 4 pin と `tasks[0].
  statement` pin が v1 台帳と同一 sha であることの cross-ledger assert が
  この前提を機械的に保証する）。

