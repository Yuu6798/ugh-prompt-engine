# L0b-R BR-D1 v2 再測台帳 — 契約 v2（開示のみの改訂）による分離測定
#
# 一次資料。事前登録（tasks / 判定規約 / pin）→ 実行 evidence（series_runs
# 追記）の 2 段 commit で事前登録性を git 履歴で証明する（v1 台帳
# `../battery/ledger_l0br.yaml` と同じ運用規約）。登録 commit 187c57e で
# `series_runs` / `off_contract_events` を登録時の正規状態（空 list）の
# まま commit し、実測 commit で `series_runs` を追記済み——この 2 段
# commit の履歴自体が事前登録性の証明であり、登録時点の状態は git 履歴
# （187c57e）で参照できる。
#
# 目的: v1 バッテリー（`../battery/ledger_l0br.yaml`）の br_d1/s1 が
# `failure_mode: contract_defect` と判定された原因——契約 v1 が未開示
# だった計器特性（ヒント解決の非加算・優先順位制、`role` へのヒント語
# 漏れ込み照合、drone 化セクションでの `chord_progression` 無音化）——が、
# **開示のみを追加した契約改訂（`../contract_v2.md`）** によって実際に
# 解消するかどうかを、判定器・演奏者・report 正規形を一切変更せずに測定
# する。v1 バッテリーとの差分は契約文書（`contract.md` → `contract_v2.md`）
# のみに限定し、著者能力・判定基準の変化と交絡しないようにする。
#
# 境界宣言（`../battery/ledger_l0br.yaml` ヘッダコメントと同型。PR #249
# Codex レビュー、耐久性指摘を受けた明文化を継承）: この git 証明は本
# リポジトリのマージ慣行（マージコミット）を保持する文脈でのみ checkout
# 再現可能。squash マージや履歴を持たない export の文脈では git 系譜は
# attestation（当時の測定者による証言）へ格下げされ、git 非依存の一次
# 再現アンカーは本台帳の content pin（sha256）になる。
#
# Design Memo = L0a v2 + BR-D1 再測（Fable 設計・2026-08-07）。
# 正本 = docs/llm_adapter_planning.md §5（成功条件）+ `../battery/
# ledger_l0br.yaml`（v1 台帳・比較対象）+ 本台帳。

