runner_at_measurement:
  # Blob sha256 of the L0b runner scripts + this run's frozen/ copies, at
  # the commit the positive-control dry-run below was measured against.
  # Unlike L0-s's runner_at_measurement (which pins a *range* because the
  # scripts hardened across several post-hoc review rounds), L0b's scripts
  # are being introduced fresh in this same change — there is no prior
  # version to distinguish from, so this pins the single introducing commit.
  measured_at_commit: "0f598a107f97406f70298a3f12016a1be181dd60"
  measured_at_commit_note: >-
    The commit that introduced examples/l0b_loop/ (scripts + frozen inputs +
    this ledger's original placeholder). The git_blob_sha1 values below are
    the blobs recorded in that commit; this note itself was filled in by the
    immediately following ledger-only commit (the placeholder could not name
    its own introducing commit before it existed).
  files:
    run_round_py:
      path: scripts/run_round.py
      git_blob_sha1: "9b9a18eb69e0e476a22c6247d855774a6c9d72dd"
    pareto_eval_py:
      path: scripts/pareto_eval.py
      git_blob_sha1: "7df1e4697aefdc8e346f0cbf60891a2055ef103d"

positive_control:
  # Dry-run of examples/l0s_spike/positive_control/score.yaml (read-only
  # reuse of L0S-T1's positive control — task.md's 陽性対照ゲート節) through
  # the full L0b observation chain (svprpe validate --contract -> run_round.py's
  # eval/roundtrip/adherence/package/observe chain -> AuthoringDiffReport).
  # Pinned for audit; not L0b spike evidence (task.md's 陽性対照ゲート note).
  score:
    path: ../../examples/l0s_spike/positive_control/score.yaml
    sha256: "1997c103fc74975af41ae7c3c569a7e7ac064fb1fd72a1c291e91050b208bf31"
    note: "Unmodified L0S-T1 positive control — read-only reuse, not copied."
  determinism_check: >-
    Ran twice into separate scratch workdirs (build/l0b/positive_control{,_run2}/);
    both runs' report.json were byte-identical (sha256
    bfa81bf892741807291a8ceab4ff1860ab831a2e39a344ffe3bdd28e711123a9).
  status: pass
  axes:
    key: {verdict: preserved, band: measured, observed: "D minor"}
    brightness: {verdict: preserved, band: measured, observed: "dark"}
    structure:
      verdict: exact_match
      band: measured
      observed: ["intro", "chorus", "outro"]
      observed_sections:
        - {label: "intro", start_seconds: 0.0, end_seconds: 5.4567}
        - {label: "chorus", start_seconds: 5.4567, end_seconds: 10.5419}
        - {label: "outro", start_seconds: 10.5419, end_seconds: 17.5}
  boundary_seconds_note: >-
    observed_sections is populated (module docstring (c) of
    scripts/run_round.py — boundary-second live wiring, task.md's central
    new requirement over L0-s) — confirms the wiring produces real,
    monotonic, non-overlapping section boundaries for the positive control,
    not just a schema-valid empty/null value.
  artifacts:
    report:
      path: positive_control/report.json
      sha256: "bfa81bf892741807291a8ceab4ff1860ab831a2e39a344ffe3bdd28e711123a9"
    # The following intermediate artifacts were produced in the scratch
    # workdir (build/l0b/positive_control/, outside the protected loop tree
    # per scripts/run_round.py's output-collision guard) and are pinned here
    # for audit, but not copied into examples/l0b_loop/ (only report.json —
    # the AuthoringDiffReport normal form — is the pinned deliverable;
    # ../../examples/l0s_spike/ledger.yaml sets this same precedent for its
    # own positive_control artifacts under build/l0s/).
    validation:
      path: ../../build/l0b/positive_control/validation.json
      sha256: "a1bc26ff11e0701c44696dfe0947d11506c66c7518f16249e903689646a9fa6d"
      note: >-
        Byte-identical to examples/l0s_spike/ledger.yaml's positive_control
        validation.json sha256 — expected: same score, same canonical
        CompositionScore validation, and L0a's public-scope check accepts
        every field this score uses (contract v1 is a superset check of the
        same underlying constraints v0 hand-coded).
    roundtrip:
      path: ../../build/l0b/positive_control/roundtrip.json
      sha256: "f0cfb31e604735fc2d2721957fd34601bf2a677b2cdea89b39a10cc4b30c18dc"
      note: "Byte-identical to L0-s's pinned roundtrip.json — same eval_score.yaml bytes."
    adherence:
      path: ../../build/l0b/positive_control/adherence.json
      sha256: "d56bd17a717db2ec767770df051ddc7c16f05a94f52c1d0cb34b72bf2700c9d8"
      note: "Byte-identical to L0-s's pinned adherence.json."
    take_wav:
