      sha256: "a5bf8a55b7cecb609bf2e8e2ade09a2f3bea2acd5284a7c1d3b3b6598c092a2e"
      note: "Byte-identical to L0-s's pinned take.wav — same eval_score.yaml, same deterministic performer."
    eval_score:
      path: ../../build/l0b/positive_control/eval_score.yaml
      sha256: "fc18ac481e73f8a0ba11e51ec3c114ea4a844150ff04a3855f1a397b36ddcf31"
    manifest:
      path: ../../build/l0b/positive_control/identity_manifest.yaml
      sha256: "b28213c7eaf727d25c6d25ab923eed91baa77c7e3d8e7834d05740cd9c7c9293"
      note: >-
        Differs from L0-s's pinned manifest sha256 by design — this
