post_loop_hardening:
  # PR #247 レビュー対応（計測完了後のスクリプト硬化。T1/T2 の全計測は
  # runner_at_measurement / t2.runner_at_measurement の pin 時点の blob で
  # 実施済みであり、以下は evidence 生成には使われていない）。対象コミットの
  # 正確な列挙は git log が正:
  #   git log --oneline --follow -- examples/l0b_loop/scripts/
  # pin 済み report.json とのバイト互換は T1/T2 slow smoke（決定論回帰
  # ガード）のパスで検証した。
  items:
    - "pareto_eval.py: 入力 report の AuthoringDiffReport.model_validate ゲート (Codex P1)"
    - "pareto_eval.py: -o と入力 3 パスの衝突ガード (Codex P2)"
    - "run_round.py: score/section map の単一スナップショット読み (Codex P2)"
    - "run_round.py: hashes.json 先行書き込み + report の atomic 公開 (Codex P2 軽量版)"
