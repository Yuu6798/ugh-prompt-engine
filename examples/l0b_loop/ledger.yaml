    exact_match・position_match_rate 1.0。系譜 = rounds 1→2→3c→4c→5c、
    全周回 coordinator 注記なし）。原 round 5 の達成は off-contract
    （注記付き）、5_clean は系譜汚染ありのため、いずれも契約遵守下の
    達成としては主張しない。
  steering_evidence: >-
    **クリーン会計で充足**（2026-08-06 確定）: clean_branch round 4c → 5c
    の Pareto 改善（rounds_t2_clean/round5/pareto_vs_round4.json、
    improved: true、structure 1->0 厳密改善・全軸非退行・band 除外なし）。
    系譜 rounds 1→2→3c→4c→5c は全周回 coordinator 注記なしの宣言
    ペイロードのみで進行しており、正本 §5 の L0b 成功条件「非旋律軸の
    差分が周回で改善するケースが 1 つ以上実測される（= 閉ループが操舵
    として機能する証拠）」を満たす。なお off-contract 系譜の改善
    （round 4 → 原 round 5）は引き続き evidence 不算入
    （evidence_status: excluded）。
  honest_accounting: >-
    クリーン系譜の集計: rounds 1, 2, 3c, 4c は structure mismatch
    （距離 1・tie 3 連続）、5c で全軸成功 + Pareto 改善 1 件 — 改善実測は
    5 クリーン周回中 1 件。off-contract 系譜（rounds 3/4/5 + 5_clean）の
    成果は evidence 不算入。著者周回の総数は 10（T1×1 + T2 本系列×5 +
    5_clean×1 + clean_branch×3）。本記録は「クリーン操舵の成立実証」で
    あり頑健性実証ではない（改善 1 件は §5 要求の最小限）。契約 v1 の
    計器欠陥 3 件（トークン非加算・role 文照合リーク・drone 区間の進行
    無音化）の v2 反映は独立の残件として維持する。

