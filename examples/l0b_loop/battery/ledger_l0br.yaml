      対象。squash マージや履歴を持たない export で git 系譜が切れても
      sha256_at_measurement の実体照合を可能にする保全措置——PR #249 Codex
      レビュー第 10 巡, P1 指摘）。
      sha256_current = PR #249 レビュー対応を累積した現行ファイル（形状
      テストが実体照合する対象・詳細な変更系譜は git 履歴が保持するため
      個別 commit は列挙しない）。累積修正はいずれも検証強化（不正
      manifest の拒否範囲拡大）と失敗経路（publish rollback）に限られ、
      妥当な manifest に対する成功経路の組成出力（`document`/
      `payload_bytes`/`manifest_bytes` の構築ロジック）はバイト不変 —
      両 blob を diff すると変更行は validation の追加分岐・rollback の
      try/except 化のみで、出力構築部分に差分はない（実測: 2026-08-06
      確認）。series_runs の per-round payload_sha256 / payload_manifest_
      sha256 pin はこの不変量ゆえに影響を受けず、測定時のまま有効
      （`test_compose_payload_golden_round1_minimal` が固定 payload.md
      期待値で pass し続けていることも同一不変量の回帰防止として機能）。
  policy: >-
    全周回の著者可視ペイロードは compose_payload.py の出力のみ
    （AGENTS.md §8「情報遮断実験のペイロード組成は機械化する」2026-08-06
    制定則）。手組み・注記追加・要約添付は off-contract イベントとして記録し、
