# L0b-R バッテリー台帳 — 単一著者頑健性（課題難易度 × 到達率の地図）
#
# 一次資料。事前登録（tasks / 判定規約 / pin）→ 実行 evidence（series_runs 追記）
# の 2 段 commit で事前登録性を git 履歴で証明する。Design Memo = L0b-R
# （User 方針決裁 2026-08-06: 単一 LLM 切り分け先行・複数モデル比較後回し）。
# 正本 = docs/llm_adapter_planning.md §5（成功条件）+ 本台帳。
# 注意: 値が "TODO_PIN" のフィールドは登録手続き中の未充填を意味する。
# 事前登録 commit 時点で TODO_PIN が残っていてはならない（形状テストが enforce）。

