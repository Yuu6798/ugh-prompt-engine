    提出 score.yaml の生テキスト全文（UTF-8 デコード後・小文字化）に対する
    部分文字列一致。適用課題 = token_ban: true の課題のみ（br_d2 / br_d3）。
    判定結果は著者へ送らない（可視情報は課題文の R4 宣言のみ）。

protocol:
  round_limit: 5
  series_per_task: 2
  success_predicate: >-
    周回成功 = report.json が symbolic pass かつ key=preserved かつ
    brightness=preserved かつ structure=exact_match、かつ token_ban 課題では
    check_token_ban.py が pass。系列到達（reached）= round_limit 内に周回成功
    1 回以上。成功周回で系列は終了する（rounds_to_success = 最初の成功周回）。
  improvement_accounting: >-
    連続周回間の pareto_eval.py 出力（improved/tie/regressed）を全ペア記録。
    Pareto 述語は frozen/pareto.yaml を無変更適用（総合スコア禁止 = D6）。
  failure_mode_vocab: ["unconverged", "missteered", "contract_defect", "instrument_band"]
  failure_mode_rubric: >-
    未到達系列の分類（系列単位・根拠を rationale に明記）。優先順位 =
    contract_defect > instrument_band > missteered > unconverged。
    contract_defect: 著者の編集が契約 v1 の記述下では合理的なのに、未開示の
    計器特性（ヒント非加算 / role 照合 / drone 進行無音化 = l0b record §4、
    または新規発見の未開示特性）により無効・逆効果になったことが evidence
    （バイト同一 take・境界不応答等）で示せる場合。該当課題は「L0a v2 反映後に
    再測」対象。instrument_band: 著者が陽性対照級の対比設計に到達したのに
    境界検出が分離しなかった場合（計器帯域）。missteered: 著者がペイロード内
    evidence と矛盾するレバー選択を続けた、または可視制約（R4）への違反を
    繰り返した場合。unconverged: 周回上限到達でいずれの機構も特定できない残余。
  off_contract_rule: >-
    ペイロードが composer 出力と一致しない周回・著者ツール使用が 0 でない
    周回は off-contract。当該周回以降の系列成果は到達率会計から除外し、
    off_contract_events に記録する。
  metrics: ["reach_rate", "rounds_to_success", "pareto_improvements", "failure_modes"]

