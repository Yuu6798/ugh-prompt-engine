      同一 round1 を正規ペイロード（composer 出力の同一ターン内読取→転写）で
      再実行。以降の全周回はプロンプト組成を「同一ターン内でファイル読取→
      直写」に固定する。なお s1 の 5 周回は全て同一ターン内読取→直写で組成
      しており本事故と同型の経路は通っていないが、送信バイト列の事後検証
      手段はハーネス上存在しないため、この転写忠実性の限界は記録 doc に
