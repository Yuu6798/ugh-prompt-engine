# L0b-R バッテリー台帳 — 単一著者頑健性（課題難易度 × 到達率の地図）
#
# 一次資料。事前登録（tasks / 判定規約 / pin）→ 実行 evidence（series_runs 追記）
# の 2 段 commit で事前登録性を git 履歴で証明する。
# 境界宣言（examples/l0b_loop/ledger.yaml の runner_at_measurement 節ヘッダ
# コメントと同型。PR #249 Codex レビュー、耐久性指摘を受けて明文化）:
# この git 証明は本リポジトリのマージ慣行（マージコミット）を保持する文脈
# でのみ checkout 再現可能。squash マージや履歴を持たない export の文脈
# では git 系譜は attestation（当時の測定者による証言）へ格下げされ、
# git 非依存の一次再現アンカーは本台帳の content pin（sha256）になる。
# 会計拡張（PR #249 Codex レビュー第 7 巡, P2）: 各周回の judge 成果物
# （token_ban.json / pareto_vs_round*.json、存在する周回のみ）の sha256 を
# per-round エントリへ追加 pin した（`token_ban_report_sha256` /
# `pareto_report_sha256`）。既存の測定値・解釈済み boolean（token_ban /
# pareto_vs_prev 等）は無変更——一次再現アンカーの網羅範囲を広げる会計上の
# 追加であり、再測定や値の書き換えではない。
# Design Memo = L0b-R
# （User 方針決裁 2026-08-06: 単一 LLM 切り分け先行・複数モデル比較後回し）。
# 正本 = docs/llm_adapter_planning.md §5（成功条件）+ 本台帳。
# 事前登録 commit（2026-08-06）: pin 未充填センチネルは全て実測 sha256 へ置換
# 済み（形状テストが「本ファイル全体にセンチネル文字列が存在しないこと」を
# enforce する）。

