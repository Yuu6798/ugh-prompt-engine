meta:
  title: "BR-D1 Round2: Sharpened Chorus/Outro Boundaries"
  version: "0.2"

semantic:
  core: "静かな導入から力強いフックを二度提示し、二度目はkickを抜いて質感を変え、最後は音を断ち切るように静寂へ落ちる短い器楽曲。"
  grv:
    primary: "minimal"
    secondary: "electronic"
  delta_e:
    overall: "低いエネルギーの静けさから高いエネルギーの反復フックへ跳躍し、二度目でkickを抜いて低音質感を変え、最後は緩やかな減衰ではなく急な断絶で静寂に落ちる。"
  avoid: []

physical:
  bpm: 96
  key: "D minor"
  time_signature: "4/4"
  active_rate_target: "0.85-0.92"
  valley_depth_target: "0.15-0.25"
  brightness: "dark"
  stereo_width: "narrow"

structure:
  - section: "intro"
    bars: 3
    role: "低エネルギーの静かな導入部。次のchorusとの対比を作る"
    physical: "sparse, no kick, low density opening"
  - section: "chorus"
    bars: 3
    role: "主題フックを高エネルギーで提示する第一の中間区間"
    physical: "full energy driving hook"
  - section: "chorus"
    bars: 3
    role: "同フックの反復。kickを抜き低音質感を変えて前区間との境界を強める"
    physical: "full energy hook, no kick, sub bass emphasis"
  - section: "outro"
    bars: 3
    role: "断ち切るように静寂へ落ちて終息する"
    physical: "silence, no kick, low density"

rendering:
  target_backend: "external"
  prompt_max_chars: 650
  priority:
    - semantic.core
    - physical.key
    - physical.bpm
    - structure
