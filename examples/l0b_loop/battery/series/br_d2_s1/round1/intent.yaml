design_rationale:
  overall: >
    課題 BR-D2 の 4 要求（構造 intro→chorus→outro / D minor / dark /
    禁止語句回避）を、契約 §2 の構造センサー可行窓開示に基づき数値で
    狙い撃ちする設計。

  structure:
    reasoning: >
      契約が開示した唯一の「厳密成立」実測点は、陽性対照の中間セクション
      実長 7.5 秒（3 分割ちょうど成立）。12.3 秒は過分割、6.2 秒は吸収され
      失敗したため、可行窓は 7.5 秒近辺の狭い帯と判断した。
      中間セクションだけでなく intro / outro も含め全セクションを
      bars=3 に揃えることで、bpm=96・4/4 のとき
      1 セクション = 3 bars × (4 beats × 60/96 s/beat) = 3 × 2.5s = 7.5 秒
      ちょうどとなるよう bpm を逆算した（96 という bpm 自体に音楽的意味は
      ない。もっぱら 7.5 秒を厳密に再現するための数値選択）。
      境界は音響駆動（エネルギー・音色対比）で検出されるため、
      intro=sparse texture（低密度・抑制）→ chorus=full energy（高密度・
      最大出力）→ outro=release（解放・収束）という順で、隣接区間の
      対比が明確になるよう認識語彙のみを用いて設計した。
      禁止語句（silence / no kick / low density / sub bass）はいずれの
      自由文にも使わず、"sparse" と "full energy" と "release" という
      許可された認識語のみでコントラストを作った。

  key:
    reasoning: >
      physical.key を "D minor" とし、正規表現要求（"^[A-Ga-g][#b]?
      (major|minor)$"）に厳密準拠。加えて events.chord_progression を
      D 自然短音階に完全ダイアトニックな i–VI–III–VII
      （D minor – A#(=Bb) major – F major – C major）で明示し、
      調判定の実測を D minor 方向へ補強する意図。ルート表記はフラット
      不可の制約に従い Bb を "A#" とした。

  brightness:
    reasoning: >
      physical.brightness を "dark" に直接指定。契約は dark を
      「倍音の少ない低域中心の音色」と説明しており、構造ヒント側でも
      full energy 以外は sparse / release という抑制寄りの語を選び、
      明度判定と衝突する高輝度的な語（例えば "bright" を連想させる
      表現）を意図的に避けた。

  wordlist_compliance:
    reasoning: >
      score.yaml 全文（meta / semantic / physical / structure / rendering /
      events）を禁止語句 4 種（silence, no kick, low density, sub bass）と
      照合し、部分文字列としても大小文字を問わず不使用であることを
      著述時点で確認した。structure.physical の認識語は "sparse" /
      "full energy" / "release" の 3 語のみを採用し、禁止語彙とは
      文字列として重ならない。

  risks_and_unknowns:
    - "intro / outro の境界成立実測は契約に開示されていない（開示は中間
       セクションの 3 点のみ）。intro/outro も同じ 7.5 秒に揃えたのは
       一貫性による推測であり、保証はない。"
    - "brightness の実測閾値（dark と判定される具体的な音響特徴量の境界）
       は契約に数値開示がないため、フィールド値の直接指定に依存している。"
    - "コード進行を加えたことが key 判定にどの程度寄与するかは契約に
       明記されていないが、害はないと判断し保険的に付加した。"

round: round1
experiment: l0br_br_d2_s1
