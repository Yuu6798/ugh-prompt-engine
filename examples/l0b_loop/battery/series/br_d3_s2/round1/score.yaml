meta:
  title: "Dark Study in D Minor"
  version: "0.1"

semantic:
  core: "a brooding instrumental built on a single dark minor-key hook, stated twice, then let go"
  grv:
    primary: "minimal"
    secondary: "cinematic"
  delta_e:
    overall: "quiet tension building into a full hook stated twice, then settling back to a quiet close"
  avoid: []

physical:
  bpm: 96
  key: "D minor"
  time_signature: "4/4"
  active_rate_target: "0.85-0.92"
  valley_depth_target: "0.15-0.25"
  brightness: "dark"
  stereo_width: "narrow"

structure:
  - section: intro
    bars: 3
    role: "quiet opening that establishes the dark minor tonal center before the first hook enters"
    physical: "sparse, building toward full energy"
  - section: chorus
    bars: 3
    role: "first full statement of the main hook at full energy"
    physical: "full energy, driving and steady"
  - section: chorus
    bars: 3
    role: "second statement of the same hook, restated with a brief release before returning to full energy"
    physical: "full energy with a brief release before restating"
  - section: outro
    bars: 3
    role: "closing fade that returns to the sparse opening texture"
    physical: "release settling toward a sparse close"

rendering:
  target_backend: "external"
  prompt_max_chars: 650
  priority:
    - semantic.core
    - physical.key
    - physical.bpm
    - structure

events:
  chord_progression:
    - root: "D"
      quality: "minor"
    - root: "A#"
      quality: "major"
    - root: "F"
      quality: "major"
    - root: "C"
      quality: "major"
