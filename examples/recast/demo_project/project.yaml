# recast-project/0.1 デモ fixture: 既存 sidecar（"Midnight Signal" 一式、
# examples/arrangement/midnight_signal/ からコピー・整合済み）への参照のみを
# 持つワークスペース定義。歌詞・旋律・楽譜本文はここに複製せず、
# work.identity_manifest 経由で既存 sidecar を参照するだけ。
#
# deterministic backend（synth performer 経由の CI-safe パス）は本 PR では
# 追加しない — capability-mode 突合や mode_overrides の消費配線は PR2 以降の
# 責務であり、PR1 はスキーマ+loader+fixture の存在確認に留める。
schema_version: "recast-project/0.1"

project:
  id: "midnight-signal-demo"
  builds_root: "builds"

work:
  score: composition_score.yaml
  identity_manifest: identity.yaml

variants:
  edm:
    arrangement: arrangements/edm.yaml
  # PR4: chords+structure 縦切り E2E 専用 variant（arrangements/deterministic_e2e.yaml
  # のコメント参照）。deterministic backend でのみ compiled/verified へ到達する。
  deterministic_e2e:
    arrangement: arrangements/deterministic_e2e.yaml

backends:
  suno:
    capability_profile: "suno"
    invocation: manual
    invocation_mode: prompt_only
    # ★invocation_mode 軸の実測サポート状況（PR2, config/mode_overrides/suno.yaml）。
    # capability_profile とは別軸・別スキーマ: 「チャネルが存在するか」ではなく
    # 「invocation_mode（cover/prompt_only）ごとに override が実際に届くか」。
    mode_overrides: "suno"
  # PR3: recast run の local invocation 経路（CI-safe in-process 演奏者）。
  # 注意（実装ノート・PR3 逸脱事項）: このデモ composition_score.yaml は
  # rendering.target_backend: "external" を宣言しており、resolve_backend_descriptor
  # により常に profile_key="suno" を要求する（package.py の generator 一致検査は
  # capability_mode に関わらず無条件）。よって variant "edm" に対し
  # backend "deterministic"（capability_profile 側 generator="deterministic"）で
  # `recast plan`/`recast run` を実行すると常に blocked_capability に到達する
  # （generator mismatch）— これは実装のバグではなく、target_backend が
  # score-level の静的宣言であり backend 選択と独立である、という既存アーキテクチャの
  # 制約を正直に表す。deterministic backend を実際に compiled/verified まで
  # 到達させる E2E 経路は tests/test_recast_backend.py が別の一時 fixture
  # （rendering.target_backend: "deterministic" を宣言する variant）で検証する。
  deterministic:
    capability_profile: "deterministic"
    invocation: local
    invocation_mode: prompt_only

policy:
  capability_mode: advisory
  require_author_fields_resolved: true
  require_verified_package: true

observation:
  enabled: false
  anchors: []
