# AR4 form 実測バッチ（Design Memo: design_memo_ar4_form.md, 2026-07-20）専用 variant。
# 既存 `identity_manifest.yaml`（lyrics/melody/harmony hard anchor, AR2-1/AR2-2 pin
# 連鎖の対象）は不変のまま — 本ファイルはその内容 + structure anchor 1 件のみを
# 追加した別ファイルとして新設する（既存 pin 連鎖を保全する規律。
# edm.identity.musicgen.arrangement.yaml が既存 arrangement を変更せず別ファイルと
# して新設したのと同じ理由）。
#
# structure anchor: AR2-3 解凍条件 (a) で配線済みの structure センサー
# (`is_structure_sensor_anchor`: domain=structure かつ
# artifact_type=section_map かつ format_version=section-map/0.1) に一致させる。
# `required: false` — `edm.identity.musicgen.arrangement.yaml`
# (`edm.identity.arrangement.yaml` の additive variant、AR2-3-frozen) は
# lyrics/melody/harmony の 3 anchor のみ `identity_anchors` preservation policy に
# 宣言しており、structure の policy を持たない。`build_preservation_contract` は
# `required: true` の全 anchor に policy を要求するため、structure anchor は
# `required: false`（policy 不在のまま `requested_mode=None` / `not_requested` と
# なるが、observe は preservation-contract 状態と無関係に全 anchor を測定するため
# 無害 — #192 の e2e テストと同じ規律）。
schema_version: "identity-manifest/0.1"
meta:
  work_id: "midnight-signal"
  version: "0.1"
source:
  locator: composition_score.yaml
  sha256: "37854f54b42a1c4d424f357148d3d10f347e238ec72a42d1248bea2203f97d0b"
  rights_basis: original
  note: >-
    合成 fixture 作品・音源なし。locator は base Composition Score 自身であり、
    生成済み音声への参照ではない。
anchors:
  - id: lyrics
    domain: lyrics
    artifact: identity/lyrics.txt
    artifact_type: lyrics_text
    media_type: text/plain
    sha256: "2da7dca390e13fd6d19c3fbe74646583884313b112981f8bc7d62f0d6d3a27b2"
    required: true
  - id: melody
    domain: melody
    artifact: identity/melody_notes.json
    artifact_type: note_events_json
    media_type: application/json
    format_version: "note-events/0.1"
    sha256: "1d67d4fd0f38ee6864a32010c19b0fc8401208842d06f204def2cc9a70378fb5"
    required: true
  - id: harmony
    domain: harmony
    # AR4 (Design Memo D-4): 正典進行は performer.py の C minor 既定進行
    # (MINOR_PROGRESSION, transpose=0 の FAITHFUL_TAKE) と一致させてある。
    # artifact_type は chord_sequence_json だが ARTIFACT_TYPE_CHANNEL では
    # チャネル未対応 (None) のため、delivery は常に unknown — 「delivery と
    # observation は別軸」の実証(observe は delivery 状態と無関係に測定する)。
    artifact: identity/chord_progression.json
    artifact_type: chord_sequence_json
    media_type: application/json
    format_version: "chord-sequence/0.1"
    sha256: "180464a881ac63131c0a0fcdf812e0cc7bfd8dc1e9947698a5d5c65c89245299"
    required: true
  - id: structure
    domain: structure
    # AR4 form 実測バッチ (2026-07-20): 正典は composition_score.yaml
    # （EDM derived。edm.identity.musicgen.arrangement.yaml は structure field を
    # override しないため base と同一）の `structure` 欄のセクション名を機械的に
    # 転記したもの（intro/verse/chorus/bridge、発明ではない — 実ファイル読み取り
    # 確認済み。examples/arrangement/midnight_signal/expected/edm/derived_score.yaml
    # の structure 欄と一致）。
    artifact: identity/section_map.json
    artifact_type: section_map
    media_type: application/json
    format_version: "section-map/0.1"
    sha256: "1fc7e8dabf83c691758114128fdd36b7679dd61175d8492afae3f97577047eb1"
    required: false
