# 12 bundles x 2 independent process runs, sha256 compared.
# Pass 1: canonical outputs in this directory (wi2_rank_{cell}_take{N}.json).
# Pass 2: re-run in a separate process into a scratch tmp dir, then deleted.
#
# 2026-07-21 再生成: RankEntry に tied_with を追加した後の再実行
