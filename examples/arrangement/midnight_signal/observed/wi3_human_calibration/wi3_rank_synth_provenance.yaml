# 生成コマンド列（score -> render -> extract -> identity-rank）。全コマンドは
# リポジトリルートを cwd として実行し、引数は全て相対パス（checkout-stable）。
# render 手順は本ディレクトリに commit 済みの `render_synth_takes.py` を呼ぶ
# （scratchpad 依存を解消 — 下記 render_script_sha256 で pin）。
# score_path は wi0b_synth/commands.md の render_faithful.py 呼び出しと同一の
# composition_score.yaml（faithful_take の sha256 が wi0b_synth の既存 pin と
# 一致することがこの同一性の機械的な裏付け — 下記 source_audio_sha256 参照）。
commands:
  - step: render
    description: >-
      決定論 synth performer で 2 スタイル (FAITHFUL_TAKE, FIRST_TAKE) を
      同一 composition_score から wav にレンダーし、本ディレクトリ配下の
      `synth/` に出力する。committed
      `examples/arrangement/midnight_signal/observed/wi3_human_calibration/render_synth_takes.py`
      を実行する（`wi0b_synth/render_faithful.py` と同一 recipe の
      faithful+first_take 両スタイル版 — スクリプト自身の docstring に明記）。
      出力 wav は非コミット（sha256 pin のみ — 下記 input_audio_sha256）、
      レポート生成後に削除する。
    command: >-
      python examples/arrangement/midnight_signal/observed/wi3_human_calibration/render_synth_takes.py
      examples/arrangement/midnight_signal/composition_score.yaml
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth
    outputs:
      - "examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/faithful_take.wav"
      - "examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/first_take.wav"
  - step: extract
    description: >-
      各 wav を RPE bundle に抽出（デフォルト設定、追加フラグなし。引数は
      相対パス）。中間 bundle は render 出力と同じ非コミットの `synth/`
      ディレクトリ配下に書く（`<tmp>` プレースホルダは bash でリダイレクト
      構文として誤解釈され実行不能だったため、具体的な相対パスに固定した
      — 第6ラウンド Codex P2 是正）。
    command: >-
      svprpe extract
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/faithful_take.wav
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_faithful_take.rpe.json
    command_first_take: >-
      svprpe extract
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/first_take.wav
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_first_take.rpe.json
    note: >-
      bundle の `audio_file` フィールドは extract に渡した引数をそのまま記録する
      ため、相対パス引数を渡すことで bundle 内が相対パスになる（下流の
      identity-rank レポートの `audio_file` にそのまま伝播）。
  - step: identity-rank
    description: >-
      各 bundle を WI2 と同一の参照リストに対して順位付け
      （`examples/arrangement/midnight_signal/observed/wi2_discrimination/wi2_references.yaml`,
      schema_version wi2-references/0.1: canonical / structure_destroyed /
      harmony_decoy / other_work の 4 参照）。
    command: >-
      svprpe identity-rank
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_faithful_take.rpe.json
      --references examples/arrangement/midnight_signal/observed/wi2_discrimination/wi2_references.yaml
      --format json
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/wi3_rank_synth_faithful.json
    command_first_take: >-
      svprpe identity-rank
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_first_take.rpe.json
      --references examples/arrangement/midnight_signal/observed/wi2_discrimination/wi2_references.yaml
      --format json
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/wi3_rank_synth_first_take.json
  - step: cleanup
    description: >-
      非コミットの中間物（render 出力 wav 2 本 + extract の中間 bundle 2 本）を
      `synth/` ディレクトリごと削除する。committed なのはレポート 2 本
      （`wi3_rank_synth_{faithful,first_take}.json`）のみ。
    command: >-
      rm -rf examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth

