      - "examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/faithful_take.wav"
      - "examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/first_take.wav"
  - step: extract
    description: >-
      各 wav を RPE bundle に抽出（デフォルト設定、追加フラグなし。引数は
      相対パス）。中間 bundle は render 出力と同じ非コミットの `synth/`
      ディレクトリ配下に書く（`<tmp>` プレースホルダは bash でリダイレクト
      構文として誤解釈され実行不能だったため、具体的な相対パスに固定した
      — 第6ラウンド Codex P2 是正）。
    command: >-
      svprpe extract
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/faithful_take.wav
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_faithful_take.rpe.json
    command_first_take: >-
      svprpe extract
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/first_take.wav
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_first_take.rpe.json
    note: >-
      bundle の `audio_file` フィールドは extract に渡した引数をそのまま記録する
      ため、相対パス引数を渡すことで bundle 内が相対パスになる（下流の
      identity-rank レポートの `audio_file` にそのまま伝播）。
  - step: identity-rank
    description: >-
      各 bundle を WI2 と同一の参照リストに対して順位付け
      （`examples/arrangement/midnight_signal/observed/wi2_discrimination/wi2_references.yaml`,
