    command: >-
      svprpe identity-rank
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_faithful_take.rpe.json
      --references examples/arrangement/midnight_signal/observed/wi2_discrimination/wi2_references.yaml
      --format json
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/wi3_rank_synth_faithful.json
    command_first_take: >-
      svprpe identity-rank
      examples/arrangement/midnight_signal/observed/wi3_human_calibration/synth/synth_first_take.rpe.json
      --references examples/arrangement/midnight_signal/observed/wi2_discrimination/wi2_references.yaml
      --format json
      -o examples/arrangement/midnight_signal/observed/wi3_human_calibration/wi3_rank_synth_first_take.json
  - step: cleanup
    description: >-
      非コミットの中間物（render 出力 wav 2 本 + extract の中間 bundle 2 本）を
      `synth/` ディレクトリごと削除する。committed なのはレポート 2 本
