# composition_score・同一 FAITHFUL_TAKE スタイルからの決定論レンダリングである
# ことの機械的裏付け）。first_take (FIRST_TAKE style) は wi0b_synth に対応物が
# ないため wi3_kit_manifest.json の pair06_A.wav pin と突合する。
# fresh-process 再現: mkdir バグ修正後の committed render_synth_takes.py を
# 「`synth/` ディレクトリ削除済み（fresh checkout 相当）」の状態から
# リポジトリルートで実行した結果も含め、これまでに独立した実行で 5/5 一致
# （scratchpad/wi3_synth/, scratchpad/wi3_synth_run2/ の 2 回 + 第2ラウンドの
# 相対パス実行 1 回 + 第3ラウンドの committed スクリプト実行 1 回 + 本ラウンドの
# mkdir バグ修正後・fresh-checkout 相当実行 1 回）。
input_audio_sha256:
  faithful_take:
    sha256: "4d8c83f67c1b2441e09fa84debdc47ec0131c1a13ee1b813b0ef55e874903e90"
    cross_check: "wi0b_synth/observed/provenance.yaml#source_audio_sha256 (同値) / wi3_kit_manifest.json pair06_B.wav"
    fresh_process_reproduction: "5/5 (scratchpad/wi3_synth/, scratchpad/wi3_synth_run2/, 第2ラウンド相対パス実行, 第3ラウンド committed スクリプト実行, 第4ラウンド mkdir修正後 fresh-checkout相当実行)"
  first_take:
    sha256: "467f5200173cbea43933c69a5ba9dd8b156eee2e11ff9de0bd6475ed5dfb7e46"
    cross_check: "wi3_kit_manifest.json pair06_A.wav"
    fresh_process_reproduction: "5/5 (scratchpad/wi3_synth/, scratchpad/wi3_synth_run2/, 第2ラウンド相対パス実行, 第3ラウンド committed スクリプト実行, 第4ラウンド mkdir修正後 fresh-checkout相当実行)"

# レポート 2 本自身の sha256（本ディレクトリに commit したファイルの stale
# 差し替え検出用 — tests/test_wi3_human_calibration_fixture.py がこの pin と
# 突合する）。初版（scratchpad 絶対パス版）から `audio_file` フィールドのみが
# 変わったため sha256 も変わっている（他フィールドはバイト単位で同一 —
# 本是正で再検証済み）。
report_sha256:
  wi3_rank_synth_faithful.json: "a72c9b115410e663b4669d5ad60313ee57c04da2827aff4428e46644b5ee8232"
  wi3_rank_synth_first_take.json: "2f63248eb41214e322965621e9892a08d01151057df23f94fa5d1542120a9a13"

# rank-1 一致検証（本是正で再実施・結果: 全一致・不一致 0 件。加えて
# audio_file 以外のフィールドが初版とバイト単位で同一であることも確認済み）:
# wi3_rank_synth_{faithful,first_take}.json の各軸 rank==1 エントリから導出した
# unique/tie 状態・rank1_ref・tied_with が、wi3_aggregation.yaml の
# material_axis_rank1.{synth_faithful,synth_first_take} 記載値と完全一致する
# ことを新レポート生成後・commit 前に確認済み（5 軸 x 2 素材 = 10 エントリ全一致）。
verification:
  - "report_sha256[wi3_rank_synth_faithful.json] == 実 commit ファイルの sha256"
  - "report_sha256[wi3_rank_synth_first_take.json] == 実 commit ファイルの sha256"
  - "render_script_sha256[render_synth_takes.py] == 実 commit スクリプトの sha256"
  - "replay_input_pins の全 9 エントリ（データファイル 8 + config/semantic_rules.yaml 1）の sha256 == working tree の実ファイルの sha256（tests/test_wi3_human_calibration_fixture.py がエントリ数に依存しない全数ループで pin する — いずれかが無断変更されたら fixture テストが赤くなる）"
  - "input_audio_sha256.faithful_take.sha256 == wi0b_synth/observed/provenance.yaml source_audio_sha256"
  - "5 軸 x 2 素材の rank-1 unique/tie 状態が wi3_aggregation.yaml material_axis_rank1 と一致（10/10, 本是正時点で再確認済み）"
  - "各レポートの audio_file が examples/... 配下の相対パスであり、絶対パス（scratchpad 等）を含まないこと"
  - "audio_file 以外の全フィールドが初版（scratchpad 絶対パス版）とバイト単位で同一（rank-1・distance 値は音声レンダリングが不変ゆえ不変）"
