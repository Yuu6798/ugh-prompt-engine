# --- 既知の限界（honesty 記録） ---------------------------------------------
known_limitations:
  - >-
    wi2_A_take0（sha256 90eb7c68...）は p01/p03/p06 の3ペアで X 素材として
    再利用されている（タスクブリーフのペア表そのまま・Claude 側で変更していない）。
    キット内で pair02_A.wav / pair07_A.wav / pair08_B.wav はバイト単位で同一
    ファイルになる。これは「同じ take を複数の対照に使う」実験設計そのものの
    帰結であり、匿名化の欠陥ではないが、聴取者がバイト比較すれば気づき得る
    という限界は記録しておく（通常の聴取では気づかない）。
  - >-
    synth 素材（wi3_synth/*）は MusicGen 素材（wi2_wavs/*）とファイルサイズが
    異なる（faithful=7,938,044 bytes, first_take=10,160,684 bytes, wi2 全件=
    3,832,378 bytes）。P4 ペアは聴感上も明確に synth 音色だとわかるため、
    ファイルサイズ差は追加の情報漏洩にならない（耳で分かることをメタデータが
    先取りしているだけ）。
