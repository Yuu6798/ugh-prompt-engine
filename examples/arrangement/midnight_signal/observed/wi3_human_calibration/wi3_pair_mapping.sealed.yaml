  note: >-
    パスはこのラウンドの scratchpad ディレクトリからの相対パス
    （wi2_wavs/ は wi2 弁別ハーネスの既存在庫、wi3_synth/ は本タスクで
    render_faithful.py 相当のレシピを使い新規再生成した決定論 synth 2本）。

