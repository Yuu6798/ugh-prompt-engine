# SEALED — 聴取完了・回答提出まで User は開かないこと。
#
# このファイルは WI3 ペア聴取キットの「提示順ペア -> 素材」完全マッピングを
# 保持する封印ファイルである。wi3_preregistration.yaml には素材 ID を一切
# 記載していない（ペア数・カテゴリ別本数・予測規則のみ）。運用規約:
# n=1 自己実験のため技術的な閲覧強制はできない — この限界は honesty として
# 集計時の結果に明記する。
#
# 実行担当・fixture 作成は Claude（design 側）が行った。committed 版の
# キット wav 自体は非コミット（sha256 pin のみ、本ファイルと
# wi3_kit_manifest.json が実体の同一性を保証する）。
schema_version: "1.0"
harness: "wi3_human_calibration"
plan_confirmed_at_utc: "2026-07-21T13:56:58Z"

# --- シャッフル再現手順（決定論・re-run で bit-for-bit 再現済み 2/2） --------
shuffle_reproduction:
  seed: 8400
  pair_id_table_order: >-
    [p01, p02, p03, p04, p05, p06, p07, p08, p09, p10, p11, p12]
    （タスクブリーフのペア表の記載順そのまま。Fable 確定済みで変更不可）
  algorithm: |
    import random
    PAIR_IDS = [f"p{i:02d}" for i in range(1, 13)]
    rng = random.Random(8400)

    # (a) 提示順: PAIR_IDS の単純コピーを rng.shuffle() で一度だけシャッフルする。
    presentation_order = PAIR_IDS.copy()
    rng.shuffle(presentation_order)

    # (b) 各ペアの X/Y -> A/B 割当: shuffle 呼び出しの「後」に、PAIR_IDS の
    # 元の（シャッフル前の）順序で 1 ペアにつき rng.random() を 1 回ずつ引く。
    # swap=False -> X が A、Y が B。swap=True -> Y が A、X が B。
    ab_swap = {pid: (rng.random() < 0.5) for pid in PAIR_IDS}

    slot_of = {pid: i + 1 for i, pid in enumerate(presentation_order)}
  determinism_check: >-
    同一プロセス内および fresh python 起動の2回の実行で
    presentation_order / ab_swap とも byte-for-byte 一致
    （wi3_blind_shuffle_run1.json == wi3_blind_shuffle_run2.json、scratchpad 保存）。
  presentation_order_pair_ids:
    - p05
    - p01
    - p04
    - p08
    - p12
    - p10
    - p06
    - p03
    - p07
    - p11
    - p02
    - p09
  ab_swap:
    p01: false
    p02: true
    p03: true
    p04: true
    p05: true
    p06: false
    p07: true
    p08: true
    p09: false
    p10: true
    p11: true
    p12: true

# --- 素材 ID -> ソース wav（scratchpad 由来。committed 版は非コミット） ------
