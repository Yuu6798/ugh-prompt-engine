    canonical_ended_at_utc: "2026-07-21T05:09:22Z"
    spot_check_started_at_utc: "2026-07-21T05:13:51Z"
    spot_check_ended_at_utc: "2026-07-21T05:17:36Z"
    pinned_sha256: deb6d110bc62832e86c22916db119232954728cc15009f9fa4aaf2a0a571dc58
    regenerated_sha256: deb6d110bc62832e86c22916db119232954728cc15009f9fa4aaf2a0a571dc58
