meta:
  title: synth_03_roundtrip_source
  version: "0.1"
semantic:
  core: midtempo bright groove
  grv:
    primary: loud_pop
    secondary: groove
  delta_e:
    overall: gradual_build
  avoid: []
physical:
  bpm: 120
  key: G major
  time_signature: 4/4
  active_rate_target: 0.80-0.85
  valley_depth_target: 0.30-0.40
  brightness: dark
  stereo_width: wide
structure:
  - section: intro
    bars: 1
    role: open the groove
    physical: sparse pulse, dark
  - section: chorus
    bars: 1
    role: full release
    physical: full energy, release
  - section: outro
    bars: 1
    role: settle
    physical: low density, silence tail
rendering:
  target_backend: external
  prompt_max_chars: 650
  priority:
    - semantic.core
    - semantic.grv
    - physical.bpm
    - physical.key
    - structure
    - semantic.avoid
    - physical.optional
