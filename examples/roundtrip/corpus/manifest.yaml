        send_form: qualitative_cue
    measured:
    audio_hash: f25582c038abfe1e17a9f9a29c0a02783a0f5e24bc79c7a970b8e579e94bb763
    audio_locator: examples/sample_input/synth_05_fast_bright_d_major.wav
    notes:
      - "Calibratable in-repo record backed by examples/sample_input/ground_truth.yaml."
      - "Brightness is retained as a qualitative fixture label because T0 canonical centroid maps this audio to dark."

  # --- R1 screen-derived real-audio takes (ported from screen_2026-06-16.yaml) ---
  # Provenance-pinned (audio_hash = sha256) Suno generations with drive_file_id for
  # the content-addressed screener path (scripts/fetch_corpus.py -> screen_corpus.py).
  # The bytes are NOT committed (licensing/size); a human/remote job drops them into
  # --source-dir and fetch_corpus resolves them by hash. corpus_batch keeps these as
  # observation_log (no committed audio_locator) and replays the archived `measured`.
  # `prompt` is a screen-derived summary, NOT the verbatim generation prompt (the
  # 2026-06-16 snapshot did not archive prompt text). `measured` carries only what the
  # screen actually recorded; time_signature was stated 4/4 but not measured, so it is
  # intentionally absent from `intent` to avoid implying a non-preservation never observed.
  - id: yaoyorozu_shinwa
    generator: suno
    prompt: >-
      Screen-derived summary (verbatim generation prompt not archived in the
      2026-06-16 snapshot): acoustic-traditional, sparse, much silence. Stated
      bpm=96, time_signature=4/4, key not stated. Title 八百万の神話の世界.
    intent:
      bpm:
        value: 96
        send_form: numeric_knob
    measured:
      bpm: 95.7
      key: B minor
      centroid: 3099.2
      high_ratio: 0.0533
      bpm_octave_ambiguous: false
      bpm_relation: preserved
      key_relation: unknown
    audio_hash: ce7a92402b06acff7da6aa89d77928005cb7648256cd3c9e5ee655245c82a725
    drive_file_id: "1q67-xtqFlPI76__hSJ9HZqifFAKhNsrG"
    notes:
      - "R1 corpus screen snapshot (2026-06-16); audio is not committed. Findings: docs/roundtrip_corpus_screen.md."
      - "Stated 4/4 was sent but the screen did not record a measured time_signature, so it is omitted from intent."

