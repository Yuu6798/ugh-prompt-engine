schema_version: "1.0"

# Local 20-file smoke validation manifest.
#
# Audio files are not committed. Copy this file to a local manifest and replace
# <DOWNLOADS_DIR> with the directory that contains the WAV/MP3 files.
#
# Example:
#   <DOWNLOADS_DIR> -> C:/Users/you/Downloads
#
# Command:
#   python scripts/measure_real_audio.py path/to/local_manifest.yaml --json

