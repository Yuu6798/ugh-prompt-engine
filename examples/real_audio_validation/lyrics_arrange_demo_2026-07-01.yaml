# 歌詞アレンジ・デモ計測ログ — 2026-07-01 (Session 2)
#
# 実音源 StartinA_COMPLETE を identity(調号/コア進行) 固定で EDM / Rock へ
# 再キャストし、各アレンジで「歌詞あり(present) / 歌詞なし(absent)」と再生成別取り
# (別取り=alt, 同一条件2テイク目=再生成ノイズのベースライン) を Suno で生成。
# 全テイクを `svprpe extract`(physical) + `svprpe transcribe`(chord) で計測した
# measured 値(小数3桁)。docs/lyrics_semantic_anchor.md の n=3 検証に対応。
#
# provenance / 再現手順:
#   - 音源はリポジトリに非コミット。各テイクの canonical 原ファイル(mp3/m4a)の
#     `audio_sha256`(+ source_format / byte_size) を pin し bytes を照合可能にする。
#   - 計測パイプライン: 原ファイル → ffmpeg で 44100Hz / stereo wav へ変換
#     (`ffmpeg -i <src> -ac 2 -ar 44100 <dst>.wav`) → `svprpe extract` / `transcribe`。
#     wav は再現可能な派生物のため非 pin(sha256 は原ファイル基準)。
#
# honesty:
#   - 歌詞あり/なしは Suno 出力ファイルの byte_size で弁別(大=歌詞あり)。
#   - alt(別取り)は **歌詞(present)条件のみ**取得。instrumental(absent)は両ジャンル
#     とも 1 テイクで absent 側の再生成スプレッドは未測 = 完全な n≥2×2 セルではない。
#     → 2026-07-08 の独立 v2 ブロック（lyrics_symmetric_block_2026-07-08.yaml）で対称化
#     closeout（別プロンプトのため本ブロックの measured には非追記）。
#   - top_chord / sharp4_family_frac はコード推定器由来で、歪みギター instrumental
#     では不安定(rock_inst の調号外 A#m/Fm 混入は推定器ノイズ疑い・n=1 断定せず)。
#
# 主要指標の読み(詳細は docs 側の結論1-3):
#   - dynamic_range_db: Rock で歌詞あり/なしが反転かつ再生成ノイズ未満 → 歌詞アンカー
#     proxy として棄却。EDM は方向は残るが absent alt 未取得で directional 保留。
#   - mid_ratio: 歌詞ありテイク4本すべてが各 instrumental より高(方向一致)。同じ noise
#     基準では Rock のみ条件差(0.021)>スプレッド(0.016)でノイズ超え、EDM は条件差(0.004)
#     <スプレッド(0.005)で directional のみ。昇格は instrumental alt 込み n≥2×2 セル要件。
#   - bpm: EDM=129 に精密ロック(誤アトラクタ) / Rock=108±5 で揺れ(正確だが不精密)。
#   - key/sharp4_family_frac: 生成器の key 保存は生成6テイクで判定(orig は基準・分母外)。
#     生成6中5が ♯4(E major / C# minor)ファミリー保存(転調なし)、rock_inst のみ 0.61 で
#     逸脱。トニック重心(top_chord)はテイク毎に散る。
