# 歌詞アレンジ・デモ計測ログ — 2026-07-01 (Session 2)
#
# 実音源 StartinA_COMPLETE(m4a) を identity(調号/コア進行) 固定で EDM / Rock へ
# 再キャストし、各アレンジで「歌詞あり(present) / 歌詞なし(absent)」と再生成別取り
# (別取り=alt, 同一条件2テイク目=再生成ノイズのベースライン) を Suno で生成。
# 全テイクを `svprpe extract`(physical) + `svprpe transcribe`(chord) で計測した
# measured 値(小数3桁)。docs/lyrics_semantic_anchor.md の n=3 検証に対応。
#
# honesty:
#   - 歌詞あり/なしは Suno 出力ファイルの byte_size で弁別(大=歌詞あり)。
#   - top_chord / sharp4_family_frac はコード推定器由来で、歪みギター instrumental
#     では不安定(rock_inst の調号外 A#m/Fm 混入は推定器ノイズ疑い・n=1 断定せず)。
#   - 音源はリポジトリに非コミット(byte_size を provenance として記録)。
#
# 主要指標の読み:
#   - dynamic_range_db: EDM は歌詞あり<なしだが Rock では逆転かつ再生成ノイズ未満
#     → 「歌詞→dynamic_range 低下」は法則でない(棄却)。
#   - mid_ratio: 歌詞ありテイク4本すべてが各 instrumental より高 → ボーカル検出に堅い。
#   - bpm: EDM=129 に精密ロック(誤アトラクタ) / Rock=108±5 で揺れ(正確だが不精密)。
#   - key/sharp4_family_frac: ♯4(E major / C# minor)ファミリーは6/7で保存(転調なし)、
#     rock_inst のみ 0.61 で逸脱。トニック重心(top_chord)はテイク毎に散る。
