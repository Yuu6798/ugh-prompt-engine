# 歌詞対称ブロック — CLAP ③ closeout (2026-07-08)
#
# 1. ブロック定義: 本ブロックは docs/lyrics_semantic_anchor.md の n=3 追試
#    (#124, examples/real_audio_validation/lyrics_arrange_demo_2026-07-01.yaml) とは
#    **別プロンプトの独立ブロック (v2)**。ジャンル内で Style / Exclude Styles を完全共通化し、
#    差は Instrumental トグルと歌詞欄のみ（matched-pair 設計）。各条件は 2 テイク
#    （1 本目 + 再生成 alt）で、EDM/Rock × 歌詞 present/absent の 2x2 セルを
#    instrumental 側も含めて対称に埋める（#124 で欠けていた instrumental alt を取得）。
#
# 2. プロンプト pin（ユーザー確認済み・発行文面のまま使用）:
#    EDM Style: "Melodic EDM, 129 BPM, E major, four-on-the-floor kick, bright supersaw
#      leads, sidechained sub bass, energetic drop, steady tempo, no key change"
#    EDM Exclude Styles: "orchestral, acoustic, rock guitar, tempo change"
#    Rock Style: "Anthemic rock, 108 BPM, E major, driving electric guitars, live drums,
#      punchy bass, verse-chorus dynamics, steady tempo, no key change"
#    Rock Exclude Styles: "EDM, electronic dance, orchestral, tempo change"
#    歌詞: StartinA の歌詞を present 4 テイク（edm_lyrics_v2 / edm_lyrics_v2_alt /
#      rock_lyrics_v2 / rock_lyrics_v2_alt）に同一貼付。モデルは 8 本同一
#      （バージョン名は未記録）。採用規則: 発注書指定の「各条件 1 本目機械採用」。
#
# 3. 再現手順: 原 mp3（uploads 原ファイル基準で audio_sha256 を pin）→ ffmpeg 6.1.1
#    (6.1.1-3ubuntu5) で 44100Hz / stereo wav へ変換
#    (`ffmpeg -i <src> -ac 2 -ar 44100 <dst>.wav`) → `svprpe extract` / `svprpe transcribe`。
#    wav は再現可能な派生物のため非 pin（sha256 は原 mp3 基準）。
#
# 4. honesty:
#    (a) byte_size 弁別は実効ビットレート (effective_bitrate_kbps 列) がほぼ一定のため
#        **実質 duration 弁別**であり、present/absent 割り当ての確定根拠は byte_size では
#        なく CLAP vocal contrast の完全分離（present 0.246–0.285 vs absent 0.009–0.117、
#        examples/learned/clap/lyrics_vocal_contrast_v2_fixture.json）である。
#    (b) Rock の instrumental 2 本 (rock_inst_v2 69.28s / rock_inst_v2_alt 30.16s) は
#        歌詞側 (~183s) より大幅に短く、duration 交絡は残置（本ブロックでは未解消）。
#    (c) edm_inst_v2_alt の bpm=89.1 は他 3 本 (136.0) に対し比 1.526 で
#        R2-2f (docs/roundtrip_corpus_screen.md) の 3:2 窓 (1.35, 1.6) 内だが、抽出時の
#        `bpm_prior_disagreement` は false（非発火）— halving か真に遅い生成かは
#        未裁定。R2 live E2E の副次観測として記録するのみで本ブロックの判定には使わない。
#    (d) 事前登録規約（効果 = 条件間の最近差 = min(present) − max(absent) / ノイズ =
#        max(present スプレッド, absent スプレッド)）と判定値:
#          - mid_ratio: EDM 効果 0.010 < ノイズ 0.025 ✗ / Rock 効果 0.017 < ノイズ 0.019 ✗
#            → 昇格棄却
#          - CLAP vocal contrast: EDM 0.136 > 0.064 ✓ (2.1×) / Rock 0.155 > 0.083 ✓ (1.9×)
#            → 両ジャンル充足
#        判定・叙述の詳細は docs/lyrics_semantic_anchor.md 「2026-07-08 対称ブロック」節
#        および docs/control_profile.md DD-4 を参照。本ファイルは measured 値のみを保持する。
#
# 5. Drive 未アップロード: 本ブロックの音源は genre calibration コーパス
#    (docs/genre_calibration_planning.md) の precedent と同じく、drive_file_id が
#    確定するまで捏造しない。Drive アップロード完了後に追記する（follow-up）。
#
# provenance / 計測パイプライン詳細（生データ由来）:
#   - mid_ratio / brilliance / sub_bass = extract RPE の spectral_bands 系。
#   - top_chord / sharp4_family_frac = transcribe draft chord_progression 由来
#     (♯4 ファミリー = E major / C# minor diatonic 三和音の比率)。コード推定器由来で
#     instrumental / 歪みギターでは不安定になりうる（先例 fixture の honesty 注記と同様）。
#   - 解釈・効果判定はこのファイルでは行わない（設計側判断は docs 側）。
