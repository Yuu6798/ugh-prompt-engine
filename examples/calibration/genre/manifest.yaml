schema_version: "1.0"
# Genre calibration seed corpus.
#
# Provenance / honesty notes:
# - portals / uza は本物アンカーの暫定 stub（spectral_bands 未計測・観測ログ由来）。
# - orchestral_* / electronic_dance_* は 2026-06-25 セッションで実 Suno 音源を
#   `extract` した measured 値（小数4桁）。container は ephemeral で音源は session
#   添付（既に消失）。再取得コスト回避のため measured を本 manifest にインライン保全。
#   analyze は `sample.measured` があればそれを直接使う（audio_hash/locator は
#   provenance 専用で解析には不要）。
# - audio_hash: 2026-06-25 dated log には sha256 の先頭 8 桁のみ保全（full hash は
#   ephemeral extract で消失）。検証用フィールドとして full hash がないため
#   audio_hash は未設定とし、prefix は notes に provenance として記録する。
# - drive_file_id: orchestral 5 本は Drive アップロード済（既知 ID）。EDM 5 本は
#   Drive 未アップロード（follow-up: Drive 化 → drive_file_id 回収）。
# - prompt: Suno 生成プロンプト本文は未転記（follow-up）。捏造を避け PENDING を明記。
