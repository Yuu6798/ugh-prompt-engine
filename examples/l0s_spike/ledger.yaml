    と frozen/eval_control_profile.yaml はさらに前の 306add7 で導入済みで、
    以降も無変更）。4b98e7b = 周回 5（最終）計測コミット。
    `git log --oneline 3eb25e1..4b98e7b -- <path>` はいずれの対象パスでも
    空（この範囲でこれらのパスへの変更コミットが無い）ことを実測確認済み。
