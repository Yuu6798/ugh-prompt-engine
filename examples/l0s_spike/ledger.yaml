runner_at_measurement:
  # 陽性対照 + 周回 1〜5 の全計測時点で使われていた runner script /
  # frozen fixture の blob sha256 (Codex P2 5巡目 B レビューで新設)。
  # スクリプトは計測期間中不変のはず、という前提を裏取りするため、まず
  # `git log --oneline <range> -- <path>` が空であること（該当パスへの
  # 変更コミットが計測期間内に存在しない）を実測確認してから、期間内の
  # 1 コミットの blob を `git show <commit>:<path> | sha256sum` で pin する
  # （変更が無いと確認済みのため、期間内のどのコミットで採っても同じ blob）。
