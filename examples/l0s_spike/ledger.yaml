# L0-s spike ledger — L0S-T1. Source of truth for engine/deps pins,
# pinned-input hashes, and the positive-control gate result (contract.md's
# "陽性対照ゲート" section: `ledger.yaml` の `positive_control` 節が正).
# `rounds` accumulates real spike evidence (author round-trips against
# `scripts/measure_round.py`'s `report.json`), separate from the positive
# control (which is dry-run only and never counted as spike evidence).
spike_id: L0S-T1
# engine_state (是正 2026-08-05, Codex P2 5巡目 B レビュー): provenance を
# content-hash 主体へ是正した。旧 engine_commit の値
# (306add7914c80f1a0dd48c521100f6062c6d2846) は WIP ローカルコミット参照で
# あり origin/main から到達不能だった（`git merge-base --is-ancestor
# 306add7914c80f1a0dd48c521100f6062c6d2846 origin/main` は failure を実測）。
# 透明性のため削除せず `superseded_engine_commit` として注記のまま残す。
engine_state:
  base_commit: "2334b0ba3572b0f519060d88ef0aca1eb83a4e07"
  base_commit_note: >-
    `git merge-base origin/main HEAD` で決定論的に確認した、origin/main
    から実際に到達可能なコミット（main の PR #244 マージ + 直後の
    memory wrap-up commit。件名に "(PR #244)" を含む）。
  src_unchanged: true
  src_unchanged_note: >-
    本ブランチは src/ および tests/ を一切変更していない
    （`git diff --stat 2334b0ba3572b0f519060d88ef0aca1eb83a4e07..HEAD --
    src/ tests/` が空であることを実測確認）。
  verification_commands:
    - "git fetch origin main"
    - "git merge-base origin/main HEAD"
    - "git merge-base --is-ancestor <candidate_sha> origin/main"
    - "git diff --stat <base_commit>..HEAD -- src/ tests/"
  superseded_engine_commit:
    value: "306add7914c80f1a0dd48c521100f6062c6d2846"
    reason: >-
      旧 engine_commit フィールドの値。WIP ローカルコミット参照であり
      origin/main から到達不能だったため、到達可能な base_commit pin へ
      是正した（Codex P2 5巡目 B レビュー）。
recorded_utc: "2026-08-05T05:44:55Z"

