# CLAP vocal-contrast manifest v2 — CLAP ③ 対称ブロック統合版 (2026-07-08)
#
# lyrics_vocal_contrast_manifest.yaml (#131, 6 サンプル) の後継ではなく別ブロックの
# 統合版。2026-07-08 に新規生成した EDM/Rock × 歌詞 present/absent 各2テイク (8本)
# を examples/real_audio_validation/lyrics_symmetric_block_2026-07-08.yaml の
# 対称ブロックとして同一方式（scripts/collect_clap_fixture.py, prompts/prompt_groups
# は既存 vocal 対をそのまま流用）で採取する。
#
# 実音源は repo 外（DD-A: 音源非コミット方針を踏襲）。clean checkout からの再現手順
# (materialize) は #131 と同じ cache 規約に従う:
#   1. mkdir -p examples/roundtrip/cache/pr2b-2-clap/  （.gitignore 対象の作業キャッシュ）
#   2. 各サンプルの音源ファイルを audio_path のファイル名どおりに同ディレクトリへ配置する
#      （本ブロックはユーザーからの直接アップロードで drive_file_id 未取得 — follow-up
#      で Drive アップロード後に追記する）
#   3. scripts/collect_clap_fixture.py --manifest lyrics_vocal_contrast_v2_manifest.yaml
#      --output lyrics_vocal_contrast_v2_fixture.json --checkpoint
#      music_audioset_epoch_15_esc_90.14.pt --amodel HTSAT-base を実行 — collector が
#      manifest の audio_sha256 pin を自動照合し、バイト列不一致は fail-fast する
#
# condition.genre / lyrics は
# examples/real_audio_validation/lyrics_symmetric_block_2026-07-08.yaml の
# take id / lyrics 表記と揃える（present_alt / absent_alt = 同条件の再生成2テイク目）。

