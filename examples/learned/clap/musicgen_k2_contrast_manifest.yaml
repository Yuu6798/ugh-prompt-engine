# CLAP 相互検証② — MusicGen K2 バッチ (32 takes) への学習版センサー適用 manifest
#
# 実音源は repo 外（DD-A: 音源非コミット）。ただし PR2b-2 (Drive 律速) と異なり、
# 本バッチは同一環境なら決定論再生成できる（PR #137 §7.3 で sha256 完全再現を実証済み）:
#   1. mkdir -p examples/roundtrip/cache/k2-musicgen/
#   2. python scripts/collect_musicgen_takes.py generate \
#        --plan examples/control/k2_musicgen/plan.yaml \
#        --output-dir examples/roundtrip/cache/k2-musicgen \
#        --manifest-out /tmp/k2_musicgen_takes_manifest.json
#      （musicgen extra + HF アクセス必須。revision は plan が pin）
#   3. scripts/collect_clap_fixture.py が manifest の audio_sha256 pin を自動照合し、
#      バイト列不一致は fail-fast する
#
# audio_sha256 は examples/control/k2_musicgen/fixture.json (PR #136) と同一の pin。
# prompts は生成語彙と同一トークン（brightness）/ fast-slow 対比（bpm — 素朴 bpm
# センサーの半折り交絡に対する第三の独立検証角、docs/musicgen_backend.md §7.5）。
