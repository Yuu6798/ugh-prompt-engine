  audio_path: ../../roundtrip/cache/pr2b-2-clap/edm_lyrics.mp3
  audio_sha256: 9ef088ed259064f26fc3085155918ac64da8e508523ee328af057ddce88b34e5
  drive_file_id: 1rteqEfHDGM_rbz4mfH180C7LYEa6xSJA
  prompts:
    positive:
      - a song with lead vocals
      - singing with lyrics
    negative:
      - an instrumental track with no vocals
      - instrumental music
  prompt_groups:
    positive:
      - a song with lead vocals
