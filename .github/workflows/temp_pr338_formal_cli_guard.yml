name: temp-pr338-formal-cli-guard

on:
  push:
    branches:
      - codex/run9-rev07-alternate-attempt

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-rev07-alternate-attempt
          fetch-depth: 0
      - name: Apply fail-closed formal rev0.6 CLI guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('voice_genesis/evolution/run9_dual_founder_pjs/birth_probe_executor.py')
          text = path.read_text(encoding='utf-8')

          constant_anchor = '_PYWORLD_PIN_VERSION = "0.3.5"\n'
          constant_insert = (
              '_PYWORLD_PIN_VERSION = "0.3.5"\n'
              '_FORMAL_REV06_CLI_DISABLED = True\n'
          )
          if '_FORMAL_REV06_CLI_DISABLED = True' not in text:
              if constant_anchor not in text:
                  raise SystemExit('constant anchor not found')
              text = text.replace(constant_anchor, constant_insert, 1)

          guard_anchor = '    try:\n        _assert_helper_modules_not_preloaded()\n'
          guard_insert = (
              '    try:\n'
              '        if _FORMAL_REV06_CLI_DISABLED:\n'
              '            raise BirthProbeError(\n'
              '                "formal RUN9 rev 0.6 CLI is permanently disabled after the terminal "\n'
              '                "2026-08-28 IMPLEMENTATION_FAILED attempt; use only the quarantined "\n'
              '                "non-adjudicative diagnostic path until a separately reviewed design "\n'
              '                "revision/reexport/contract refreeze is installed"\n'
              '            )\n'
              '        _assert_helper_modules_not_preloaded()\n'
          )
          if 'formal RUN9 rev 0.6 CLI is permanently disabled' not in text:
              if guard_anchor not in text:
                  raise SystemExit('main guard anchor not found')
              text = text.replace(guard_anchor, guard_insert, 1)

          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/temp_pr338_formal_cli_guard.yml')
          workflow.unlink()
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/evolution/run9_dual_founder_pjs/birth_probe_executor.py .github/workflows/temp_pr338_formal_cli_guard.yml
          git commit -m "fix(run9): keep terminal rev0.6 formal CLI disabled"
          git push origin HEAD:codex/run9-rev07-alternate-attempt
