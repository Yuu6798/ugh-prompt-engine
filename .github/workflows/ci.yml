name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN は読み取り専用に固定する（このワークフローのどのジョブも書き込み
# 系 API / アーティファクト / コメント / ラベル操作を行わない）。
permissions:
  contents: read

# Review loops can push many revisions while a 30-minute shard is still
# running.  Keep only the newest run for a branch/PR instead of burning runner
# time on results that can no longer be merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# test-m2-harness + test-l0b-reeval + test-foundry-core + test-rest の和が全件
# （test-m2-harness
# は tests/test_m2_accuracy_harness.py のみ、test-l0b-reeval は下記 3 テスト
# のみ、test-foundry-core は通常依存で収集できる Foundry 32 ファイル、test-rest は
# それらを --ignore/--deselect で除いた残り全部）=
# カバレッジ不変・CI が slow を skip しない原則を維持したまま、壁時計を各
# ジョブの timeout 枠に収めるためのシャーディングのみ（slow を skip せず、
# 実行するジョブを分けるだけ）。timeout-minutes: 35 = テスト予算 30 分 + checkout/uv sync
# セットアップ許容 5 分。テスト実測が 30 分を超えたらこの backstop の枠を
# 広げるのではなく、シャードを再分割して対処する。
#
# test-m2-harness は 851 tests / 29–35 分まで増え、単一ファイル shard のまま
# 35 分 timeout に常態的に接触した（2026-08-22）。依存追加なしで現在の pytest
# 収集順を 3 つの連続区間へ分ける。node id の固定リストを持たないため、テストの
# 追加・削除後も 3 shard の和は常にその時点の同ファイル全件になる。
#
# test-l0b-reeval（PR #249 Codex レビュー第 20 巡, P1 新設）: 第 13/19 巡で
# 追加した l0b 台帳の凍結判定器フル再評価 2 テスト（
# `test_ledger_l0br_reports_reproduce_frozen_judge_reevaluation` 実測 ~15
# 分・`test_ledger_l0br_new_search_positive_controls_reproduce_frozen_
# judge_reevaluation` 実測 ~2 分）が test-rest の実績 ~26 分に積み上がって
# timeout-minutes: 35 を超過するため、test-m2-harness と同じ前例（file 単位
# の shard 切り出し）に倣い、この 2 テストだけを個別 node id 指定で新 job へ
# 分離する。移動対象をこの 2 件のみに絞ったのは、同ファイル内の他の slow
# テスト（`test_run_round_rejects_recorded_artifact_drift_before_publish_
# on_success_path` / `test_positive_control_round_trip_reproduces_pinned_
# report` / `test_positive_control_t2_round_trip_reproduces_pinned_report`
# ——いずれも 1 round 規模）は既に test-rest の ~26 分実績に含まれた状態で
# timeout 内に収まっており、動かす理由がないため。timeout-minutes: 30 =
# テスト予算 ~17 分 + セットアップ許容の余裕。
#
# PR #250 Codex レビュー第 1 巡, 指摘 1 で `test_ledger_l0br_v2_series_runs_
# reports_reproduce_frozen_judge_reevaluation`（v2, 6 round 規模・概算 5〜8
# 分）を追加。v1 の同型テストと同じ「凍結判定器フル再評価」ジョブに乗せる
# ため node id をこの job へ追加し、test-rest からは deselect する。
#
# ruff は lint ジョブに一本化する（Python 3.11 単一・matrix 非依存の静的解析のため
# 各 test-* ジョブ側でマトリクス分だけ重複実行する意味がない）。
#
# 依存導入は uv.lock + `uv sync --locked`（lock が pyproject.toml と食い違えば CI が
# 落ちる = lock の更新漏れを検出）。Python は actions/setup-python が入れたものを
# 使い、UV_PYTHON_DOWNLOADS=never で uv が別の Python を勝手に取得して matrix と
# 食い違うことを禁止する（該当 Python が無ければ即エラー）。
#
# venv は uv ではなく標準の `python -m venv .venv` で先に作り、`uv sync` にはその
# 既存 venv へ入れさせる。uv 自作の venv は _virtualenv.pth / _virtualenv.py を置き、
# sys.meta_path 先頭へ `_virtualenv._Finder` を差し込む。M2 計測ハーネス
# （scripts/run_melody_accuracy.py）は測定の再現性のため非標準の import hook を
# fail-closed で拒否し、許可するのは `_distutils_hack.DistutilsMetaFinder` のみ
# なので、uv 自作 venv では tests/test_m2_accuracy_harness.py の
# test_non_standard_import_hooks_clean_in_real_environment と
# test_reverification_refuses_when_stack_cannot_rerun が落ちる。ハーネス側の許可リスト
# 拡張は測定器の変更になるため行わず、CI 側で標準 venv を使う（pip 時代の CI と
# 同じ meta_path になる）。
env:
  FOUNDRY_CORE_MANIFEST: .github/test-paths/foundry-core.txt
  UV_PYTHON_DOWNLOADS: never

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .

  test-m2-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard-index: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Test M2 shard ${{ matrix.shard-index }}
        shell: bash
        run: |
          if ! collection=$(uv run --no-sync pytest --collect-only -q tests/test_m2_accuracy_harness.py); then
            echo "$collection" >&2
            exit 1
          fi
          mapfile -t nodeids < <(
            printf '%s\n' "$collection" \
              | sed -n '\|^tests/test_m2_accuracy_harness.py::|p'
          )
          total=${#nodeids[@]}
          if (( total == 0 )); then
            echo "No M2 harness tests were collected" >&2
            exit 1
          fi

          shard_total=3
          shard_index=${{ matrix.shard-index }}
          chunk=$(( (total + shard_total - 1) / shard_total ))
          start=$(( shard_index * chunk ))
          if (( start >= total )); then
            echo "Shard ${shard_index} is empty (total=${total}, chunk=${chunk})" >&2
            exit 1
          fi
          length=$(( total - start ))
          if (( length > chunk )); then
            length=$chunk
          fi

          echo "Running M2 harness shard ${shard_index}: ${length}/${total} tests"
          uv run --no-sync pytest -q --tb=short --durations=25 "${nodeids[@]:start:length}"

  test-l0b-reeval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Test
        run: >-
          uv run --no-sync pytest -q --tb=short --durations=25
          tests/test_l0b_scripts.py::test_ledger_l0br_reports_reproduce_frozen_judge_reevaluation
          tests/test_l0b_scripts.py::test_ledger_l0br_new_search_positive_controls_reproduce_frozen_judge_reevaluation
          tests/test_l0b_scripts.py::test_ledger_l0br_v2_series_runs_reports_reproduce_frozen_judge_reevaluation

  test-foundry-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Test Foundry core
        shell: bash
        run: |
          if [[ ! -f "$FOUNDRY_CORE_MANIFEST" ]]; then
            echo "Missing Foundry core manifest: $FOUNDRY_CORE_MANIFEST" >&2
            exit 1
          fi
          mapfile -t foundry_tests < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$FOUNDRY_CORE_MANIFEST"
          )
          if (( ${#foundry_tests[@]} == 0 )); then
            echo "Foundry core manifest is empty" >&2
            exit 1
          fi
          for path in "${foundry_tests[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Foundry core test does not exist: $path" >&2
              exit 1
            fi
          done
          uv run --no-sync pytest -q --tb=short --durations=25 "${foundry_tests[@]}"

  test-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [0, 1]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Test calibration (shard ${{ matrix.shard }})
        shell: bash
        run: |
          # PR #345 でスイートが増大し、単一 job・timeout 15 分では収まらなくなった。
          # 2 shard に分割して並列化する。shard 0 = 重量級 4 ファイル固定、
          # shard 1 = 残り全部（--ignore は file の start path を除外できるが、
          # pyproject の testpaths エントリ自体は除外できない点に注意）。
          shard0_files=(
            voice_genesis/calibration/tests/test_campaign_cli.py
            voice_genesis/calibration/tests/test_campaign_measure.py
            voice_genesis/calibration/tests/test_campaign_render.py
            voice_genesis/calibration/tests/test_c0_freeze.py
          )
          if [[ "${{ matrix.shard }}" == "0" ]]; then
            uv run --no-sync pytest -q --tb=short -p no:cacheprovider "${shard0_files[@]}"
          else
            ignore_args=()
            for f in "${shard0_files[@]}"; do
              ignore_args+=(--ignore "$f")
            done
            uv run --no-sync pytest -q --tb=short -p no:cacheprovider "${ignore_args[@]}" voice_genesis/calibration/tests
          fi

  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Test
        shell: bash
        run: |
          if [[ ! -f "$FOUNDRY_CORE_MANIFEST" ]]; then
            echo "Missing Foundry core manifest: $FOUNDRY_CORE_MANIFEST" >&2
            exit 1
          fi
          mapfile -t foundry_tests < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$FOUNDRY_CORE_MANIFEST"
          )
          if (( ${#foundry_tests[@]} == 0 )); then
            echo "Foundry core manifest is empty" >&2
            exit 1
          fi
          # testpaths にファイルを明示した場合、--ignore はその start path を
          # 除外しない。ファイル node-id prefix の --deselect で専用 job との
          # 二重実行を防ぐ。
          deselect_args=()
          for path in "${foundry_tests[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Foundry core test does not exist: $path" >&2
              exit 1
            fi
            deselect_args+=("--deselect=$path")
          done
          uv run --no-sync pytest -q --tb=short --durations=25 \
            --ignore=tests/test_m2_accuracy_harness.py \
            "${deselect_args[@]}" \
            --deselect=voice_genesis/calibration/tests \
            --deselect=tests/test_l0b_scripts.py::test_ledger_l0br_reports_reproduce_frozen_judge_reevaluation \
            --deselect=tests/test_l0b_scripts.py::test_ledger_l0br_new_search_positive_controls_reproduce_frozen_judge_reevaluation \
            --deselect=tests/test_l0b_scripts.py::test_ledger_l0br_v2_series_runs_reports_reproduce_frozen_judge_reevaluation

  # uv.lock に載る全依存（dev + 全 extra。CI が実際に入れる集合ではなく lock 全体）
  # の既知脆弱性監査。インストールはせず、lock から書き出した exact pin の
  # requirements を pip-audit に渡す（--disable-pip = pip の依存解決を使わない
  # 純粋な pin 照合。--no-deps だけでは pip の dry-run 解決が走り、torch /
  # tensorflow まで引き込むため）。pip-audit 自体も lock された dev 依存（Dependabot
  # 管理）。
  #
  # `pitch` と `semantic-embed` は [tool.uv] conflicts で同時指定不可のため
  # `--all-extras` 単独では書き出せない。片方を `--no-extra` で外した 2 集合の和が
  # lock 全体になる（将来 extra を足せば自動で両集合へ入る。新たな conflicts を
  # 宣言すると uv export が失敗して気付ける = fail-closed）。
  #
  # requirements のマーカー（python_full_version など）は pip-audit が実行環境の
  # インタプリタで評価し、不一致行は黙って監査対象から外れる。Python 分岐の取りこぼしを
  # 防ぐため matrix で 3.11 / 3.12 の両方を回す。OS 限定の行（darwin / win32 のみ）は
  # ubuntu runner では監査されない。
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.32"
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        shell: bash
        run: |
          # 標準 venv を先に作る（理由はファイル冒頭コメント。uv に venv を作らせない）。
          python -m venv .venv
          uv sync --locked --extra dev

      - name: Audit locked dependencies (all extras)
        shell: bash
        run: |
          # pitch extra 限定の既知債務（basic-pitch==0.4.0 → tensorflow 2.15 固定）。pitch を差し替え/廃止するか tensorflow の pin が外れたら削除
          # 既知・修正不能の脆弱性（2026-10-21 時点で計 14 ID。lock 全体の監査を
          # 緑のベースラインにして、新規 ID だけを赤にするための明示 ignore）:
          #   - keras 2.15.0 の 13 ID と protobuf 4.25.9 の 1 ID（どちらも Python 3.11 のみ。
          #     3.12 は pitch が lock に載らず、protobuf も 7.36.2 で該当 ID なし）
          # 原因はいずれも `pitch` extra: basic-pitch 0.4.0 -> tensorflow 2.15.0 が
          # keras<2.16 / protobuf<5 を固定し、修正版（keras 3.x / protobuf 5.29.6+）へ
          # lock では上げられない。CI の test ジョブは pitch を入れない（監査のみ）。
          # 削除条件: pitch の置換・削除、または tensorflow の上限緩和で、これらの
          # pin が uv.lock から消えたとき（ID の追加・変更は ignore せず赤のまま扱う）。
          ignore_vulns=(
            CVE-2025-12060
            PYSEC-2025-76
            PYSEC-2025-121
            PYSEC-2026-1487
            PYSEC-2026-1805
            PYSEC-2026-2324
            PYSEC-2026-2547
            PYSEC-2026-3629
            PYSEC-2026-3630
            PYSEC-2026-3631
            PYSEC-2026-3632
            PYSEC-2026-3633
            PYSEC-2026-3634
            PYSEC-2026-3856
          )
          ignore_args=()
          for vuln_id in "${ignore_vulns[@]}"; do
            ignore_args+=(--ignore-vuln "$vuln_id")
          done
          # 先に `uv sync --locked` が lock の鮮度を保証済み（--frozen はここでは安全）。
          status=0
          for excluded in semantic-embed pitch; do
            req="${RUNNER_TEMP}/audit-without-${excluded}.txt"
            uv export --frozen --all-extras --no-extra "$excluded" \
              --no-emit-project --no-hashes -o "$req" > /dev/null
            echo "::group::pip-audit (uv.lock minus extra '${excluded}')"
            uv run --no-sync pip-audit --strict --no-deps --disable-pip \
              "${ignore_args[@]}" -r "$req" || status=1
            echo "::endgroup::"
          done
          exit "$status"
