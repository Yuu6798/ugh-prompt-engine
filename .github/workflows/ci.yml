name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# test-m2-harness + test-rest の和が全件（--ignore は tests/test_m2_accuracy_harness.py
# のみを除外）= カバレッジ不変、壁時計を 30 分枠に収めるためのシャーディングのみ。
# timeout-minutes: 35 = テスト予算 30 分 + checkout/pip セットアップ許容 5 分。テスト
# 実測が 30 分を超えたらこの backstop の枠を広げるのではなく、シャードを再分割して対処する。
#
# ruff は lint ジョブに一本化する（Python 3.11 単一・matrix 非依存の静的解析のため
# test-m2-harness / test-rest 側でマトリクス分だけ重複実行する意味がない）。
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ruff
        run: pip install "ruff>=0.1"

      - name: Lint
        run: ruff check .

  test-m2-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q --tb=short --durations=25 tests/test_m2_accuracy_harness.py

  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q --tb=short --durations=25 --ignore=tests/test_m2_accuracy_harness.py
