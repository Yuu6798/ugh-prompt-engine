name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# test-m2-harness + test-rest の和が全件（--ignore は tests/test_m2_accuracy_harness.py
# のみを除外）= カバレッジ不変、壁時計を 30 分枠に収めるためのシャーディングのみ。
jobs:
  test-m2-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --tb=short --durations=25 tests/test_m2_accuracy_harness.py

  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q --tb=short --durations=25 --ignore=tests/test_m2_accuracy_harness.py
