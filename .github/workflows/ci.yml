name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Review loops can push many revisions while a 30-minute shard is still
# running.  Keep only the newest run for a branch/PR instead of burning runner
# time on results that can no longer be merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# test-m2-harness + test-l0b-reeval + test-foundry-core + test-rest の和が全件
# （test-m2-harness
# は tests/test_m2_accuracy_harness.py のみ、test-l0b-reeval は下記 3 テスト
# のみ、test-foundry-core は通常依存で収集できる Foundry 32 ファイル、test-rest は
# それらを --ignore/--deselect で除いた残り全部）=
# カバレッジ不変・CI が slow を skip しない原則を維持したまま、壁時計を各
# ジョブの timeout 枠に収めるためのシャーディングのみ（slow を skip せず、
# 実行するジョブを分けるだけ）。timeout-minutes: 35 = テスト予算 30 分 + checkout/pip
# セットアップ許容 5 分。テスト実測が 30 分を超えたらこの backstop の枠を
# 広げるのではなく、シャードを再分割して対処する。
#
# test-m2-harness は 851 tests / 29–35 分まで増え、単一ファイル shard のまま
# 35 分 timeout に常態的に接触した（2026-08-22）。依存追加なしで現在の pytest
# 収集順を 3 つの連続区間へ分ける。node id の固定リストを持たないため、テストの
# 追加・削除後も 3 shard の和は常にその時点の同ファイル全件になる。
#
# test-l0b-reeval（PR #249 Codex レビュー第 20 巡, P1 新設）: 第 13/19 巡で
# 追加した l0b 台帳の凍結判定器フル再評価 2 テスト（
# `test_ledger_l0br_reports_reproduce_frozen_judge_reevaluation` 実測 ~15
# 分・`test_ledger_l0br_new_search_positive_controls_reproduce_frozen_
# judge_reevaluation` 実測 ~2 分）が test-rest の実績 ~26 分に積み上がって
# timeout-minutes: 35 を超過するため、test-m2-harness と同じ前例（file 単位
# の shard 切り出し）に倣い、この 2 テストだけを個別 node id 指定で新 job へ
# 分離する。移動対象をこの 2 件のみに絞ったのは、同ファイル内の他の slow
# テスト（`test_run_round_rejects_recorded_artifact_drift_before_publish_
# on_success_path` / `test_positive_control_round_trip_reproduces_pinned_
# report` / `test_positive_control_t2_round_trip_reproduces_pinned_report`
# ——いずれも 1 round 規模）は既に test-rest の ~26 分実績に含まれた状態で
# timeout 内に収まっており、動かす理由がないため。timeout-minutes: 30 =
# テスト予算 ~17 分 + セットアップ許容の余裕。
#
# PR #250 Codex レビュー第 1 巡, 指摘 1 で `test_ledger_l0br_v2_series_runs_
# reports_reproduce_frozen_judge_reevaluation`（v2, 6 round 規模・概算 5〜8
# 分）を追加。v1 の同型テストと同じ「凍結判定器フル再評価」ジョブに乗せる
# ため node id をこの job へ追加し、test-rest からは deselect する。
#
# ruff は lint ジョブに一本化する（Python 3.11 単一・matrix 非依存の静的解析のため
# 各 test-* ジョブ側でマトリクス分だけ重複実行する意味がない）。
env:
  FOUNDRY_CORE_MANIFEST: .github/test-paths/foundry-core.txt

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install ruff
        run: pip install "ruff>=0.1"

      - name: Lint
        run: ruff check .

  test-m2-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard-index: [0, 1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test M2 shard ${{ matrix.shard-index }}
        shell: bash
        run: |
          if ! collection=$(pytest --collect-only -q tests/test_m2_accuracy_harness.py); then
            echo "$collection" >&2
            exit 1
          fi
          mapfile -t nodeids < <(
            printf '%s\n' "$collection" \
              | sed -n '\|^tests/test_m2_accuracy_harness.py::|p'
          )
          total=${#nodeids[@]}
          if (( total == 0 )); then
            echo "No M2 harness tests were collected" >&2
            exit 1
          fi

          shard_total=3
          shard_index=${{ matrix.shard-index }}
          chunk=$(( (total + shard_total - 1) / shard_total ))
          start=$(( shard_index * chunk ))
          if (( start >= total )); then
            echo "Shard ${shard_index} is empty (total=${total}, chunk=${chunk})" >&2
            exit 1
          fi
          length=$(( total - start ))
          if (( length > chunk )); then
            length=$chunk
          fi

          echo "Running M2 harness shard ${shard_index}: ${length}/${total} tests"
          pytest -q --tb=short --durations=25 "${nodeids[@]:start:length}"

  test-l0b-reeval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: >-
          pytest -q --tb=short --durations=25
          tests/test_l0b_scripts.py::test_ledger_l0br_reports_reproduce_frozen_judge_reevaluation
          tests/test_l0b_scripts.py::test_ledger_l0br_new_search_positive_controls_reproduce_frozen_judge_reevaluation
          tests/test_l0b_scripts.py::test_ledger_l0br_v2_series_runs_reports_reproduce_frozen_judge_reevaluation

  test-foundry-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test Foundry core
        shell: bash
        run: |
          if [[ ! -f "$FOUNDRY_CORE_MANIFEST" ]]; then
            echo "Missing Foundry core manifest: $FOUNDRY_CORE_MANIFEST" >&2
            exit 1
          fi
          mapfile -t foundry_tests < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$FOUNDRY_CORE_MANIFEST"
          )
          if (( ${#foundry_tests[@]} == 0 )); then
            echo "Foundry core manifest is empty" >&2
            exit 1
          fi
          for path in "${foundry_tests[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Foundry core test does not exist: $path" >&2
              exit 1
            fi
          done
          pytest -q --tb=short --durations=25 "${foundry_tests[@]}"

  test-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        shell: bash
        run: |
          if [[ ! -f "$FOUNDRY_CORE_MANIFEST" ]]; then
            echo "Missing Foundry core manifest: $FOUNDRY_CORE_MANIFEST" >&2
            exit 1
          fi
          mapfile -t foundry_tests < <(
            sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$FOUNDRY_CORE_MANIFEST"
          )
          if (( ${#foundry_tests[@]} == 0 )); then
            echo "Foundry core manifest is empty" >&2
            exit 1
          fi
          # testpaths にファイルを明示した場合、--ignore はその start path を
          # 除外しない。ファイル node-id prefix の --deselect で専用 job との
          # 二重実行を防ぐ。
          deselect_args=()
          for path in "${foundry_tests[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Foundry core test does not exist: $path" >&2
              exit 1
            fi
            deselect_args+=("--deselect=$path")
          done
          pytest -q --tb=short --durations=25 \
            --ignore=tests/test_m2_accuracy_harness.py \
            "${deselect_args[@]}" \
            --deselect=tests/test_l0b_scripts.py::test_ledger_l0br_reports_reproduce_frozen_judge_reevaluation \
            --deselect=tests/test_l0b_scripts.py::test_ledger_l0br_new_search_positive_controls_reproduce_frozen_judge_reevaluation \
            --deselect=tests/test_l0b_scripts.py::test_ledger_l0br_v2_series_runs_reports_reproduce_frozen_judge_reevaluation
