name: PR342 checkout/control/invariance bounded patch

on:
  push:
    branches:
      - "claude/design-based-implementation-653xpl"
    paths:
      - ".github/workflows/pr342-checkout-control-invariance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/design-based-implementation-653xpl"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply bounded review fixes
        run: python .github/pr342_checkout_control_invariance_patch.py

      - name: Align existing mixed-control regression with frozen control identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("voice_genesis/calibration/tests/test_provenance.py")
          s = p.read_text(encoding="utf-8")
          old = '''def test_check_leakage_control_row_ids_excluded_non_control_holdout_still_detected() -> None:
              """[IMPLEMENTATION_MAP_v1.md §2.7 control 共有契約] control 行
              (`control_row_ids`) は sweep truth を運ばないため、unseal 前に holdout
              split 上で参照されても leakage としない。一方、同じ entry 集合内の
              非 control な holdout 行は従来どおり検出される。"""
              entries = [
                  LedgerEntry(
                      seq=0,
                      prev_sha="0" * 64,
                      entry_sha="a" * 64,
                      payload={"kind": "render", "row_id": "holdout-control-1"},
                  ),
                  LedgerEntry(
                      seq=1,
                      prev_sha="a" * 64,
                      entry_sha="b" * 64,
                      payload={"kind": "meter_call", "row_id": "holdout-control-1"},
                  ),
                  LedgerEntry(
                      seq=2,
                      prev_sha="b" * 64,
                      entry_sha="c" * 64,
                      payload={"kind": "meter_call", "row_id": "holdout-sweep-1"},
                  ),
              ]
              result = Ledger.check_leakage(
                  entries,
                  holdout_row_ids=["holdout-control-1", "holdout-sweep-1"],
                  unseal_seq=None,
                  control_row_ids=["holdout-control-1"],
              )
              assert result.blocked == BlockedCode.BLOCKED_LEAKAGE
              assert result.control_excluded_count == 2'''
          new = '''def test_check_leakage_control_row_ids_excluded_non_control_holdout_still_detected() -> None:
              """Only a frozen negative-control identity receives the exemption; a second
              truth-bearing holdout row in the same entry set remains blocked."""
              control_id = sorted(negative_control_row_ids(build_matrix()))[0]
              truth_row = next(
                  mr
                  for mr in build_matrix()
                  if mr.row.block == "TRUTH_CORE" and mr.row.control_class is None
              )
              entries = [
                  LedgerEntry(
                      seq=0,
                      prev_sha="0" * 64,
                      entry_sha="a" * 64,
                      payload={"kind": "render", "row_id": control_id},
                  ),
                  LedgerEntry(
                      seq=1,
                      prev_sha="a" * 64,
                      entry_sha="b" * 64,
                      payload={"kind": "meter_call", "row_id": control_id},
                  ),
                  LedgerEntry(
                      seq=2,
                      prev_sha="b" * 64,
                      entry_sha="c" * 64,
                      payload={"kind": "meter_call", "row_id": truth_row.row_id},
                  ),
              ]
              result = Ledger.check_leakage(
                  entries,
                  holdout_row_ids=[control_id, truth_row.row_id],
                  unseal_seq=None,
                  control_row_ids=[control_id],
              )
              assert result.blocked == BlockedCode.BLOCKED_LEAKAGE
              assert result.control_excluded_count == 2'''
          if old not in s:
              raise SystemExit("mixed-control regression anchor not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit locally for clean-checkout validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/calibration/c0_validate.py \
                  voice_genesis/calibration/provenance.py \
                  voice_genesis/calibration/gates.py \
                  voice_genesis/calibration/tests/test_c0_validate.py \
                  voice_genesis/calibration/tests/test_provenance.py \
                  voice_genesis/calibration/tests/test_gates.py
          git diff --cached --check
          git commit -m "fix(calibration): authenticate C0 and leakage evidence"

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run targeted regressions
        run: |
          pytest -q --tb=short \
            voice_genesis/calibration/tests/test_c0_validate.py \
            voice_genesis/calibration/tests/test_provenance.py \
            voice_genesis/calibration/tests/test_gates.py \
            voice_genesis/calibration/tests/test_c0_path_inventory_sync.py

      - name: Lint bounded changes
        run: |
          ruff check \
            voice_genesis/calibration/c0_validate.py \
            voice_genesis/calibration/provenance.py \
            voice_genesis/calibration/gates.py \
            voice_genesis/calibration/tests/test_c0_validate.py \
            voice_genesis/calibration/tests/test_provenance.py \
            voice_genesis/calibration/tests/test_gates.py

      - name: Push bounded fix
        run: git push origin HEAD:claude/design-based-implementation-653xpl
