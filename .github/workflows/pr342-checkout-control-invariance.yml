name: PR342 checkout/control/invariance bounded patch

on:
  push:
    branches:
      - "claude/design-based-implementation-653xpl"
    paths:
      - ".github/workflows/pr342-checkout-control-invariance.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/design-based-implementation-653xpl"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply bounded review fixes
        run: python .github/pr342_checkout_control_invariance_patch.py

      - name: Commit locally for clean-checkout validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/calibration/c0_validate.py \
                  voice_genesis/calibration/provenance.py \
                  voice_genesis/calibration/gates.py \
                  voice_genesis/calibration/tests/test_c0_validate.py \
                  voice_genesis/calibration/tests/test_provenance.py \
                  voice_genesis/calibration/tests/test_gates.py
          git diff --cached --check
          git commit -m "fix(calibration): authenticate C0 and leakage evidence"

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run targeted regressions
        run: |
          pytest -q --tb=short \
            voice_genesis/calibration/tests/test_c0_validate.py \
            voice_genesis/calibration/tests/test_provenance.py \
            voice_genesis/calibration/tests/test_gates.py \
            voice_genesis/calibration/tests/test_c0_path_inventory_sync.py

      - name: Lint bounded changes
        run: |
          ruff check \
            voice_genesis/calibration/c0_validate.py \
            voice_genesis/calibration/provenance.py \
            voice_genesis/calibration/gates.py \
            voice_genesis/calibration/tests/test_c0_validate.py \
            voice_genesis/calibration/tests/test_provenance.py \
            voice_genesis/calibration/tests/test_gates.py

      - name: Push bounded fix
        run: git push origin HEAD:claude/design-based-implementation-653xpl
