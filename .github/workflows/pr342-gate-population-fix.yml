name: PR342 gate population bounded fix

on:
  push:
    branches:
      - claude/design-based-implementation-653xpl

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/design-based-implementation-653xpl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded review fixes
        run: python .github/pr342_gate_population_patch.py
      - name: Remove temporary assets
        run: |
          rm -f .github/pr342_gate_population_patch.py
          rm -f .github/workflows/pr342-gate-population-fix.yml
      - name: Commit locally for validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(calibration): authenticate gate populations"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run calibration regressions
        run: pytest -q --tb=short voice_genesis/calibration/tests
      - name: Lint bounded changes
        run: |
          ruff check \
            voice_genesis/calibration/gates.py \
            voice_genesis/calibration/tests/test_gates.py
      - name: Push bounded fix
        run: git push origin HEAD:claude/design-based-implementation-653xpl
