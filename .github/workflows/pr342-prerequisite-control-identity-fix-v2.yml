name: PR342 prerequisite control identity bounded fix v2

on:
  push:
    branches:
      - claude/design-based-implementation-653xpl
    paths:
      - .github/workflows/pr342-prerequisite-control-identity-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/design-based-implementation-653xpl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded review fixes
        run: |
          python .github/pr342_prereq_control_identity_patch.py
          python - <<'PY'
          from pathlib import Path
          for name in (
              "voice_genesis/calibration/tests/test_observables.py",
              "voice_genesis/calibration/tests/test_provenance_unseal_prerequisites.py",
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
      - name: Remove temporary assets
        run: |
          rm -f .github/pr342_prereq_control_identity_patch.py
          rm -f .github/workflows/pr342-prerequisite-control-identity-fix.yml
          rm -f .github/workflows/pr342-prerequisite-control-identity-fix-v2.yml
      - name: Commit locally for validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(calibration): validate unseal evidence and control identities"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run calibration regressions
        run: pytest -q --tb=short voice_genesis/calibration/tests
      - name: Lint bounded changes
        run: |
          ruff check \
            voice_genesis/calibration/provenance.py \
            voice_genesis/calibration/observables.py \
            voice_genesis/calibration/tests/test_provenance.py \
            voice_genesis/calibration/tests/test_provenance_unseal_prerequisites.py \
            voice_genesis/calibration/tests/test_observables.py
      - name: Push bounded fix
        run: git push origin HEAD:claude/design-based-implementation-653xpl
