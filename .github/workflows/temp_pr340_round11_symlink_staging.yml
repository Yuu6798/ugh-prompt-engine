name: temp-pr340-round11-symlink-staging
on:
  push:
    branches: [codex/run9-success-only-prepod]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply round11 symlink-safe staging fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          admission = run_dir / 'run9_success_admission.py'
          tests = run_dir / 'tests/test_success_only_admission.py'

          text = admission.read_text(encoding='utf-8')
          old = '''    # The output parent is the live HTTP document root in the Pod. Never stage\n    # partially built registration bytes underneath it: SimpleHTTPRequestHandler\n    # serves dot-prefixed directories too. Keep staging on the same filesystem but\n    # as a sibling of the document root, and expose it only via the final rename.\n    staging_parent = output_dir.parent.parent / f".{output_dir.parent.name}.run9-staging"\n    if staging_parent == output_dir.parent or output_dir.parent in staging_parent.parents:\n        raise bp.BirthProbeError("successful staging directory must be outside publication root")\n    staging_parent.mkdir(parents=True, exist_ok=True)\n    staging = Path(tempfile.mkdtemp(prefix=f".{output_dir.name}.build-", dir=staging_parent))\n'''
          new = '''    # The output parent is the live HTTP document root in the Pod. Never stage\n    # partially built registration bytes underneath it: SimpleHTTPRequestHandler\n    # serves dot-prefixed directories too. Resolve the actual publication root,\n    # then let mkdtemp atomically create a fresh sibling staging directory under\n    # its resolved parent so a pre-existing symlink cannot redirect staging back\n    # into the served tree. Validate the created path before writing bundle bytes.\n    publication_root = output_dir.parent.resolve(strict=True)\n    staging_parent = publication_root.parent.resolve(strict=True)\n    staging = Path(\n        tempfile.mkdtemp(prefix=f".{output_dir.name}.build-", dir=staging_parent)\n    )\n    if staging.is_symlink():\n        raise bp.BirthProbeError("successful staging directory must not be a symlink")\n    resolved_staging = staging.resolve(strict=True)\n    if (\n        resolved_staging == publication_root\n        or publication_root in resolved_staging.parents\n        or resolved_staging.parent != staging_parent\n    ):\n        raise bp.BirthProbeError("successful staging directory escaped private sibling root")\n    if os.stat(resolved_staging).st_dev != os.stat(publication_root).st_dev:\n        raise bp.BirthProbeError("successful staging directory is not on publication filesystem")\n    staging = resolved_staging\n'''
          if text.count(old) != 1:
              raise SystemExit(f'staging replacement count={text.count(old)}')
          admission.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_text = tests.read_text(encoding='utf-8')
          old_assert = '    assert staged.parent.parent == public_root.resolve().parent\n'
          new_assert = '    assert staged.parent == public_root.resolve().parent\n'
          if test_text.count(old_assert) != 1:
              raise SystemExit(f'private staging assertion count={test_text.count(old_assert)}')
          test_text = test_text.replace(old_assert, new_assert, 1)

          marker = '''def test_success_publisher_is_atomic_on_rename_failure(\n'''
          added = '''def test_success_publisher_rejects_symlinked_staging_before_bundle_writes(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    snapshot = _write_generated_export(tmp_path / "generated")\n    issued = _issue(snapshot)\n    public_root = tmp_path / "run9_public"\n    public_root.mkdir()\n    output = public_root / "successful_run9"\n    redirected = tmp_path / "redirected-staging"\n    redirected.symlink_to(public_root, target_is_directory=True)\n\n    monkeypatch.setattr(\n        admission.tempfile,\n        "mkdtemp",\n        lambda *args, **kwargs: str(redirected),\n    )\n    with pytest.raises(bp.BirthProbeError, match="must not be a symlink"):\n        admission.publish_successful_artifact_bundle(\n            output,\n            issued,\n            _measurement(passed=True),\n            _observations(),\n            bp.FeatureArtifact.from_vector(np.asarray([2.0, 2.0])),\n            snapshot,\n        )\n    assert not output.exists()\n    assert not (public_root / "model").exists()\n    assert not (public_root / "wav").exists()\n    assert not (public_root / "features").exists()\n\n\n'''
          if marker not in test_text:
              raise SystemExit('atomic rename test marker not found')
          test_text = test_text.replace(marker, added + marker, 1)
          tests.write_text(test_text, encoding='utf-8')
          PY
      - name: Validate round11 fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_admission.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round11_symlink_staging.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): resolve staging path before bundle writes'
          git push origin HEAD:codex/run9-success-only-prepod
