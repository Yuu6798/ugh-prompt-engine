name: PR342 selection/holdout bounded patch

on:
  push:
    branches:
      - claude/design-based-implementation-653xpl

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'fix(calibration): validate selection domains and holdout set')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/design-based-implementation-653xpl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply bounded review fixes
        run: python .github/pr342_selection_holdout_patch.py
      - name: Commit locally for validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/calibration/selection.py \
                  voice_genesis/calibration/provenance.py \
                  voice_genesis/calibration/tests/test_selection.py \
                  voice_genesis/calibration/tests/test_provenance.py
          git diff --cached --check
          git commit -m "fix(calibration): validate selection domains and holdout set"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run targeted regressions
        run: |
          pytest -q --tb=short \
            voice_genesis/calibration/tests/test_selection.py \
            voice_genesis/calibration/tests/test_provenance.py \
            voice_genesis/calibration/tests/test_c0_path_inventory_sync.py
      - name: Lint bounded changes
        run: |
          ruff check \
            voice_genesis/calibration/selection.py \
            voice_genesis/calibration/provenance.py \
            voice_genesis/calibration/tests/test_selection.py \
            voice_genesis/calibration/tests/test_provenance.py
      - name: Push bounded fix
        run: git push origin HEAD:claude/design-based-implementation-653xpl
