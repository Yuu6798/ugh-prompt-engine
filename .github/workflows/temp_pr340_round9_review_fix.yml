name: temp-pr340-round9-review-fix
on:
  push:
    branches: [codex/run9-success-only-prepod]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply round9 fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          runner = run_dir / 'run9_success_pod_runner.py'
          tests = run_dir / 'tests/test_run9_success_pod.py'

          text = runner.read_text(encoding='utf-8')
          old = '''    except urllib.error.HTTPError as exc:\n        try:\n            detail = exc.read().decode("utf-8", errors="replace")\n        except http.client.HTTPException:\n            detail = "<HTTP error body unreadable>"\n'''
          new = '''    except urllib.error.HTTPError as exc:\n        try:\n            detail = exc.read().decode("utf-8", errors="replace")\n        except (http.client.HTTPException, TimeoutError, OSError):\n            detail = "<HTTP error body unreadable>"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'HTTPError body handler replacement count={text.count(old)}')
          runner.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_text = tests.read_text(encoding='utf-8')
          marker = '''def test_request_json_keeps_http_4xx_as_definite_api_failure(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n'''
          regression = '''def test_request_json_classifies_5xx_body_read_timeout_as_ambiguous_post(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    class ErrorBody:\n        def read(self) -> bytes:\n            raise TimeoutError("error body stalled")\n\n        def close(self) -> None:\n            return None\n\n    def server_error(*args: Any, **kwargs: Any) -> Any:\n        raise runner.urllib.error.HTTPError(\n            runner.CREATE_POD_URL,\n            503,\n            "Service Unavailable",\n            hdrs=None,\n            fp=ErrorBody(),\n        )\n\n    monkeypatch.setattr(runner.urllib.request, "urlopen", server_error)\n    with pytest.raises(runner.AmbiguousLaunchError, match="server error 503"):\n        runner._request_json(\n            "POST", runner.CREATE_POD_URL, api_key="not-printed", payload={"x": 1}\n        )\n\n\n'''
          if marker not in test_text:
              raise SystemExit('4xx test marker not found')
          tests.write_text(test_text.replace(marker, regression + marker, 1), encoding='utf-8')
          PY
      - name: Validate round9 fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_runner.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round9_review_fix.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): classify HTTP error body transport failures'
          git push origin HEAD:codex/run9-success-only-prepod
