name: temp-pr340-round8-review-fixes
on:
  push:
    branches: [codex/run9-success-only-prepod]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply round8 fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          runner = run_dir / 'run9_success_pod_runner.py'
          tests = run_dir / 'tests/test_run9_success_pod.py'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              runner,
              'import hashlib\nimport json\n',
              'import hashlib\nimport http.client\nimport json\n',
              'http.client import',
          )

          old_bootstrap = '''trap bootstrap_exit EXIT\nexport DEBIAN_FRONTEND=noninteractive\napt-get update\napt-get install -y --no-install-recommends ca-certificates curl git python3\nrm -rf /root/run9-bootstrap\ngit init /root/run9-bootstrap\ngit -C /root/run9-bootstrap remote add origin https://github.com/Yuu6798/ugh-prompt-engine.git\ngit -C /root/run9-bootstrap fetch --depth 1 origin "$RUN9_PIN_COMMIT"\n'''
          new_bootstrap = '''trap bootstrap_exit EXIT\nreadonly BOOTSTRAP_NETWORK_TIMEOUT_SECONDS=1800\nbootstrap_network() {\n  timeout --foreground --signal=TERM --kill-after=30s \\\n    "$BOOTSTRAP_NETWORK_TIMEOUT_SECONDS" "$@"\n}\nexport DEBIAN_FRONTEND=noninteractive\nbootstrap_network apt-get update\nbootstrap_network apt-get install -y --no-install-recommends ca-certificates curl git python3\nrm -rf /root/run9-bootstrap\ngit init /root/run9-bootstrap\ngit -C /root/run9-bootstrap remote add origin https://github.com/Yuu6798/ugh-prompt-engine.git\nbootstrap_network git -C /root/run9-bootstrap fetch --depth 1 origin "$RUN9_PIN_COMMIT"\n'''
          replace_once(runner, old_bootstrap, new_bootstrap, 'bootstrap network deadline')

          old_http = '''    try:\n        with urllib.request.urlopen(request, timeout=90) as response:\n            raw = response.read()\n    except urllib.error.HTTPError as exc:\n        detail = exc.read().decode("utf-8", errors="replace")\n        if method == "POST" and 500 <= exc.code <= 599:\n            raise AmbiguousLaunchError(\n                f"RunPod {method} server error {exc.code} after request initiation: {detail}"\n            ) from exc\n        raise RuntimeError(f"RunPod API {exc.code}: {detail}") from exc\n    except (urllib.error.URLError, TimeoutError, OSError) as exc:\n        raise AmbiguousLaunchError(\n            f"RunPod {method} transport failed after request initiation: {type(exc).__name__}"\n        ) from exc\n'''
          new_http = '''    try:\n        with urllib.request.urlopen(request, timeout=90) as response:\n            raw = response.read()\n    except urllib.error.HTTPError as exc:\n        try:\n            detail = exc.read().decode("utf-8", errors="replace")\n        except http.client.HTTPException:\n            detail = "<HTTP error body unreadable>"\n        if method == "POST" and 500 <= exc.code <= 599:\n            raise AmbiguousLaunchError(\n                f"RunPod {method} server error {exc.code} after request initiation: {detail}"\n            ) from exc\n        raise RuntimeError(f"RunPod API {exc.code}: {detail}") from exc\n    except http.client.HTTPException as exc:\n        if method == "POST":\n            raise AmbiguousLaunchError(\n                f"RunPod {method} HTTP response failed after request initiation: {type(exc).__name__}"\n            ) from exc\n        raise RuntimeError(\n            f"RunPod {method} HTTP response failed: {type(exc).__name__}"\n        ) from exc\n    except (urllib.error.URLError, TimeoutError, OSError) as exc:\n        raise AmbiguousLaunchError(\n            f"RunPod {method} transport failed after request initiation: {type(exc).__name__}"\n        ) from exc\n'''
          replace_once(runner, old_http, new_http, 'HTTPException ambiguity')

          text = tests.read_text(encoding='utf-8')
          old_bootstrap_assert = '''    assert 'fetch --depth 1 origin "$RUN9_PIN_COMMIT"' in command\n    assert 'actual="$(git -C /root/run9-bootstrap rev-parse HEAD)"' in command\n'''
          new_bootstrap_assert = '''    assert 'readonly BOOTSTRAP_NETWORK_TIMEOUT_SECONDS=1800' in command\n    assert 'timeout --foreground --signal=TERM --kill-after=30s' in command\n    assert 'bootstrap_network apt-get update' in command\n    assert 'bootstrap_network apt-get install -y --no-install-recommends' in command\n    assert 'bootstrap_network git -C /root/run9-bootstrap fetch --depth 1 origin "$RUN9_PIN_COMMIT"' in command\n    assert 'actual="$(git -C /root/run9-bootstrap rev-parse HEAD)"' in command\n'''
          if text.count(old_bootstrap_assert) != 1:
              raise SystemExit(f'bootstrap assertion replacement count={text.count(old_bootstrap_assert)}')
          text = text.replace(old_bootstrap_assert, new_bootstrap_assert, 1)

          marker = '''def test_request_json_classifies_malformed_json_as_ambiguous_post(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n'''
          test_incomplete = '''def test_request_json_classifies_truncated_2xx_body_as_ambiguous_post(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    class Response:\n        def __enter__(self) -> "Response":\n            return self\n\n        def __exit__(self, *args: Any) -> None:\n            return None\n\n        def read(self) -> bytes:\n            raise runner.http.client.IncompleteRead(b'{"id": "partial', 30)\n\n    monkeypatch.setattr(runner.urllib.request, "urlopen", lambda *args, **kwargs: Response())\n    with pytest.raises(runner.AmbiguousLaunchError, match="HTTP response failed.*IncompleteRead"):\n        runner._request_json(\n            "POST", runner.CREATE_POD_URL, api_key="not-printed", payload={"x": 1}\n        )\n\n\n'''
          if marker not in text:
              raise SystemExit('malformed-json test marker not found')
          text = text.replace(marker, test_incomplete + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Validate round8 fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_runner.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round8_review_fixes.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): bound bootstrap network and classify HTTP read failures'
          git push origin HEAD:codex/run9-success-only-prepod
