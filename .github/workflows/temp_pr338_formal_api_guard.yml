name: temp-pr338-formal-api-guard

on:
  push:
    branches:
      - codex/run9-rev07-alternate-attempt
    paths:
      - .github/workflows/temp_pr338_formal_api_guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-rev07-alternate-attempt
          fetch-depth: 0
      - name: Apply formal publisher API guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          executor = Path('voice_genesis/evolution/run9_dual_founder_pjs/birth_probe_executor.py')
          text = executor.read_text(encoding='utf-8')
          old = '''        _validate_staged_evidence_bundle(staging, result, observations, pjs_reference, inventory)\n        os.replace(staging, output_dir)\n'''
          new = '''        _validate_staged_evidence_bundle(staging, result, observations, pjs_reference, inventory)\n        if _FORMAL_REV06_CLI_DISABLED:\n            raise BirthProbeError(\n                "formal RUN9 rev 0.6 evidence publication is disabled after the terminal "\n                "2026-08-28 IMPLEMENTATION_FAILED attempt; use only quarantined "\n                "non-adjudicative diagnostic publication until a separately reviewed "\n                "design revision/reexport/contract refreeze is installed"\n            )\n        os.replace(staging, output_dir)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one formal publisher commit point, found {text.count(old)}')
          executor.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('voice_genesis/evolution/run9_dual_founder_pjs/tests/test_birth_probe_executor.py')
          t = tests.read_text(encoding='utf-8')
          old_name = 'def test_publish_is_atomic_and_refuses_overwrite(tmp_path: Path) -> None:'
          new_name = 'def test_formal_publish_api_is_disabled_after_terminal_attempt(tmp_path: Path) -> None:'
          if t.count(old_name) != 1:
              raise SystemExit(f'expected one legacy formal publish test name, found {t.count(old_name)}')
          t = t.replace(old_name, new_name, 1)
          old_tail = '''    output = tmp_path / "evidence"\n    bp.publish_evidence_bundle(output, result, observations, pjs)\n    assert (output / "birth_gate_evidence.json").is_file()\n    assert (output / "artifact_manifest.json").is_file()\n    with pytest.raises(bp.BirthProbeError, match="refusing to overwrite"):\n        bp.publish_evidence_bundle(output, result, observations, pjs)\n'''
          new_tail = '''    output = tmp_path / "evidence"\n    with pytest.raises(\n        bp.BirthProbeError,\n        match="formal RUN9 rev 0.6 evidence publication is disabled",\n    ):\n        bp.publish_evidence_bundle(output, result, observations, pjs)\n    assert not output.exists()\n    assert list(tmp_path.glob(".evidence.build-*")) == []\n'''
          if t.count(old_tail) != 1:
              raise SystemExit(f'expected one legacy formal publish test tail, found {t.count(old_tail)}')
          tests.write_text(t.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY
          python -m py_compile voice_genesis/evolution/run9_dual_founder_pjs/birth_probe_executor.py
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Yuu6798"
          git config user.email "kkoo6798@gmail.com"
          git rm .github/workflows/temp_pr338_formal_api_guard.yml
          git add voice_genesis/evolution/run9_dual_founder_pjs/birth_probe_executor.py \
                  voice_genesis/evolution/run9_dual_founder_pjs/tests/test_birth_probe_executor.py
          git commit -m "fix(run9): disable terminal formal publisher API"
          git push origin HEAD:codex/run9-rev07-alternate-attempt
