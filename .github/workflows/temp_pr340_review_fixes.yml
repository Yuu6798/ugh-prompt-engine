name: temp-pr340-review-fixes

on:
  push:
    branches:
      - codex/run9-success-only-prepod
    paths:
      - .github/workflows/temp_pr340_review_fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'

      - name: Resolve and freeze complete measurement environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/run9-measure-lock
          PY=/tmp/run9-measure-lock/bin/python
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install 'setuptools==79.0.1' wheel Cython 'numpy==2.4.6'
          "$PY" -m pip install --no-build-isolation \
            'scipy==1.17.1' 'soundfile==0.14.0' 'PyYAML==6.0.1' \
            'onnxruntime==1.29.0' 'pyworld==0.3.5'
          LOCK=voice_genesis/evolution/run9_dual_founder_pjs/inputs/measurement_environment_lock.txt
          "$PY" -m pip freeze --all | LC_ALL=C sort -f > "$LOCK"
          python - "$LOCK" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          rows = [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          required = {
              'numpy': '2.4.6',
              'scipy': '1.17.1',
              'soundfile': '0.14.0',
              'pyyaml': '6.0.1',
              'onnxruntime': '1.29.0',
              'pyworld': '0.3.5',
              'setuptools': '79.0.1',
          }
          parsed = {}
          for row in rows:
              if row.count('==') != 1:
                  raise SystemExit(f'non-exact lock row: {row!r}')
              name, version = row.split('==', 1)
              parsed[name.lower().replace('_', '-')] = version
          for name, version in required.items():
              if parsed.get(name) != version:
                  raise SystemExit(f'required pin mismatch for {name}: {parsed.get(name)!r}')
          for required_build in ('cython', 'wheel', 'pip'):
              if required_build not in parsed:
                  raise SystemExit(f'missing pinned build/install tool: {required_build}')
          print(f'locked {len(rows)} distributions')
          PY

      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          entry = run_dir / 'run9_success_pod_entry.sh'
          runner = run_dir / 'run9_success_pod_runner.py'
          admission = run_dir / 'run9_success_admission.py'
          pod_tests = run_dir / 'tests/test_run9_success_pod.py'
          admission_tests = run_dir / 'tests/test_success_only_admission.py'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # P1: watchdog must reuse the already-confirmed five-attempt self_stop path.
          replace_once(
              entry,
              '''  if [ -n "${RUNPOD_POD_ID:-}" ]; then\n    runpodctl stop pod "$RUNPOD_POD_ID" || true\n  fi\n''',
              '''  self_stop || true\n''',
              'watchdog stop retry',
          )

          # P1: install the committed full closure, including pinned build tools for pyworld,
          # with no dependency resolution at Pod launch. Then verify exact pip freeze.
          old_measure = '''stage "measurement-environment"\nreadonly VENV_RENDER="$WORK/venv_render"\n"$PY" -m venv --clear "$VENV_RENDER"\n"$VENV_RENDER/bin/pip" install --no-cache-dir \\\n  numpy==2.4.6 scipy==1.17.1 soundfile==0.14.0 PyYAML==6.0.1 \\\n  onnxruntime==1.29.0 pyworld==0.3.5 setuptools==79.0.1\n"$VENV_RENDER/bin/python" - <<'PY'\nimport importlib.metadata as md, platform\nexpected = {\n    "PyYAML": "6.0.1",\n    "numpy": "2.4.6",\n    "onnxruntime": "1.29.0",\n    "pyworld": "0.3.5",\n    "scipy": "1.17.1",\n    "setuptools": "79.0.1",\n    "soundfile": "0.14.0",\n}\nactual = {name: md.version(name) for name in expected}\nassert actual == expected, (actual, expected)\nassert platform.python_version() == "3.11.15", platform.python_version()\nPY\n"$VENV_RENDER/bin/python" -m pip freeze --all > "$WORK/measurement_environment.freeze"\n'''
          new_measure = '''stage "measurement-environment"\nreadonly VENV_RENDER="$WORK/venv_render"\nreadonly MEASUREMENT_LOCK="$RUN_DIR/inputs/measurement_environment_lock.txt"\n[ -s "$MEASUREMENT_LOCK" ] || die "committed measurement environment lock is missing"\n"$PY" -m venv --clear "$VENV_RENDER"\nPIP_PIN="$(grep -Ei '^pip==' "$MEASUREMENT_LOCK")"\n[ -n "$PIP_PIN" ] || die "measurement lock does not pin pip"\n"$VENV_RENDER/bin/python" -m pip install --no-cache-dir --upgrade "$PIP_PIN"\nfor build_package in setuptools wheel Cython numpy; do\n  build_pin="$(grep -Ei "^${build_package}==" "$MEASUREMENT_LOCK")"\n  [ -n "$build_pin" ] || die "measurement lock does not pin $build_package"\n  "$VENV_RENDER/bin/python" -m pip install --no-cache-dir --no-deps "$build_pin"\ndone\ngrep -Evi '^pip==' "$MEASUREMENT_LOCK" > "$WORK/measurement_environment.install.lock"\n"$VENV_RENDER/bin/python" -m pip install --no-cache-dir --no-deps --no-build-isolation \\\n  -r "$WORK/measurement_environment.install.lock"\n"$VENV_RENDER/bin/python" - "$MEASUREMENT_LOCK" <<'PY'\nimport pathlib, platform, subprocess, sys\nlock_path = pathlib.Path(sys.argv[1])\nexpected = sorted(\n    line.strip()\n    for line in lock_path.read_text(encoding="utf-8").splitlines()\n    if line.strip()\n)\nactual = sorted(\n    line.strip()\n    for line in subprocess.run(\n        [sys.executable, "-m", "pip", "freeze", "--all"],\n        check=True,\n        capture_output=True,\n        text=True,\n    ).stdout.splitlines()\n    if line.strip()\n)\nif actual != expected:\n    raise SystemExit(\n        f"measurement closure mismatch extra={sorted(set(actual)-set(expected))} "\n        f"missing={sorted(set(expected)-set(actual))}"\n    )\nif platform.python_version() != "3.11.15":\n    raise SystemExit(f"compiled Python version drift: {platform.python_version()}")\nPY\n"$VENV_RENDER/bin/python" -m pip freeze --all > "$WORK/measurement_environment.freeze"\n'''
          replace_once(entry, old_measure, new_measure, 'measurement closure install')

          # P1: bootstrap failure stop path gets the same five attempts/30s retry behavior.
          old_bootstrap = '''bootstrap_exit() {\n  ec=$?\n  if [ "$ec" -ne 0 ] && [ -n "${RUNPOD_POD_ID:-}" ]; then\n    runpodctl stop pod "$RUNPOD_POD_ID" 2>/dev/null || true\n  fi\n  exit "$ec"\n}\n'''
          new_bootstrap = '''bootstrap_self_stop() {\n  if [ -z "${RUNPOD_POD_ID:-}" ]; then\n    echo "run9 bootstrap: RUNPOD_POD_ID unset; self-stop skipped" >&2\n    return 0\n  fi\n  local attempt\n  for attempt in 1 2 3 4 5; do\n    if runpodctl stop pod "$RUNPOD_POD_ID"; then\n      return 0\n    fi\n    echo "run9 bootstrap: self-stop attempt=$attempt failed" >&2\n    [ "$attempt" -lt 5 ] && sleep 30\n  done\n  echo "run9 bootstrap: SELF-STOP FAILED after 5 attempts; pod may still be billing: $RUNPOD_POD_ID" >&2\n  return 1\n}\nbootstrap_exit() {\n  ec=$?\n  if [ "$ec" -ne 0 ]; then\n    bootstrap_self_stop || true\n  fi\n  exit "$ec"\n}\n'''
          replace_once(runner, old_bootstrap, new_bootstrap, 'bootstrap stop retry')

          # P1: a successful HTTP response without a pod handle is operational failure.
          marker = '''def _print_json(value: object) -> None:\n    json.dump(value, sys.stdout, ensure_ascii=False, indent=2, sort_keys=True)\n    sys.stdout.write("\\n")\n\n\n'''
          insert = '''def _extract_pod_id(response: Mapping[str, Any]) -> str | None:\n    """Return a non-empty RunPod identifier from known REST response keys."""\n    value = response.get("id") or response.get("podId")\n    return value if isinstance(value, str) and value else None\n\n\n'''
          replace_once(runner, marker, marker + insert, 'pod id helper')
          old_launch = '''    _print_json(\n        {\n            "schema": "run9-success-pod-launch/1.0",\n            "source_commit": report["source_commit"],\n            "payload_sha256": report["payload_sha256"],\n            "pod": response,\n        }\n    )\n    return 0\n'''
          new_launch = '''    pod_id = _extract_pod_id(response)\n    launch_record = {\n        "schema": "run9-success-pod-launch/1.0",\n        "source_commit": report["source_commit"],\n        "payload_sha256": report["payload_sha256"],\n        "pod_id": pod_id,\n        "pod": response,\n    }\n    _print_json(launch_record)\n    if pod_id is None:\n        raise RuntimeError(\n            "RunPod POST /pods succeeded but returned no id/podId; a billable Pod may "\n            "exist without a recorded stop handle — reconcile in the RunPod console immediately"\n        )\n    return 0\n'''
          replace_once(runner, old_launch, new_launch, 'launch pod id required')

          # Bind the complete lock bytes to repo provenance and verify the complete installed closure.
          const_marker = '''_POLICY_PATH = _THIS_DIR / "inputs" / "success_only_admission_policy.json"\n'''
          replace_once(
              admission,
              const_marker,
              const_marker + '''_MEASUREMENT_LOCK_PATH = _THIS_DIR / "inputs" / "measurement_environment_lock.txt"\n''',
              'measurement lock constant',
          )
          repo_marker = '''        "success_only_admission_policy_sha256": _POLICY_PATH,\n'''
          replace_once(
              admission,
              repo_marker,
              repo_marker + '''        "measurement_environment_lock_sha256": _MEASUREMENT_LOCK_PATH,\n''',
              'measurement lock provenance',
          )
          old_return = '''    setuptools_version = importlib_metadata.version("setuptools")\n    if setuptools_version != packages["setuptools"]:\n        raise bp.BirthProbeError(\n            "setuptools version mismatch: "\n            f"expected {packages['setuptools']!r}, got {setuptools_version!r}"\n        )\n    return {**observed, "setuptools": setuptools_version}\n'''
          new_return = '''    setuptools_version = importlib_metadata.version("setuptools")\n    if setuptools_version != packages["setuptools"]:\n        raise bp.BirthProbeError(\n            "setuptools version mismatch: "\n            f"expected {packages['setuptools']!r}, got {setuptools_version!r}"\n        )\n    try:\n        expected_freeze = sorted(\n            line.strip()\n            for line in _MEASUREMENT_LOCK_PATH.read_text(encoding="utf-8").splitlines()\n            if line.strip()\n        )\n        actual_freeze = sorted(\n            line.strip()\n            for line in subprocess.run(\n                [sys.executable, "-m", "pip", "freeze", "--all"],\n                check=True,\n                capture_output=True,\n                text=True,\n            ).stdout.splitlines()\n            if line.strip()\n        )\n    except (OSError, subprocess.CalledProcessError) as exc:\n        raise bp.BirthProbeError("measurement dependency closure could not be verified") from exc\n    if actual_freeze != expected_freeze:\n        raise bp.BirthProbeError(\n            "measurement dependency closure mismatch: "\n            f"extra={sorted(set(actual_freeze)-set(expected_freeze))!r}, "\n            f"missing={sorted(set(expected_freeze)-set(actual_freeze))!r}"\n        )\n    closure = {}\n    for row in expected_freeze:\n        if row.count("==") != 1:\n            raise bp.BirthProbeError(f"measurement lock row is not an exact pin: {row!r}")\n        name, version = row.split("==", 1)\n        closure[name] = version\n    return {"python": observed["python"], **closure}\n'''
          replace_once(admission, old_return, new_return, 'full closure verification')

          # Regression tests for all four review findings.
          bootstrap_assert = '''    assert 'runpodctl stop pod "$RUNPOD_POD_ID"' in command\n    assert "run9_success_pod_entry.sh" in command\n'''
          bootstrap_new = '''    assert 'runpodctl stop pod "$RUNPOD_POD_ID"' in command\n    assert "for attempt in 1 2 3 4 5" in command\n    assert 'sleep 30' in command\n    assert "SELF-STOP FAILED after 5 attempts" in command\n    assert "run9_success_pod_entry.sh" in command\n'''
          replace_once(pod_tests, bootstrap_assert, bootstrap_new, 'bootstrap retry regression')

          entry_test_marker = '''def test_entry_enables_watchdog_before_the_first_download() -> None:\n'''
          entry_tests = '''def test_entry_watchdog_reuses_confirmed_retrying_self_stop() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    watchdog = text[text.index('(\\n  sleep "$WALL_CLOCK_SECONDS"'): text.index('WATCHDOG_PID=$!')]\n    assert "self_stop || true" in watchdog\n    assert 'runpodctl stop pod "$RUNPOD_POD_ID" || true' not in watchdog\n    assert "for attempt in 1 2 3 4 5" in text\n\n\ndef test_entry_measurement_environment_uses_committed_full_lock() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    measurement = text[text.index('stage "measurement-environment"'): text.index('stage "render-network-isolation"')]\n    assert 'measurement_environment_lock.txt' in measurement\n    assert '--no-deps --no-build-isolation' in measurement\n    assert 'pip", "freeze", "--all"' in measurement\n    lock = RUN_DIR / "inputs" / "measurement_environment_lock.txt"\n    rows = [line for line in lock.read_text(encoding="utf-8").splitlines() if line]\n    assert len(rows) > 7\n    assert all(row.count("==") == 1 for row in rows)\n\n\n'''
          replace_once(pod_tests, entry_test_marker, entry_tests + entry_test_marker, 'entry review regressions')

          launch_marker = '''def test_preflight_rejects_dirty_tree_before_remote_check(\n'''
          launch_test = '''def test_launch_rejects_success_response_without_pod_id(\n    monkeypatch: pytest.MonkeyPatch,\n    capsys: pytest.CaptureFixture[str],\n) -> None:\n    payload = runner.build_launch_payload(COMMIT)\n    monkeypatch.setenv("RUNPOD_API_KEY", "not-printed")\n    monkeypatch.setattr(\n        runner,\n        "verify_prelaunch",\n        lambda: {\n            "source_commit": COMMIT,\n            "payload_sha256": "b" * 64,\n            "payload": payload,\n        },\n    )\n    monkeypatch.setattr(runner, "_request_json", lambda *args, **kwargs: {"status": "created"})\n    assert runner.main(["launch", "--confirm-launch", runner.CONFIRMATION]) == 2\n    captured = capsys.readouterr()\n    assert '"pod_id": null' in captured.out\n    assert "billable Pod may exist" in captured.err\n\n\n'''
          replace_once(pod_tests, launch_marker, launch_test + launch_marker, 'missing pod id regression')

          policy_test_marker = '''def test_production_cli_has_no_network_isolation_bypass() -> None:\n'''
          closure_test = '''def test_measurement_lock_is_bound_into_repo_provenance() -> None:\n    snapshot = admission._snapshot_repo_inputs()  # noqa: SLF001\n    assert "measurement_environment_lock_sha256" in snapshot\n    lock_bytes = admission._MEASUREMENT_LOCK_PATH.read_bytes()  # noqa: SLF001\n    assert snapshot["measurement_environment_lock_sha256"] == admission._sha256_bytes(lock_bytes)  # noqa: SLF001\n\n\n'''
          replace_once(admission_tests, policy_test_marker, closure_test + policy_test_marker, 'lock provenance regression')
          PY

          python -m py_compile \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_runner.py \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_admission.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check

      - name: Run focused tests
        run: |
          python -m pip install -q pytest numpy pyyaml
          python -m pytest -q \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Yuu6798"
          git config user.email "kkoo6798@gmail.com"
          git rm .github/workflows/temp_pr340_review_fixes.yml
          git add \
            voice_genesis/evolution/run9_dual_founder_pjs/inputs/measurement_environment_lock.txt \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_runner.py \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_admission.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py
          git commit -m "fix(run9): close success pod review safety gaps"
          git push origin HEAD:codex/run9-success-only-prepod
