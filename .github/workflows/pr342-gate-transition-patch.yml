name: PR342 gate transition patch

on:
  push:
    branches:
      - "claude/design-based-implementation-653xpl"
    paths:
      - ".github/workflows/pr342-gate-transition-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/design-based-implementation-653xpl"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply bounded fixes
        run: python .github/pr342_gate_transition_patch.py

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Targeted regressions
        run: pytest -q --tb=short voice_genesis/calibration/tests/test_gates.py voice_genesis/calibration/tests/test_adapters.py

      - name: Lint changed calibration files
        run: ruff check voice_genesis/calibration/gates.py voice_genesis/calibration/candidates/impl/transition.py voice_genesis/calibration/tests/test_gates.py voice_genesis/calibration/tests/test_adapters.py

      - name: Commit bounded fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/calibration/gates.py voice_genesis/calibration/candidates/impl/transition.py voice_genesis/calibration/tests/test_gates.py voice_genesis/calibration/tests/test_adapters.py
          git diff --cached --check
          git commit -m "fix(calibration): reject invalid gate budgets and derive directional sign"
          git push origin HEAD:claude/design-based-implementation-653xpl
