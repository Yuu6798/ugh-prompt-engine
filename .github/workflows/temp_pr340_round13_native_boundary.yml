name: temp-pr340-round13-native-boundary
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/codex/run9-success-only-prepod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply native boundary fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          lock = run_dir / 'inputs/measurement_native_install_lock.txt'
          admission_tests = run_dir / 'tests/test_success_only_admission.py'
          pod_tests = run_dir / 'tests/test_run9_success_pod.py'

          keep = {
              'binutils-common', 'binutils-x86-64-linux-gnu', 'binutils',
              'cpp-13-x86-64-linux-gnu', 'cpp-13', 'cpp-x86-64-linux-gnu', 'cpp',
              'g++-13-x86-64-linux-gnu', 'g++-13', 'g++-x86-64-linux-gnu', 'g++',
              'gcc-13-base', 'gcc-13-x86-64-linux-gnu', 'gcc-13', 'gcc-14-base',
              'gcc-x86-64-linux-gnu', 'gcc',
              'libasan8', 'libatomic1', 'libbinutils', 'libcc1-0',
              'libctf-nobfd0', 'libctf0', 'libffi-dev', 'libffi8',
              'libflac12t64', 'libgcc-13-dev', 'libgcc-s1', 'libgmp10',
              'libgomp1', 'libgprofng0', 'libhwasan0', 'libisl23', 'libitm1',
              'libjansson4', 'liblsan0', 'libmp3lame0', 'libmpc3', 'libmpfr6',
              'libmpg123-0t64', 'libogg0', 'libopus0', 'libquadmath0',
              'libsframe1', 'libsndfile1', 'libstdc++-13-dev', 'libstdc++6',
              'libtsan2', 'libubsan1', 'libvorbis0a', 'libvorbisenc2',
              'libzstd1', 'make', 'zlib1g',
          }
          rows = [line.strip() for line in lock.read_text(encoding='utf-8').splitlines() if line.strip()]
          selected = [
              row for row in rows
              if row.rpartition('=')[0].split(':', 1)[0] in keep
          ]
          names = {row.rpartition('=')[0].split(':', 1)[0] for row in selected}
          if names != keep:
              raise SystemExit(f'implementation lock mismatch: missing={sorted(keep-names)!r} extra={sorted(names-keep)!r}')
          lock.write_text('\n'.join(selected) + '\n', encoding='utf-8')

          text = admission_tests.read_text(encoding='utf-8')
          marker = '''def test_native_runtime_validator_queries_only_committed_closure(\n'''
          added = '''def test_native_measurement_lock_excludes_os_base_packages() -> None:\n    rows = [\n        line.strip()\n        for line in admission._MEASUREMENT_NATIVE_INSTALL_LOCK_PATH.read_text(encoding="utf-8").splitlines()\n        if line.strip()\n    ]  # noqa: SLF001\n    names = {row.rpartition("=")[0].split(":", 1)[0] for row in rows}\n    forbidden = {\n        "build-essential",\n        "dpkg", "dpkg-dev", "libdpkg-perl",\n        "libc-bin", "libc-dev-bin", "libc6", "libc6-dev",\n        "linux-libc-dev",\n        "perl-base", "perl-modules-5.38", "libperl5.38t64",\n    }\n    required = {"gcc", "g++", "make", "binutils", "libffi-dev", "libsndfile1"}\n    assert names.isdisjoint(forbidden)\n    assert required <= names\n\n\n'''
          if marker not in text:
              raise SystemExit('native validator marker missing')
          admission_tests.write_text(text.replace(marker, added + marker, 1), encoding='utf-8')

          text = pod_tests.read_text(encoding='utf-8')
          old_expectation = '    assert any(row.startswith("libc6:") for row in rows)\n'
          new_expectation = '    assert not any(row.startswith("libc6:") for row in rows)\n'
          if text.count(old_expectation) != 1:
              raise SystemExit(f'legacy libc expectation count={text.count(old_expectation)}')
          text = text.replace(old_expectation, new_expectation, 1)
          marker = '''def test_entry_native_preflight_reads_existing_verified_bootstrap_checkout() -> None:\n'''
          added = '''def test_native_lock_keeps_os_base_outside_exact_install_boundary() -> None:\n    names = {\n        row.rpartition("=")[0].split(":", 1)[0]\n        for row in (RUN_DIR / "inputs" / "measurement_native_install_lock.txt").read_text(encoding="utf-8").splitlines()\n        if row.strip()\n    }\n    assert "libc6" not in names\n    assert "libc6-dev" not in names\n    assert "linux-libc-dev" not in names\n    assert "dpkg" not in names\n    assert "perl-base" not in names\n    assert {"gcc", "g++", "make", "binutils", "libffi-dev", "libsndfile1"} <= names\n\n\n'''
          if marker not in text:
              raise SystemExit('pod native marker missing')
          pod_tests.write_text(text.replace(marker, added + marker, 1), encoding='utf-8')
          PY
      - name: Validate native exact-install boundary
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='runpod/base:1.1.0-ubuntu2404@sha256:6a7ffc191ddee44bcede7b8508a76f67df690df7d58043edd6695ef63bffef23'
          docker pull "$IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$IMAGE" bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends zlib1g-dev libssl-dev
            mapfile -t rows < /repo/voice_genesis/evolution/run9_dual_founder_pjs/inputs/measurement_native_install_lock.txt
            apt-get install -y -qq --no-install-recommends --allow-downgrades "${rows[@]}"
            for row in "${rows[@]}"; do
              name="${row%=*}"
              actual="$(dpkg-query -W -f="\${binary:Package}=\${Version}" "$name")"
              [ "$actual" = "$row" ] || { echo "native mismatch: $name $actual != $row" >&2; exit 1; }
            done
          '
      - name: Validate focused regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_admission.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round13_native_boundary.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): exclude OS base from native measurement lock'
          git push origin HEAD:codex/run9-success-only-prepod
