name: temp-pr340-round6-review-fixes
on:
  push:
    branches: [codex/run9-success-only-prepod]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Derive consumed native closure
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='runpod/base:1.1.0-ubuntu2404@sha256:6a7ffc191ddee44bcede7b8508a76f67df690df7d58043edd6695ef63bffef23'
          RUN_DIR='voice_genesis/evolution/run9_dual_founder_pjs'
          docker pull "$IMAGE"
          cat > /tmp/derive_native.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          ROOTS=(
            build-essential libbz2-dev libffi-dev liblzma-dev libreadline-dev
            libsqlite3-dev libssl-dev libsndfile1 tk-dev zlib1g-dev
          )
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git iptables unzip xz-utils python3
          apt-get install -y -qq --no-install-recommends "${ROOTS[@]}"
          python3 - /repo/voice_genesis/evolution/run9_dual_founder_pjs/inputs/measurement_native_install_lock.txt "${ROOTS[@]}" <<'PY'
          import re, subprocess, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          roots = sys.argv[2:]
          cmd = [
              'apt-cache', 'depends', '--recurse', '--no-recommends', '--no-suggests',
              '--no-conflicts', '--no-breaks', '--no-replaces', '--no-enhances', *roots,
          ]
          text = subprocess.run(cmd, check=True, capture_output=True, text=True).stdout
          names = set(roots)
          pat = re.compile(r'^\s*(?:PreDepends|Depends):\s+([^\s]+)\s*$')
          for line in text.splitlines():
              match = pat.match(line)
              if not match:
                  continue
              name = match.group(1)
              if name.startswith('<') or name.endswith('>'):
                  continue
              names.add(name)
          rows = set()
          for name in sorted(names):
              completed = subprocess.run(
                  ['dpkg-query', '-W', '-f=${binary:Package}=${Version}\n', name],
                  capture_output=True, text=True,
              )
              if completed.returncode != 0:
                  continue
              for row in completed.stdout.splitlines():
                  row = row.strip()
                  if row and '=' in row:
                      rows.add(row)
          required_prefixes = ('libc6:', 'libgcc-s1:', 'libstdc++6:', 'libsndfile1:')
          missing = [prefix for prefix in required_prefixes if not any(row.startswith(prefix) for row in rows)]
          if missing:
              raise SystemExit(f'consumed native closure missing required runtime providers: {missing!r}')
          if not any(row.startswith('gcc') for row in rows):
              raise SystemExit('consumed native closure missing compiler toolchain')
          out.write_text('\n'.join(sorted(rows)) + '\n', encoding='utf-8')
          print(f'consumed native closure={len(rows)} packages')
          PY
          SH
          chmod +x /tmp/derive_native.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$IMAGE" bash /tmp/derive_native.sh
          rm -f "$RUN_DIR/inputs/measurement_native_manifest.txt"
          test -s "$RUN_DIR/inputs/measurement_native_install_lock.txt"
      - name: Apply review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          entry = run_dir / 'run9_success_pod_entry.sh'
          admission = run_dir / 'run9_success_admission.py'
          pod_tests = run_dir / 'tests/test_run9_success_pod.py'
          admission_tests = run_dir / 'tests/test_success_only_admission.py'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Wall-clock state and main-shell identity.
          marker = 'readonly WALL_CLOCK_SECONDS=21600\n'
          replace_once(
              entry,
              marker,
              marker + 'readonly STOP_BUDGET_SECONDS=180\nreadonly START_EPOCH="$(date +%s)"\nreadonly MAIN_SHELL_PID="$$"\n',
              'wall clock state',
          )

          # Terminate all main-shell work before opening outbound network at the deadline.
          force_marker = '''force_restore_network_for_stop() {\n  # The watchdog subshell was forked before FIREWALL_ACTIVE changes, so it must\n  # not rely on that shell-local flag when recovering connectivity for runpodctl.\n  iptables -P OUTPUT ACCEPT 2>/dev/null || true\n  iptables -F OUTPUT 2>/dev/null || true\n  FIREWALL_ACTIVE="false"\n}\n\n'''
          deadline_helper = '''terminate_main_for_deadline() {\n  # Stop the main workload before opening outbound connectivity for RunPod stop.\n  # /proc avoids adding a procps dependency.  BASHPID identifies this watchdog\n  # subshell so it is not killed with the main shell's other children.\n  local child\n  for child in $(cat "/proc/${MAIN_SHELL_PID}/task/${MAIN_SHELL_PID}/children" 2>/dev/null || true); do\n    [ "$child" = "$BASHPID" ] && continue\n    kill -TERM "$child" 2>/dev/null || true\n  done\n  kill -TERM "$MAIN_SHELL_PID" 2>/dev/null || true\n}\n\n'''
          replace_once(entry, force_marker, force_marker + deadline_helper, 'deadline termination helper')

          # Keep watchdog alive during hold, cap hold with stop budget, and only cancel it after confirmed stop.
          old_exit = '''on_exit() {\n  local ec=$?\n  set +e\n  [ -n "${WATCHDOG_PID:-}" ] && kill "$WATCHDOG_PID" 2>/dev/null || true\n  [ -n "${HEARTBEAT_PID:-}" ] && kill "$HEARTBEAT_PID" 2>/dev/null || true\n  restore_network\n  local state="failed"\n  [ "$ec" -eq 0 ] && state="success"\n  python3 - "$STATUS_FILE" "$state" "$STAGE" "$DETAIL" <<'PY'\nimport json, sys\npath, status, stage, detail = sys.argv[1:]\nwith open(path, "w", encoding="utf-8") as stream:\n    json.dump(\n        {\n            "schema": "run9-pod-operational-status/1.0",\n            "status": status,\n            "stage": stage,\n            "detail": detail,\n            "registration_created": status == "success",\n        },\n        stream,\n        ensure_ascii=False,\n        sort_keys=True,\n    )\n    stream.write("\\n")\nPY\n  if [ -f /workspace/run9_console.log ]; then\n    cp -f /workspace/run9_console.log "$PUBLIC/run9_console.log" 2>/dev/null || true\n  fi\n  local hold=900\n  [ "$state" = "success" ] && hold=2700\n  echo "| run9: holding result endpoint for ${hold}s"\n  sleep "$hold"\n  [ -n "${SERVER_PID:-}" ] && kill "$SERVER_PID" 2>/dev/null || true\n  self_stop || true\n  exit "$ec"\n}\n'''
          new_exit = '''on_exit() {\n  local ec=$?\n  set +e\n  [ -n "${HEARTBEAT_PID:-}" ] && kill "$HEARTBEAT_PID" 2>/dev/null || true\n  restore_network\n  local state="failed"\n  [ "$ec" -eq 0 ] && state="success"\n  python3 - "$STATUS_FILE" "$state" "$STAGE" "$DETAIL" <<'PY'\nimport json, sys\npath, status, stage, detail = sys.argv[1:]\nwith open(path, "w", encoding="utf-8") as stream:\n    json.dump(\n        {\n            "schema": "run9-pod-operational-status/1.0",\n            "status": status,\n            "stage": stage,\n            "detail": detail,\n            "registration_created": status == "success",\n        },\n        stream,\n        ensure_ascii=False,\n        sort_keys=True,\n    )\n    stream.write("\\n")\nPY\n  if [ -f /workspace/run9_console.log ]; then\n    cp -f /workspace/run9_console.log "$PUBLIC/run9_console.log" 2>/dev/null || true\n  fi\n  local requested_hold=900 now remaining max_hold hold\n  [ "$state" = "success" ] && requested_hold=2700\n  now="$(date +%s)"\n  remaining=$(( START_EPOCH + WALL_CLOCK_SECONDS - now ))\n  max_hold=$(( remaining - STOP_BUDGET_SECONDS ))\n  [ "$max_hold" -lt 0 ] && max_hold=0\n  hold="$requested_hold"\n  [ "$hold" -gt "$max_hold" ] && hold="$max_hold"\n  echo "| run9: holding result endpoint for ${hold}s (requested=${requested_hold}s, wall-clock capped)"\n  sleep "$hold"\n  [ -n "${SERVER_PID:-}" ] && kill "$SERVER_PID" 2>/dev/null || true\n  if self_stop; then\n    [ -n "${WATCHDOG_PID:-}" ] && kill "$WATCHDOG_PID" 2>/dev/null || true\n  else\n    echo "| run9: exit self-stop failed; keeping watchdog alive until wall-clock deadline" >&2\n    [ -n "${WATCHDOG_PID:-}" ] && wait "$WATCHDOG_PID" || true\n  fi\n  exit "$ec"\n}\n'''
          replace_once(entry, old_exit, new_exit, 'hold/watchdog lifecycle')

          old_watchdog = '''(\n  sleep "$WALL_CLOCK_SECONDS"\n  echo "| run9: watchdog reached ${WALL_CLOCK_SECONDS}s; forcing stop" >&2\n  force_restore_network_for_stop\n  self_stop || true\n) &\n'''
          new_watchdog = '''(\n  sleep "$WALL_CLOCK_SECONDS"\n  echo "| run9: watchdog reached ${WALL_CLOCK_SECONDS}s; terminating workload before stop" >&2\n  terminate_main_for_deadline\n  force_restore_network_for_stop\n  self_stop || true\n) &\n'''
          replace_once(entry, old_watchdog, new_watchdog, 'deadline ordering')

          # Verify only exact measurement-native closure, not the full OS package set.
          old_native = '''stage "preflight-system"\nBOOTSTRAP_HEAD="$(git -C "$BOOTSTRAP_RUN_DIR" rev-parse HEAD 2>/dev/null || true)"\n[ "$BOOTSTRAP_HEAD" = "$RUN9_PIN_COMMIT" ] \\\n  || die "bootstrap checkout does not match RUN9_PIN_COMMIT before native preflight"\nreadonly NATIVE_INSTALL_LOCK="$BOOTSTRAP_RUN_DIR/inputs/measurement_native_install_lock.txt"\nreadonly NATIVE_MANIFEST="$BOOTSTRAP_RUN_DIR/inputs/measurement_native_manifest.txt"\n[ -s "$NATIVE_INSTALL_LOCK" ] || die "committed native install lock is missing from bootstrap checkout"\n[ -s "$NATIVE_MANIFEST" ] || die "committed native manifest is missing from bootstrap checkout"\nmapfile -t NATIVE_PACKAGES < "$NATIVE_INSTALL_LOCK"\n[ "${#NATIVE_PACKAGES[@]}" -gt 0 ] || die "native install lock is empty"\napt-get update -qq\nDEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \\\n  --allow-downgrades "${NATIVE_PACKAGES[@]}"\ndpkg-query -W -f='${binary:Package}=${Version}\\n' | LC_ALL=C sort \\\n  > "$WORK/measurement_native_environment.actual"\nif ! cmp -s "$NATIVE_MANIFEST" "$WORK/measurement_native_environment.actual"; then\n  diff -u "$NATIVE_MANIFEST" "$WORK/measurement_native_environment.actual" >&2 || true\n  die "native measurement environment does not match committed manifest"\nfi\n'''
          new_native = '''stage "preflight-system"\nBOOTSTRAP_HEAD="$(git -C "$BOOTSTRAP_RUN_DIR" rev-parse HEAD 2>/dev/null || true)"\n[ "$BOOTSTRAP_HEAD" = "$RUN9_PIN_COMMIT" ] \\\n  || die "bootstrap checkout does not match RUN9_PIN_COMMIT before native preflight"\nreadonly NATIVE_INSTALL_LOCK="$BOOTSTRAP_RUN_DIR/inputs/measurement_native_install_lock.txt"\n[ -s "$NATIVE_INSTALL_LOCK" ] || die "committed native measurement closure is missing from bootstrap checkout"\nmapfile -t NATIVE_PACKAGES < "$NATIVE_INSTALL_LOCK"\n[ "${#NATIVE_PACKAGES[@]}" -gt 0 ] || die "native measurement closure is empty"\napt-get update -qq\nDEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \\\n  ca-certificates curl git iptables unzip xz-utils\nDEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \\\n  --allow-downgrades "${NATIVE_PACKAGES[@]}"\npython3 - "$NATIVE_INSTALL_LOCK" "$WORK/measurement_native_environment.actual" <<'PY'\nimport pathlib, subprocess, sys\nlock, out = map(pathlib.Path, sys.argv[1:])\nrows = sorted(line.strip() for line in lock.read_text(encoding="utf-8").splitlines() if line.strip())\nnames = []\nfor row in rows:\n    name, sep, version = row.rpartition("=")\n    if not sep or not name or not version:\n        raise SystemExit(f"invalid native closure row: {row!r}")\n    names.append(name)\ncompleted = subprocess.run(\n    ["dpkg-query", "-W", "-f=${binary:Package}=${Version}\\n", *names],\n    check=True, capture_output=True, text=True,\n)\nactual = sorted(line.strip() for line in completed.stdout.splitlines() if line.strip())\nout.write_text("\\n".join(actual) + "\\n", encoding="utf-8")\nPY\nif ! cmp -s "$NATIVE_INSTALL_LOCK" "$WORK/measurement_native_environment.actual"; then\n  diff -u "$NATIVE_INSTALL_LOCK" "$WORK/measurement_native_environment.actual" >&2 || true\n  die "consumed native measurement closure does not match committed lock"\nfi\n'''
          replace_once(entry, old_native, new_native, 'consumed native closure entry')

          # Admission: remove full-OS manifest and verify only selected native package names.
          replace_once(
              admission,
              '''_MEASUREMENT_NATIVE_MANIFEST_PATH = (\n    _THIS_DIR / "inputs" / "measurement_native_manifest.txt"\n)\n''',
              '',
              'remove native full manifest constant',
          )
          replace_once(
              admission,
              '''        "measurement_native_install_lock_sha256": _MEASUREMENT_NATIVE_INSTALL_LOCK_PATH,\n        "measurement_native_manifest_sha256": _MEASUREMENT_NATIVE_MANIFEST_PATH,\n''',
              '''        "measurement_native_install_lock_sha256": _MEASUREMENT_NATIVE_INSTALL_LOCK_PATH,\n''',
              'remove full manifest provenance',
          )
          start = admission.read_text(encoding='utf-8')
          a = start.index('def _validate_native_runtime() -> Dict[str, Any]:\n')
          b = start.index('\ndef _validate_runtime(policy: Mapping[str, Any]) -> Dict[str, str]:\n', a)
          validator = '''def _validate_native_runtime() -> Dict[str, Any]:\n    """Fail closed on the exact native libraries/build inputs consumed by measurement."""\n    try:\n        lock_bytes = _MEASUREMENT_NATIVE_INSTALL_LOCK_PATH.read_bytes()\n        expected_rows = sorted(\n            line.strip()\n            for line in lock_bytes.decode("utf-8").splitlines()\n            if line.strip()\n        )\n        names = []\n        for row in expected_rows:\n            name, sep, version = row.rpartition("=")\n            if not sep or not name or not version:\n                raise bp.BirthProbeError(f"native measurement closure row is invalid: {row!r}")\n            names.append(name)\n        actual_rows = sorted(\n            line.strip()\n            for line in subprocess.run(\n                ["dpkg-query", "-W", "-f=${binary:Package}=${Version}\\n", *names],\n                check=True,\n                capture_output=True,\n                text=True,\n            ).stdout.splitlines()\n            if line.strip()\n        )\n    except (OSError, UnicodeDecodeError, subprocess.CalledProcessError) as exc:\n        raise bp.BirthProbeError("native measurement dependency closure could not be verified") from exc\n    if not expected_rows:\n        raise bp.BirthProbeError("native measurement dependency closure is empty")\n    if actual_rows != expected_rows:\n        raise bp.BirthProbeError(\n            "native measurement dependency closure mismatch: "\n            f"extra={sorted(set(actual_rows)-set(expected_rows))!r}, "\n            f"missing={sorted(set(expected_rows)-set(actual_rows))!r}"\n        )\n    return {\n        "closure_sha256": _sha256_bytes(lock_bytes),\n        "package_count": len(expected_rows),\n    }\n\n'''
          admission.write_text(start[:a] + validator + start[b+1:], encoding='utf-8')

          # Pod regression tests.
          text = pod_tests.read_text(encoding='utf-8')
          text = text.replace(
              '''    assert watchdog.index("force_restore_network_for_stop") < watchdog.index("self_stop || true")\n''',
              '''    assert watchdog.index("terminate_main_for_deadline") < watchdog.index("force_restore_network_for_stop")\n    assert watchdog.index("force_restore_network_for_stop") < watchdog.index("self_stop || true")\n''',
              1,
          )
          native_start = text.index('def test_entry_uses_committed_exact_native_closure() -> None:\n')
          native_end = text.index('\ndef test_entry_enables_watchdog_before_the_first_download() -> None:\n', native_start)
          new_native_tests = '''def test_entry_uses_committed_exact_native_closure() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    preflight = text[text.index('stage "preflight-system"'): text.index('stage "python-3.11.15"')]\n    assert "measurement_native_install_lock.txt" in preflight\n    assert "measurement_native_manifest.txt" not in preflight\n    assert 'dpkg-query", "-W"' in preflight\n    assert 'ca-certificates curl git iptables unzip xz-utils' in preflight\n    lock = RUN_DIR / "inputs" / "measurement_native_install_lock.txt"\n    rows = [line for line in lock.read_text(encoding="utf-8").splitlines() if line]\n    assert len(rows) > 20\n    assert any(row.startswith("libsndfile1:") for row in rows)\n    assert any(row.startswith("libc6:") for row in rows)\n    assert any(row.startswith("gcc") for row in rows)\n    assert all("=" in row for row in rows)\n\n\ndef test_entry_keeps_watchdog_through_hold_and_caps_wall_clock() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    block = text[text.index("on_exit() {"): text.index("trap on_exit EXIT")]\n    assert 'STOP_BUDGET_SECONDS=180' in text\n    assert 'max_hold=$(( remaining - STOP_BUDGET_SECONDS ))' in block\n    assert block.index('sleep "$hold"') < block.index('if self_stop; then')\n    assert block.index('if self_stop; then') < block.index('kill "$WATCHDOG_PID"')\n    assert block.index('wait "$WATCHDOG_PID"') > block.index('if self_stop; then')\n\n\ndef test_watchdog_terminates_workload_before_opening_network_for_stop() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    watchdog = text[text.index('(\n  sleep "$WALL_CLOCK_SECONDS"'): text.index('WATCHDOG_PID=$!')]\n    assert watchdog.index("terminate_main_for_deadline") < watchdog.index("force_restore_network_for_stop")\n    assert watchdog.index("force_restore_network_for_stop") < watchdog.index("self_stop || true")\n\n'''
          pod_tests.write_text(text[:native_start] + new_native_tests + text[native_end+1:], encoding='utf-8')

          # Admission regression tests: selected closure only, no full-OS manifest binding.
          text = admission_tests.read_text(encoding='utf-8')
          start_idx = text.index('def test_native_measurement_locks_are_bound_into_repo_provenance() -> None:\n')
          end_idx = text.index('\ndef test_production_cli_has_no_network_isolation_bypass() -> None:\n', start_idx)
          replacement = '''def test_native_measurement_lock_is_bound_into_repo_provenance() -> None:\n    snapshot = admission._snapshot_repo_inputs()  # noqa: SLF001\n    key = "measurement_native_install_lock_sha256"\n    path = admission._MEASUREMENT_NATIVE_INSTALL_LOCK_PATH  # noqa: SLF001\n    assert key in snapshot\n    assert "measurement_native_manifest_sha256" not in snapshot\n    assert snapshot[key] == admission._sha256_bytes(path.read_bytes())  # noqa: SLF001\n\n\ndef test_native_runtime_validator_queries_only_committed_closure(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    expected = [\n        line for line in admission._MEASUREMENT_NATIVE_INSTALL_LOCK_PATH.read_text(encoding="utf-8").splitlines() if line\n    ]  # noqa: SLF001\n    captured = {}\n    def fake_run(args, **kwargs):\n        captured["args"] = list(args)\n        return admission.subprocess.CompletedProcess(args=args, returncode=0, stdout="\\n".join(expected) + "\\n", stderr="")\n    monkeypatch.setattr(admission.subprocess, "run", fake_run)\n    observed = admission._validate_native_runtime()  # noqa: SLF001\n    assert observed["closure_sha256"] == admission._sha256_bytes(  # noqa: SLF001\n        admission._MEASUREMENT_NATIVE_INSTALL_LOCK_PATH.read_bytes()  # noqa: SLF001\n    )\n    assert observed["package_count"] == len(expected)\n    queried = captured["args"][3:]\n    assert queried == [row.rpartition("=")[0] for row in sorted(expected)]\n\n\ndef test_native_runtime_validator_rejects_consumed_closure_drift(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    completed = admission.subprocess.CompletedProcess(\n        args=["dpkg-query"], returncode=0, stdout="unexpected:amd64=1.0\\n", stderr=""\n    )\n    monkeypatch.setattr(admission.subprocess, "run", lambda *args, **kwargs: completed)\n    with pytest.raises(bp.BirthProbeError, match="native measurement dependency closure mismatch"):\n        admission._validate_native_runtime()  # noqa: SLF001\n\n'''
          admission_tests.write_text(text[:start_idx] + replacement + text[end_idx+1:], encoding='utf-8')
          PY
      - name: Validate focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q voice_genesis/evolution/run9_dual_founder_pjs/run9_success_admission.py voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_runner.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round6_review_fixes.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): close round6 watchdog and native closure gaps'
          git push origin HEAD:codex/run9-success-only-prepod
