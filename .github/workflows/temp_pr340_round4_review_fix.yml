name: temp-pr340-round4-review-fix

on:
  push:
    branches:
      - codex/run9-success-only-prepod
    paths:
      - .github/workflows/temp_pr340_round4_review_fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply bootstrap checkout ordering fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          entry = run_dir / 'run9_success_pod_entry.sh'
          tests = run_dir / 'tests/test_run9_success_pod.py'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          constants_old = '''readonly RUN_DIR="$REPO/voice_genesis/evolution/run9_dual_founder_pjs"\nreadonly STATUS_FILE="$PUBLIC/status.json"\n'''
          constants_new = '''readonly RUN_DIR="$REPO/voice_genesis/evolution/run9_dual_founder_pjs"\n# The entry script is executed from the already fetched, commit-verified bootstrap\n# checkout before $REPO exists. Early immutable inputs must therefore be read from\n# the directory containing this exact script, not from the later work checkout.\nreadonly BOOTSTRAP_RUN_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"\nreadonly STATUS_FILE="$PUBLIC/status.json"\n'''
          replace_once(entry, constants_old, constants_new, 'bootstrap run dir constant')

          preflight_old = '''stage "preflight-system"\nreadonly NATIVE_INSTALL_LOCK="$RUN_DIR/inputs/measurement_native_install_lock.txt"\nreadonly NATIVE_MANIFEST="$RUN_DIR/inputs/measurement_native_manifest.txt"\n[ -s "$NATIVE_INSTALL_LOCK" ] || die "committed native install lock is missing"\n[ -s "$NATIVE_MANIFEST" ] || die "committed native manifest is missing"\n'''
          preflight_new = '''stage "preflight-system"\nBOOTSTRAP_HEAD="$(git -C "$BOOTSTRAP_RUN_DIR" rev-parse HEAD 2>/dev/null || true)"\n[ "$BOOTSTRAP_HEAD" = "$RUN9_PIN_COMMIT" ] \\\n  || die "bootstrap checkout does not match RUN9_PIN_COMMIT before native preflight"\nreadonly NATIVE_INSTALL_LOCK="$BOOTSTRAP_RUN_DIR/inputs/measurement_native_install_lock.txt"\nreadonly NATIVE_MANIFEST="$BOOTSTRAP_RUN_DIR/inputs/measurement_native_manifest.txt"\n[ -s "$NATIVE_INSTALL_LOCK" ] || die "committed native install lock is missing from bootstrap checkout"\n[ -s "$NATIVE_MANIFEST" ] || die "committed native manifest is missing from bootstrap checkout"\n'''
          replace_once(entry, preflight_old, preflight_new, 'native locks from existing checkout')

          marker = '''def test_entry_measurement_environment_uses_committed_full_lock() -> None:\n'''
          regression = '''def test_entry_native_preflight_reads_existing_verified_bootstrap_checkout() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    bootstrap_dir = text.index("readonly BOOTSTRAP_RUN_DIR=")\n    preflight_start = text.index('stage "preflight-system"')\n    source_checkout = text.index('stage "source-checkout"')\n    assert bootstrap_dir < preflight_start < source_checkout\n    preflight = text[preflight_start:text.index('stage "python-3.11.15"')]\n    assert 'git -C "$BOOTSTRAP_RUN_DIR" rev-parse HEAD' in preflight\n    assert '[ "$BOOTSTRAP_HEAD" = "$RUN9_PIN_COMMIT" ]' in preflight\n    assert '$BOOTSTRAP_RUN_DIR/inputs/measurement_native_install_lock.txt' in preflight\n    assert '$BOOTSTRAP_RUN_DIR/inputs/measurement_native_manifest.txt' in preflight\n    assert '$RUN_DIR/inputs/measurement_native_' not in preflight\n\n\n'''
          replace_once(tests, marker, regression + marker, 'normal bootstrap ordering regression')
          PY

      - name: Validate focused fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round4_review_fix.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): read native locks from bootstrap checkout'
          git push origin HEAD:codex/run9-success-only-prepod
