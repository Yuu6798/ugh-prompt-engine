name: temp-pr340-round3-review-fixes

on:
  push:
    branches:
      - codex/run9-success-only-prepod
    paths:
      - .github/workflows/temp_pr340_round3_review_fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Derive native closure from pinned RunPod image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='runpod/base:1.1.0-ubuntu2404@sha256:6a7ffc191ddee44bcede7b8508a76f67df690df7d58043edd6695ef63bffef23'
          RUN_DIR='voice_genesis/evolution/run9_dual_founder_pjs'
          docker pull "$IMAGE"
          cat > native_probe.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          RUN_DIR=/repo/voice_genesis/evolution/run9_dual_founder_pjs
          dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort > /tmp/native.base
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git python3
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential ca-certificates curl git iptables libbz2-dev libffi-dev \
            liblzma-dev libreadline-dev libsqlite3-dev libssl-dev libsndfile1 tk-dev \
            unzip xz-utils zlib1g-dev
          dpkg-query -W -f='${binary:Package}=${Version}\n' | LC_ALL=C sort > /tmp/native.final
          python3 - /tmp/native.base /tmp/native.final \
            "$RUN_DIR/inputs/measurement_native_install_lock.txt" \
            "$RUN_DIR/inputs/measurement_native_manifest.txt" <<'PY'
          import pathlib, sys
          base_path, final_path, install_path, manifest_path = map(pathlib.Path, sys.argv[1:])
          def parse(path):
              rows = [line.strip() for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
              result = {}
              for row in rows:
                  name, sep, version = row.partition('=')
                  if not sep or not name or not version:
                      raise SystemExit(f'invalid dpkg row: {row!r}')
                  result[name] = version
              return result
          base = parse(base_path)
          final = parse(final_path)
          changed = [f'{name}={version}' for name, version in sorted(final.items()) if base.get(name) != version]
          if not changed:
              raise SystemExit('native install closure unexpectedly empty')
          pathlib.Path(install_path).write_text('\n'.join(changed) + '\n', encoding='utf-8')
          manifest_rows = [f'{name}={version}' for name, version in sorted(final.items())]
          pathlib.Path(manifest_path).write_text('\n'.join(manifest_rows) + '\n', encoding='utf-8')
          print(f'native mutable closure={len(changed)} packages; final manifest={len(manifest_rows)} packages')
          PY
          SH
          chmod +x native_probe.sh
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" "$IMAGE" bash /repo/native_probe.sh
          rm -f native_probe.sh
          test -s "$RUN_DIR/inputs/measurement_native_install_lock.txt"
          test -s "$RUN_DIR/inputs/measurement_native_manifest.txt"

      - name: Apply round3 review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          entry = run_dir / 'run9_success_pod_entry.sh'
          runner = run_dir / 'run9_success_pod_runner.py'
          admission = run_dir / 'run9_success_admission.py'
          pod_tests = run_dir / 'tests/test_run9_success_pod.py'
          admission_tests = run_dir / 'tests/test_success_only_admission.py'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # P1: watchdog runs in a subshell created before FIREWALL_ACTIVE flips to true.
          # Give it an unconditional firewall teardown path before retrying self-stop.
          restore_marker = '''restore_network() {\n  if [ "$FIREWALL_ACTIVE" = "true" ]; then\n    iptables -P OUTPUT ACCEPT 2>/dev/null || true\n    iptables -F OUTPUT 2>/dev/null || true\n    FIREWALL_ACTIVE="false"\n  fi\n}\n\n'''
          force_restore = '''force_restore_network_for_stop() {\n  # The watchdog subshell was forked before FIREWALL_ACTIVE changes, so it must\n  # not rely on that shell-local flag when recovering connectivity for runpodctl.\n  iptables -P OUTPUT ACCEPT 2>/dev/null || true\n  iptables -F OUTPUT 2>/dev/null || true\n  FIREWALL_ACTIVE="false"\n}\n\n'''
          replace_once(entry, restore_marker, restore_marker + force_restore, 'watchdog force network restore helper')
          watchdog_old = '''(\n  sleep "$WALL_CLOCK_SECONDS"\n  echo "| run9: watchdog reached ${WALL_CLOCK_SECONDS}s; forcing stop" >&2\n  self_stop || true\n) &\n'''
          watchdog_new = '''(\n  sleep "$WALL_CLOCK_SECONDS"\n  echo "| run9: watchdog reached ${WALL_CLOCK_SECONDS}s; forcing stop" >&2\n  force_restore_network_for_stop\n  self_stop || true\n) &\n'''
          replace_once(entry, watchdog_old, watchdog_new, 'watchdog restores network before stop')

          # P1: replace mutable unversioned apt closure with exact pins derived from the
          # digest-pinned RunPod image, then verify the complete final dpkg manifest.
          preflight_old = '''stage "preflight-system"\napt-get update -qq\nDEBIAN_FRONTEND=noninteractive apt-get install -y -qq \\\n  build-essential ca-certificates curl git iptables libbz2-dev libffi-dev \\\n  liblzma-dev libreadline-dev libsqlite3-dev libssl-dev libsndfile1 tk-dev \\\n  unzip xz-utils zlib1g-dev\n'''
          preflight_new = '''stage "preflight-system"\nreadonly NATIVE_INSTALL_LOCK="$RUN_DIR/inputs/measurement_native_install_lock.txt"\nreadonly NATIVE_MANIFEST="$RUN_DIR/inputs/measurement_native_manifest.txt"\n[ -s "$NATIVE_INSTALL_LOCK" ] || die "committed native install lock is missing"\n[ -s "$NATIVE_MANIFEST" ] || die "committed native manifest is missing"\nmapfile -t NATIVE_PACKAGES < "$NATIVE_INSTALL_LOCK"\n[ "${#NATIVE_PACKAGES[@]}" -gt 0 ] || die "native install lock is empty"\napt-get update -qq\nDEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \\\n  --allow-downgrades "${NATIVE_PACKAGES[@]}"\ndpkg-query -W -f='${binary:Package}=${Version}\\n' | LC_ALL=C sort \\\n  > "$WORK/measurement_native_environment.actual"\nif ! cmp -s "$NATIVE_MANIFEST" "$WORK/measurement_native_environment.actual"; then\n  diff -u "$NATIVE_MANIFEST" "$WORK/measurement_native_environment.actual" >&2 || true\n  die "native measurement environment does not match committed manifest"\nfi\n'''
          replace_once(entry, preflight_old, preflight_new, 'native exact install and manifest verification')

          # P1: post-send transport/timeout/JSON failures are ambiguous launches, not
          # ordinary uncaught exceptions. Model that explicitly and force reconciliation.
          class_marker = '''class PreflightError(RuntimeError):\n    """The local or remote source boundary is not launchable."""\n\n\n'''
          ambiguous_class = '''class AmbiguousLaunchError(RuntimeError):\n    """The RunPod create request may have produced a billable Pod without a handle."""\n\n\n'''
          replace_once(runner, class_marker, class_marker + ambiguous_class, 'ambiguous launch exception')

          request_old = '''def _request_json(\n    method: str,\n    url: str,\n    *,\n    api_key: str,\n    payload: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n    body = None if payload is None else _canonical_json_bytes(payload)\n    request = urllib.request.Request(\n        url,\n        data=body,\n        method=method,\n        headers={\n            "Authorization": f"Bearer {api_key}",\n            "Content-Type": "application/json",\n        },\n    )\n    try:\n        with urllib.request.urlopen(request, timeout=90) as response:\n            result = json.loads(response.read().decode("utf-8"))\n    except urllib.error.HTTPError as exc:\n        detail = exc.read().decode("utf-8", errors="replace")\n        raise RuntimeError(f"RunPod API {exc.code}: {detail}") from exc\n    if not isinstance(result, dict):\n        raise RuntimeError("RunPod API returned a non-object response")\n    return result\n'''
          request_new = '''def _request_json(\n    method: str,\n    url: str,\n    *,\n    api_key: str,\n    payload: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n    body = None if payload is None else _canonical_json_bytes(payload)\n    request = urllib.request.Request(\n        url,\n        data=body,\n        method=method,\n        headers={\n            "Authorization": f"Bearer {api_key}",\n            "Content-Type": "application/json",\n        },\n    )\n    try:\n        with urllib.request.urlopen(request, timeout=90) as response:\n            raw = response.read()\n    except urllib.error.HTTPError as exc:\n        detail = exc.read().decode("utf-8", errors="replace")\n        raise RuntimeError(f"RunPod API {exc.code}: {detail}") from exc\n    except (urllib.error.URLError, TimeoutError, OSError) as exc:\n        raise AmbiguousLaunchError(\n            f"RunPod {method} transport failed after request initiation: {type(exc).__name__}"\n        ) from exc\n    try:\n        result = json.loads(raw.decode("utf-8"))\n    except (UnicodeDecodeError, json.JSONDecodeError) as exc:\n        raise AmbiguousLaunchError(\n            f"RunPod {method} response was received but could not be decoded as JSON"\n        ) from exc\n    if not isinstance(result, dict):\n        raise AmbiguousLaunchError(f"RunPod {method} returned a non-object JSON response")\n    return result\n'''
          replace_once(runner, request_old, request_new, 'ambiguous post transport handling')

          launch_old = '''    response = _request_json(\n        "POST",\n        CREATE_POD_URL,\n        api_key=api_key,\n        payload=report["payload"],\n    )\n    pod_id = _extract_pod_id(response)\n    launch_record = {\n        "schema": "run9-success-pod-launch/1.0",\n        "source_commit": report["source_commit"],\n        "payload_sha256": report["payload_sha256"],\n        "pod_id": pod_id,\n        "pod": response,\n    }\n    _print_json(launch_record)\n    if pod_id is None:\n        raise RuntimeError(\n            "RunPod POST /pods succeeded but returned no id/podId; a billable Pod may "\n            "exist without a recorded stop handle — reconcile in the RunPod console immediately"\n        )\n'''
          launch_new = '''    try:\n        response = _request_json(\n            "POST",\n            CREATE_POD_URL,\n            api_key=api_key,\n            payload=report["payload"],\n        )\n    except AmbiguousLaunchError as exc:\n        _print_json(\n            {\n                "schema": "run9-success-pod-launch/1.0",\n                "source_commit": report["source_commit"],\n                "payload_sha256": report["payload_sha256"],\n                "launch_status": "AMBIGUOUS_POST",\n                "pod_id": None,\n                "pod": None,\n            }\n        )\n        raise RuntimeError(\n            "RunPod POST /pods outcome is ambiguous after request initiation; a billable Pod "\n            "may exist without a recorded stop handle — reconcile in the RunPod console immediately"\n        ) from exc\n    pod_id = _extract_pod_id(response)\n    launch_record = {\n        "schema": "run9-success-pod-launch/1.0",\n        "source_commit": report["source_commit"],\n        "payload_sha256": report["payload_sha256"],\n        "launch_status": "CONFIRMED_RESPONSE" if pod_id is not None else "AMBIGUOUS_NO_POD_ID",\n        "pod_id": pod_id,\n        "pod": response,\n    }\n    _print_json(launch_record)\n    if pod_id is None:\n        raise RuntimeError(\n            "RunPod POST /pods succeeded but returned no id/podId; a billable Pod may "\n            "exist without a recorded stop handle — reconcile in the RunPod console immediately"\n        )\n'''
          replace_once(runner, launch_old, launch_new, 'ambiguous launch reconciliation record')

          # Bind and verify native closure in the scientific admission process before ORT import.
          const_marker = '''_MEASUREMENT_LOCK_PATH = _THIS_DIR / "inputs" / "measurement_environment_lock.txt"\n'''
          const_new = const_marker + '''_MEASUREMENT_NATIVE_INSTALL_LOCK_PATH = (\n    _THIS_DIR / "inputs" / "measurement_native_install_lock.txt"\n)\n_MEASUREMENT_NATIVE_MANIFEST_PATH = (\n    _THIS_DIR / "inputs" / "measurement_native_manifest.txt"\n)\n'''
          replace_once(admission, const_marker, const_new, 'native closure constants')

          provenance_marker = '''        "measurement_environment_lock_sha256": _MEASUREMENT_LOCK_PATH,\n'''
          provenance_new = provenance_marker + '''        "measurement_native_install_lock_sha256": _MEASUREMENT_NATIVE_INSTALL_LOCK_PATH,\n        "measurement_native_manifest_sha256": _MEASUREMENT_NATIVE_MANIFEST_PATH,\n'''
          replace_once(admission, provenance_marker, provenance_new, 'native closure provenance')

          runtime_marker = '''def _validate_runtime(policy: Mapping[str, Any]) -> Dict[str, str]:\n'''
          native_validator = '''def _validate_native_runtime() -> Dict[str, Any]:\n    """Fail closed unless the complete installed dpkg manifest matches the committed one."""\n    try:\n        expected_bytes = _MEASUREMENT_NATIVE_MANIFEST_PATH.read_bytes()\n        expected_rows = sorted(\n            line.strip()\n            for line in expected_bytes.decode("utf-8").splitlines()\n            if line.strip()\n        )\n        install_bytes = _MEASUREMENT_NATIVE_INSTALL_LOCK_PATH.read_bytes()\n        install_rows = sorted(\n            line.strip()\n            for line in install_bytes.decode("utf-8").splitlines()\n            if line.strip()\n        )\n        actual_rows = sorted(\n            line.strip()\n            for line in subprocess.run(\n                ["dpkg-query", "-W", "-f=${binary:Package}=${Version}\\n"],\n                check=True,\n                capture_output=True,\n                text=True,\n            ).stdout.splitlines()\n            if line.strip()\n        )\n    except (OSError, UnicodeDecodeError, subprocess.CalledProcessError) as exc:\n        raise bp.BirthProbeError("native measurement dependency closure could not be verified") from exc\n    if not expected_rows or not install_rows:\n        raise bp.BirthProbeError("native measurement dependency lock is empty")\n    for row in expected_rows + install_rows:\n        name, sep, version = row.partition("=")\n        if not sep or not name or not version:\n            raise bp.BirthProbeError(f"native measurement lock row is invalid: {row!r}")\n    if not set(install_rows).issubset(set(expected_rows)):\n        raise bp.BirthProbeError("native install lock is not a subset of the final native manifest")\n    if actual_rows != expected_rows:\n        raise bp.BirthProbeError(\n            "native measurement dependency closure mismatch: "\n            f"extra={sorted(set(actual_rows)-set(expected_rows))!r}, "\n            f"missing={sorted(set(expected_rows)-set(actual_rows))!r}"\n        )\n    return {\n        "manifest_sha256": _sha256_bytes(expected_bytes),\n        "package_count": len(expected_rows),\n        "install_lock_sha256": _sha256_bytes(install_bytes),\n        "mutable_package_count": len(install_rows),\n    }\n\n\n'''
          replace_once(admission, runtime_marker, native_validator + runtime_marker, 'native runtime validator')

          execute_old = '''    _verify_network_isolation()\n    _disable_ort_telemetry()\n    runtime_versions = _validate_runtime(policy)\n'''
          execute_new = '''    _verify_network_isolation()\n    native_runtime = _validate_native_runtime()\n    runtime_versions = _validate_runtime(policy)\n    _disable_ort_telemetry()\n'''
          replace_once(admission, execute_old, execute_new, 'native validation before ORT import')

          measurement_marker = '''        "runtime_dependency_versions": runtime_versions,\n'''
          measurement_new = measurement_marker + '''        "native_runtime": native_runtime,\n'''
          replace_once(admission, measurement_marker, measurement_new, 'native runtime measurement provenance')

          # Regression tests for all three current-head P1 findings.
          watchdog_test_old = '''    assert "self_stop || true" in watchdog\n    assert 'runpodctl stop pod "$RUNPOD_POD_ID" || true' not in watchdog\n'''
          watchdog_test_new = '''    assert watchdog.index("force_restore_network_for_stop") < watchdog.index("self_stop || true")\n    assert "self_stop || true" in watchdog\n    assert 'runpodctl stop pod "$RUNPOD_POD_ID" || true' not in watchdog\n'''
          replace_once(pod_tests, watchdog_test_old, watchdog_test_new, 'watchdog network restore regression')

          native_test_marker = '''def test_entry_enables_watchdog_before_the_first_download() -> None:\n'''
          native_test = '''def test_entry_uses_committed_exact_native_closure() -> None:\n    text = (RUN_DIR / "run9_success_pod_entry.sh").read_text(encoding="utf-8")\n    preflight = text[text.index('stage "preflight-system"'): text.index('stage "python-3.11.15"')]\n    assert "measurement_native_install_lock.txt" in preflight\n    assert "measurement_native_manifest.txt" in preflight\n    assert "--allow-downgrades" in preflight\n    assert "dpkg-query -W" in preflight\n    assert "cmp -s" in preflight\n    install_rows = [\n        line for line in (RUN_DIR / "inputs" / "measurement_native_install_lock.txt").read_text(encoding="utf-8").splitlines() if line\n    ]\n    manifest_rows = [\n        line for line in (RUN_DIR / "inputs" / "measurement_native_manifest.txt").read_text(encoding="utf-8").splitlines() if line\n    ]\n    assert install_rows\n    assert len(manifest_rows) > len(install_rows)\n    assert all("=" in row for row in install_rows + manifest_rows)\n    assert set(install_rows).issubset(set(manifest_rows))\n\n\n'''
          replace_once(pod_tests, native_test_marker, native_test + native_test_marker, 'native entry closure regression')

          launch_test_marker = '''def test_preflight_rejects_dirty_tree_before_remote_check(\n'''
          launch_tests = '''def test_launch_reconciles_ambiguous_post_transport_failure(\n    monkeypatch: pytest.MonkeyPatch,\n    capsys: pytest.CaptureFixture[str],\n) -> None:\n    payload = runner.build_launch_payload(COMMIT)\n    monkeypatch.setenv("RUNPOD_API_KEY", "not-printed")\n    monkeypatch.setattr(\n        runner,\n        "verify_prelaunch",\n        lambda: {\n            "source_commit": COMMIT,\n            "payload_sha256": "b" * 64,\n            "payload": payload,\n        },\n    )\n    monkeypatch.setattr(\n        runner,\n        "_request_json",\n        lambda *args, **kwargs: (_ for _ in ()).throw(runner.AmbiguousLaunchError("timeout")),\n    )\n    assert runner.main(["launch", "--confirm-launch", runner.CONFIRMATION]) == 2\n    captured = capsys.readouterr()\n    assert '"launch_status": "AMBIGUOUS_POST"' in captured.out\n    assert '"pod_id": null' in captured.out\n    assert "billable Pod may exist" in captured.err\n    assert "reconcile in the RunPod console immediately" in captured.err\n\n\ndef test_request_json_classifies_timeout_as_ambiguous_post(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    def timeout(*args: Any, **kwargs: Any) -> Any:\n        raise TimeoutError("response lost")\n\n    monkeypatch.setattr(runner.urllib.request, "urlopen", timeout)\n    with pytest.raises(runner.AmbiguousLaunchError, match="transport failed"):\n        runner._request_json(\n            "POST", runner.CREATE_POD_URL, api_key="not-printed", payload={"x": 1}\n        )\n\n\ndef test_request_json_classifies_malformed_json_as_ambiguous_post(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    class Response:\n        def __enter__(self) -> "Response":\n            return self\n\n        def __exit__(self, *args: Any) -> None:\n            return None\n\n        def read(self) -> bytes:\n            return b"{not-json"\n\n    monkeypatch.setattr(runner.urllib.request, "urlopen", lambda *args, **kwargs: Response())\n    with pytest.raises(runner.AmbiguousLaunchError, match="could not be decoded as JSON"):\n        runner._request_json(\n            "POST", runner.CREATE_POD_URL, api_key="not-printed", payload={"x": 1}\n        )\n\n\n'''
          replace_once(pod_tests, launch_test_marker, launch_tests + launch_test_marker, 'ambiguous launch regressions')

          admission_test_marker = '''def test_production_cli_has_no_network_isolation_bypass() -> None:\n'''
          admission_native_tests = '''def test_native_measurement_locks_are_bound_into_repo_provenance() -> None:\n    snapshot = admission._snapshot_repo_inputs()  # noqa: SLF001\n    for key, path in (\n        ("measurement_native_install_lock_sha256", admission._MEASUREMENT_NATIVE_INSTALL_LOCK_PATH),  # noqa: SLF001\n        ("measurement_native_manifest_sha256", admission._MEASUREMENT_NATIVE_MANIFEST_PATH),  # noqa: SLF001\n    ):\n        assert key in snapshot\n        assert snapshot[key] == admission._sha256_bytes(path.read_bytes())  # noqa: SLF001\n\n\ndef test_native_runtime_validator_requires_exact_committed_manifest(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    expected = admission._MEASUREMENT_NATIVE_MANIFEST_PATH.read_text(encoding="utf-8")  # noqa: SLF001\n    completed = admission.subprocess.CompletedProcess(\n        args=["dpkg-query"], returncode=0, stdout=expected, stderr=""\n    )\n    monkeypatch.setattr(admission.subprocess, "run", lambda *args, **kwargs: completed)\n    observed = admission._validate_native_runtime()  # noqa: SLF001\n    assert observed["manifest_sha256"] == admission._sha256_bytes(  # noqa: SLF001\n        admission._MEASUREMENT_NATIVE_MANIFEST_PATH.read_bytes()  # noqa: SLF001\n    )\n    assert observed["package_count"] > observed["mutable_package_count"] > 0\n\n\ndef test_native_runtime_validator_rejects_manifest_drift(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    completed = admission.subprocess.CompletedProcess(\n        args=["dpkg-query"], returncode=0, stdout="unexpected:amd64=1.0\\n", stderr=""\n    )\n    monkeypatch.setattr(admission.subprocess, "run", lambda *args, **kwargs: completed)\n    with pytest.raises(bp.BirthProbeError, match="native measurement dependency closure mismatch"):\n        admission._validate_native_runtime()  # noqa: SLF001\n\n\n'''
          replace_once(admission_tests, admission_test_marker, admission_native_tests + admission_test_marker, 'native admission regressions')
          PY

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q voice_genesis/evolution/run9_dual_founder_pjs
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_run9_success_pod.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round3_review_fixes.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): close round3 pod safety gaps'
          git push origin HEAD:codex/run9-success-only-prepod
