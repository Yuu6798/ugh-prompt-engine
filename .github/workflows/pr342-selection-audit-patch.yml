name: PR342 selection audit patch

on:
  push:
    branches:
      - "claude/design-based-implementation-653xpl"
    paths:
      - ".github/workflows/pr342-selection-audit-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/design-based-implementation-653xpl"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply selection audit fix
        run: python .github/pr342_selection_audit_patch.py

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Selection regressions
        run: pytest -q --tb=short voice_genesis/calibration/tests/test_selection.py

      - name: Lint selection changes
        run: ruff check voice_genesis/calibration/selection.py voice_genesis/calibration/tests/test_selection.py

      - name: Commit selection audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/calibration/selection.py voice_genesis/calibration/tests/test_selection.py
          git diff --cached --check
          git commit -m "fix(calibration): preserve unranked selection audit vectors"
          git push origin HEAD:claude/design-based-implementation-653xpl
