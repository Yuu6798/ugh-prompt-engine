name: PR342 diagnostic/M6 bounded review patch

on:
  push:
    branches:
      - "claude/design-based-implementation-653xpl"
    paths:
      - ".github/workflows/pr342-review-diag-m6.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "claude/design-based-implementation-653xpl"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply bounded review fixes
        run: python .github/pr342_diag_m6_patch.py

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run targeted regressions
        run: pytest -q --tb=short voice_genesis/calibration/tests/test_selection.py voice_genesis/calibration/tests/test_m6.py

      - name: Lint bounded changes
        run: ruff check voice_genesis/calibration/selection.py voice_genesis/calibration/m6_identity.py voice_genesis/calibration/tests/test_selection.py voice_genesis/calibration/tests/test_m6.py

      - name: Commit bounded fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice_genesis/calibration/selection.py voice_genesis/calibration/m6_identity.py voice_genesis/calibration/tests/test_selection.py voice_genesis/calibration/tests/test_m6.py
          git diff --cached --check
          git commit -m "fix(calibration): preserve diagnostic audits and guard M6 operands"
          git push origin HEAD:claude/design-based-implementation-653xpl
