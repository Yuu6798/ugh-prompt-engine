name: temp-pr340-round12-publication-leaf
on:
  push:
    branches: [codex/run9-success-only-prepod]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/run9-success-only-prepod
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply publication leaf fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          run_dir = Path('voice_genesis/evolution/run9_dual_founder_pjs')
          admission = run_dir / 'run9_success_admission.py'
          tests = run_dir / 'tests/test_success_only_admission.py'

          text = admission.read_text(encoding='utf-8')
          old = '''    output_dir = output_dir.resolve()\n    if not output_dir.name.startswith("successful_"):\n        raise bp.BirthProbeError("successful output directory must start with 'successful_'")\n    if output_dir.exists():\n        raise bp.BirthProbeError(f"refusing to overwrite successful bundle: {output_dir}")\n    output_dir.parent.mkdir(parents=True, exist_ok=True)\n'''
          new = '''    # Preserve the requested publication leaf. Path.resolve() follows a dangling\n    # symlink and can silently retarget the final atomic rename outside the served\n    # publication root. Normalize dot segments without dereferencing the leaf,\n    # reject any symlink at the requested destination, then keep this lexical path\n    # as the os.replace() target.\n    output_dir = Path(os.path.abspath(output_dir))\n    if not output_dir.name.startswith("successful_"):\n        raise bp.BirthProbeError("successful output directory must start with 'successful_'")\n    if output_dir.is_symlink():\n        raise bp.BirthProbeError("successful output path must not be a symlink")\n    if output_dir.exists():\n        raise bp.BirthProbeError(f"refusing to overwrite successful bundle: {output_dir}")\n    output_dir.parent.mkdir(parents=True, exist_ok=True)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'publication leaf replacement count={text.count(old)}')
          admission.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_text = tests.read_text(encoding='utf-8')
          marker = '''def test_success_publisher_rejects_symlinked_staging_before_bundle_writes(\n'''
          added = '''def test_success_publisher_rejects_dangling_publication_leaf_symlink(\n    tmp_path: Path,\n) -> None:\n    snapshot = _write_generated_export(tmp_path / "generated")\n    issued = _issue(snapshot)\n    public_root = tmp_path / "run9_public"\n    public_root.mkdir()\n    output = public_root / "successful_run9"\n    redirected = tmp_path / "successful_redirect"\n    output.symlink_to(redirected, target_is_directory=True)\n\n    with pytest.raises(bp.BirthProbeError, match="output path must not be a symlink"):\n        admission.publish_successful_artifact_bundle(\n            output,\n            issued,\n            _measurement(passed=True),\n            _observations(),\n            bp.FeatureArtifact.from_vector(np.asarray([2.0, 2.0])),\n            snapshot,\n        )\n    assert output.is_symlink()\n    assert not redirected.exists()\n    assert not (public_root / "SUCCESS.json").exists()\n\n\n'''
          if marker not in test_text:
              raise SystemExit('symlink staging test marker not found')
          tests.write_text(test_text.replace(marker, added + marker, 1), encoding='utf-8')
          PY
      - name: Validate round12 fix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q \
            voice_genesis/evolution/run9_dual_founder_pjs/run9_success_admission.py \
            voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py
          bash -n voice_genesis/evolution/run9_dual_founder_pjs/run9_success_pod_entry.sh
          git diff --check
          pytest -q voice_genesis/evolution/run9_dual_founder_pjs/tests/test_success_only_admission.py
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp_pr340_round12_publication_leaf.yml
          git config user.name 'Yuu6798'
          git config user.email 'kkoo6798@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(run9): preserve publication leaf against symlink redirect'
          git push origin HEAD:codex/run9-success-only-prepod
