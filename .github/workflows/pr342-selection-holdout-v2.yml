name: PR342 selection holdout bounded patch v2
on:
  push:
    branches: [claude/design-based-implementation-653xpl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/design-based-implementation-653xpl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded review fixes
        run: python .github/pr342_selection_holdout_patch.py
      - name: Deduplicate diagnostic failure audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('voice_genesis/calibration/selection.py')
          s = p.read_text(encoding='utf-8')
          old = '''    for candidate in candidates:\n        if candidate.candidate_id not in accounted_ids:\n            ineligible.append((candidate.candidate_id, "different_ceiling_pool"))\n\n    failed = SelectionOutcome('''
          new = '''    for candidate in candidates:\n        if (\n            candidate.candidate_id not in accounted_ids\n            and candidate.ceiling != ClaimCeiling.DIAGNOSTIC_ONLY\n        ):\n            ineligible.append((candidate.candidate_id, "different_ceiling_pool"))\n\n    failed = SelectionOutcome('''
          if old not in s:
              raise SystemExit('diagnostic failure audit anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Align failure audit regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('voice_genesis/calibration/tests/test_selection.py')
          s = p.read_text(encoding='utf-8')
          old = '("diag-only", "different_ceiling_pool")'
          if s.count(old) < 2:
              raise SystemExit('expected diagnostic failure audit assertions missing')
          s = s.replace(old, '("diag-only", "criteria_payload_absent")', 2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary assets
        run: |
          rm -f .github/pr342_selection_holdout_patch.py
          rm -f .github/workflows/pr342-selection-holdout.yml
          rm -f .github/workflows/pr342-selection-holdout-v2.yml
          rm -f .github/pr342-selection-holdout-trigger.txt
      - name: Commit locally for validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(calibration): validate selection domains and holdout set"
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Run targeted regressions
        run: |
          pytest -q --tb=short voice_genesis/calibration/tests/test_selection.py voice_genesis/calibration/tests/test_provenance.py voice_genesis/calibration/tests/test_c0_path_inventory_sync.py
      - name: Lint bounded changes
        run: |
          ruff check voice_genesis/calibration/selection.py voice_genesis/calibration/provenance.py voice_genesis/calibration/tests/test_selection.py voice_genesis/calibration/tests/test_provenance.py
      - name: Push bounded fix
        run: git push origin HEAD:claude/design-based-implementation-653xpl
