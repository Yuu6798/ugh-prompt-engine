# melody_bench/registry.yaml — 主旋律観測ベンチマークの事前登録レジストリ（M0）
#
# `docs/melody_observability.md`（M0/M1 設計）が定める事前登録の single source of
# truth。ここで固定した閾値・分割・規則は M1 で fixture に合わせて後から緩めない
# （事前登録厳守）。観測ゲート指標の算出は
# `src/svp_rpe/melody/observability.py`（`ObservabilityThresholds.from_registry`）。
#
# 重要: このレジストリは「melody preserved を保証する」ためのものではない。
# 「どの入力 × 抽出器 × 前処理なら旋律をそもそも観測できるか」を測る観測ゲートの
# 事前登録である。preserved 判定・類似度比較（M3）・正解精度評価 RPA/RCA（M2）・
# Recast 配線（M4）は本レジストリの射程外。

schema_version: "melody-bench/0.1"
registered_utc: "2026-07-23"

# ---------------------------------------------------------------------------
# 観測ゲート閾値（事前登録・M1 で緩めない）
# ---------------------------------------------------------------------------
# 根拠: Phase 0 スパイク（docs/recast_phase0_melody_spike.md）で pyin が合成和音
# パッドに対し 1–4 音へ縮退した実測。旋律として観測が成立する下限を「≥8 音・
# ≥2 フレーズ・有声被覆 ≥30%・平均信頼 ≥0.45・低信頼率 ≤55%・オクターブ誤り率
# ≤35%」と置く。単一持続音／和音パッド／被覆不足はこの下限で insufficient に落ちる。
observation_gate:
  min_voiced_coverage: 0.30       # 対象区間で有声 F0 が得られたフレーム割合の下限
  min_note_count: 8               # 導出ノート数の下限（和音パッドの 1–4 音を弾く）
  min_phrase_count: 2             # フレーズ数の下限（単一持続音を弾く）
  min_confidence_mean: 0.45       # 有声フレーム平均信頼度の下限
  max_low_confidence_rate: 0.55   # low_confidence_floor 未満フレーム割合の上限
  max_octave_jump_rate: 0.35      # 連続ノート遷移のオクターブ級ジャンプ割合の上限
  voiced_confidence_floor: 0.30   # このフレーム信頼度以上を「有声」とみなす
  low_confidence_floor: 0.50      # このフレーム信頼度未満を「低信頼」と数える
  # cross_extractor_agreement は M1 では任意計測（null = ゲート条件に用いない）。
  # 2 抽出器のノート系列一致度で「観測できた場合の弁別可能性」の目安を採るが、
  # 弁別の本評価は M3。
  min_cross_extractor_agreement: null
  # ノート導出パラメータ（フレーム → ノート）。Phase 0 スパイクと同値。
  note_min_run_frames: 3
  median_filter_frames: 5
  phrase_gap_sec: 0.6
  octave_jump_semitones: 11.0

# ---------------------------------------------------------------------------
# 分離判定（M1 では観測できた場合の弁別可能性の目安。本評価は M3）
# ---------------------------------------------------------------------------
separation_gate:
  # 同曲変形ペアと異曲 negative の cross_extractor_agreement / 旋律類似度の
  # 最低分離幅（同曲 min − 異曲 max）。M1 の主目的はゲート成立であり、この幅は
  # 記録するが M1 の Go/No-Go 条件にはしない。
  min_same_minus_cross_margin: 0.15

# ---------------------------------------------------------------------------
# hold-out 分割（閾値調整用と最終確認用を分離）
# ---------------------------------------------------------------------------
# 上の observation_gate は tuning_split の観測のみを見て M0 で固定した。
# holdout_split は M1 の最終確認（Go/No-Go）でのみ観測し、閾値調整には使わない。
splits:
  tuning:
    - synth_mono_phrased      # 正の対照（観測できるべき）
    - synth_chord_pad         # 負の対照（観測できないべき → not_observed）
  holdout:
    - synth_mono_two_phrase   # 正の対照 hold-out
    - synth_unison_drone      # 負の対照 hold-out（単一持続音）

# ---------------------------------------------------------------------------
# 昇格の一方向規則（proposal「採用しない方針」= pYIN 救済禁止と同型）
# ---------------------------------------------------------------------------
one_way_rule: >
  一度 not_observed（全経路 insufficient）に落ちた入力帯を、閾値・係数の後付け
  調整だけで採用へ戻してはならない。再採用には新しい入力（例: Demucs 後の実
  vocals stem）または新しい抽出器経路での dated 再実測を要する。M1 全滅時に M2 へ
  自動進行しない（明示的な Go 判定を要求する）。

# ---------------------------------------------------------------------------
# M1-real Go bar（実測前に凍結・machine-dependent slow-lane 用）
# ---------------------------------------------------------------------------
# 下記 external_fixtures の M1-real 素材（real_vocal_* 4 本 + real_instrumental_
# negative 1 本）に対する Go/No-Go の合否バーを、実測を見る前にここで凍結する
# （one_way_rule と同型の一方向規律）。判定は
# `scripts/run_melody_observability.py` の `evaluate_m1_real_go_bar` が
# このバーから機械算出し、各 report の `registry_sha256` に紐づく。実データを見て
# から閾値・バーを緩めてはならない。
m1_real_go_bar:
  registered_utc: "2026-07-24"
  positive_ids: [real_vocal_jrock, real_vocal_futurepop, real_vocal_band, real_vocal_waltz]
  negative_ids: [real_instrumental_negative]
  total_positive: 4
  min_positive_sufficient: 3        # ≥3/4 が sufficient
  max_negative_false_positive: 0    # 偽陽性ゼロ
  repeats_min: 2                     # 各素材×経路 n≥2（実行揺れ確認・決定論なら一致）
  rule: >
    本Go = positive 4 本中 ≥3 本で status=sufficient を返す経路が 1 本以上存在し、かつ
    その経路が全 negative で insufficient（偽陽性ゼロ）。この (≥3/4, 偽陽性0) を実測前に
    凍結する。実データを見てから閾値・バーを緩めてはならない（observation_gate の一方向
    規則の延長）。判定は scripts/run_melody_observability.py の evaluate_m1_real_go_bar で
    凍結バーから機械算出する（目視で緩めない）。

# ---------------------------------------------------------------------------
# fixture カテゴリ
# ---------------------------------------------------------------------------
# 設計 §3.1: 正解つきクリーン素材（少数）と 正解なし実素材（観測可能性のみ）を
# 別カテゴリとして明示し、混同しない。本レジストリに committed で載るのは、
# 決定論合成できる CI 安全な合成素材（正解=合成仕様そのもの）のみ。実ボーカル／
# Suno 実素材（正解 MIDI なし）は machine-dependent（実音源）なので slow/manual
# lane で外部投入し、ここには波形を committed しない。
fixtures:
  # --- カテゴリ A: 正解つきクリーン合成素材（CI 安全・決定論合成） ---
  - id: synth_mono_phrased
    category: clean_synthetic_with_truth
    input_kind: clear_lead
    melody_present: true
    expect_status: sufficient        # 正の対照: 観測できるべき
    spec: synthesis_specs.yaml#synth_mono_phrased
    note: 3 フレーズの単旋律サイン波列。単旋律抽出器の上限（正の対照）。
  - id: synth_mono_two_phrase
    category: clean_synthetic_with_truth
    input_kind: clear_lead
    melody_present: true
    expect_status: sufficient
    spec: synthesis_specs.yaml#synth_mono_two_phrase
    note: 2 フレーズの単旋律（hold-out 正の対照）。
  - id: synth_chord_pad
    category: clean_synthetic_no_melody
    input_kind: chord_pad_no_melody
    melody_present: false
    expect_status: insufficient      # 負の対照: 観測できないべき → not_observed
    spec: synthesis_specs.yaml#synth_chord_pad
    note: 持続三和音パッド（旋律なし）。誤検出を not_observed へ落とす対照。
  - id: synth_unison_drone
    category: clean_synthetic_no_melody
    input_kind: chord_pad_no_melody
    melody_present: false
    expect_status: insufficient
    spec: synthesis_specs.yaml#synth_unison_drone
    note: 単一持続音ドローン（hold-out 負の対照）。

# ---------------------------------------------------------------------------
# カテゴリ B: 正解なし実素材（観測可能性のみ・machine-dependent）
# ---------------------------------------------------------------------------
# ここには波形を committed しない。slow/manual lane で下記 id に実ファイルを割り当て、
# `scripts/run_melody_observability.py --external <manifest>` で観測可能性のみを測る。
# RPA/RCA（正解精度）には使わない（設計 §7 禁止事項）。
external_fixtures:
  - id: suno_vocals_stem
    category: real_no_truth
    input_kind: vocal_track
    note: >
      Suno 出力（歌入り実ミックス）の Demucs vocals stem。Recast の実利用入力
      そのもの＝最も現実的な標的。正解 MIDI を持たないため観測可能性のみ。
  - id: real_vocal_plus_backing
    category: real_no_truth
    input_kind: full_mix
    note: ボーカル + 伴奏の実ミックス。混合音源での劣化を観測。
  - id: real_lead_synth
    category: real_no_truth
    input_kind: clear_lead
    note: リードシンセ + 伴奏の実素材。非ボーカル経路。

  # --- M1-real 事前登録（2026-07-24・machine-dependent slow-lane 実測待ち） ---
  # 設計の vocal_song ラベルは routing.py の INPUT_KINDS に存在しないため、
  # 本命経路（demucs_vocals_then_crepe / demucs_vocals_then_melodia）を両方持つ
  # vocal_track へ写像する（docs/melody_observability.md §6 参照）。
  - id: real_vocal_jrock
    category: real_no_truth
    input_kind: vocal_track
    source: kane_y2
    expect_status: sufficient
    note: J-rock 系ボーカル曲。Demucs vocals 分離後 sufficient を期待。
  - id: real_vocal_futurepop
    category: real_no_truth
    input_kind: vocal_track
    source: sev4_x2
    expect_status: sufficient
    note: future-pop 系ボーカル曲。
  - id: real_vocal_band
    category: real_no_truth
    input_kind: vocal_track
    source: kaze_k2
    expect_status: sufficient
    note: バンド系ボーカル曲。
  - id: real_vocal_waltz
    category: real_no_truth
    input_kind: vocal_track
    source: crslv2_w3
    expect_status: sufficient
    note: 3拍子・器楽厚めボーカル曲（難所）。
  - id: real_instrumental_negative
    category: real_no_truth
    input_kind: vocal_track
    expect_status: insufficient
    note: >
      自作曲の器楽のみ区間（ボーカル旋律なし）。vocal_track として本命経路
      （Demucs→CREPE/Melodia）を通し、旋律不在で偽陽性（sufficient）を出さないことを
      実証する誤検出ガード。この経路が negative で sufficient を返したら不採用
      （一方向規則）。

# ---------------------------------------------------------------------------
# provenance（AGENTS §8）
# ---------------------------------------------------------------------------
# 合成 fixture の入力指紋は synthesis_specs.yaml の sha256 で固定される
# （波形は spec の決定論関数なので spec pin = 波形 pin）。実素材・モデル重み
# （Demucs / CREPE / Essentia）のバージョン・ハッシュ・取得元は、実推論を回す
# slow/manual lane の dated 実測時に記録する（本環境では未導入のため TBD）。
provenance:
  synthesis_specs: synthesis_specs.yaml
  # synthesis_specs.yaml の sha256 pin。仕様を変えたらこの値を新しい digest へ
  # 更新すること（dated 再実測の規律）。tests/test_melody_observability.py が実
  # ファイルとの完全一致を機械検証する。
  synthesis_specs_sha256: "ac8573fcc015005bdf058bab317d2d51467187d7da4d99eadd6fd197cf0fa030"
  # 波形サンプルの pin。生成波形は build_signal(spec) の関数であり、仕様 YAML
  # だけでなく builder（scripts/build_melody_bench.py: トーン合成・ギャップ・
  # dtype）にも依存する。仕様が不変でも builder が変われば音が変わりうるため、
  # 「spec pin = 波形 pin」を保証するには波形そのものを pin する必要がある。
  # 値 = sha256(build_signal(fid).y を float32 化した tobytes())。soundfile の
  # コンテナエンコードに依存しない生サンプルの pin なので libsoundfile 版差にも
  # 頑健。builder か spec が波形を変えれば test が赤くなり dated 再実測を強制する。
  waveform_sha256:
    synth_mono_phrased: "22117ad3e6c09c604ff3eecd91d35717de64930aaf95567e3c64b52bb1a34c64"
    synth_mono_two_phrase: "df3b5a083d68e02a8d3eaeff9bcd761cd66fa3696fbc1758f66784c11f2fda03"
    synth_chord_pad: "eec32a54eb987725202797dc80183ca44240295b66f0f260074cf5bed6abaa64"
    synth_unison_drone: "1a3c83a827a043d1cd3295a3e26456a0f329a21ca6722cdb7df57ccb4f7cf401"
  # モデル入力（重み）の dated 記録欄。**実行時 DL を行わない**規律のもと、重みは
  # slow-lane で事前取得し、その時点の version / sha256 をここへ記録する
  # （取得・記録手順は docs/melody_observability.md §6.4）。`sha256: null` は
  # 「未記録」を意味する（プレースホルダ文字列を pin と誤認させないため null で置く）。
  # 記録値の採り方:
  #   demucs  … python -c "from svp_rpe.rpe.learned.source_separation_adapter import
  #             describe_separation_weights as d; import json; print(json.dumps(d(), indent=2))"
  #   crepe / basic_pitch / essentia_melodia
  #           … run 出力 report の routes[].extractor_weights_sha256（ハーネスが実測 emit）
  # ここに記録した値と report の pin が食い違えば、別 model stack の run を混ぜた証拠になる
  # ——評価器は **記録済み（非 null）の sha256 と version の双方について行の値との一致を
  # 必須化**し、食い違えば fail-closed で Go を出さない（#217。sha256=「同じ bytes か」、
  # version=「同じ実装リリースか」。同一 bytes を別リリースが読んだ run を弾くため両方見る）。
  # 未記録（null）の間は要求しないので、記録前の slow-lane run はこれまでどおり進む。
  # プレースホルダ文字列（"TBD" 等）は記録済みと見なさず fail-closed で弾く（#61 と同型）。
  model_weights:
    demucs:
      role: source_separation (vocals stem)
      model: htdemucs_ft
      source: 事前取得（実行時DL禁止）
      version: null          # 例: "4.1.0"（installed demucs version）
      sha256: null           # describe_separation_weights()["sha256"]（bag 4 ckpt の合成 digest）
      license: null          # 上流重みライセンスを実確認して記録（policy §4: コード≠重み）
    crepe:
      role: melody_f0_extractor
      model: model-full.h5 (wheel 同梱)
      source: 事前取得（実行時DL禁止・pip wheel 同梱）
      version: null
      sha256: null           # report の routes[].extractor_weights_sha256（kind=model_weights）
      license: null          # UNVERIFIED（crepe_adapter の weights_license 注記参照）
    basic_pitch:
      role: melody_note_extractor
      model: ICASSP_2022_MODEL_PATH (wheel 同梱)
      source: 事前取得（実行時DL禁止・pip wheel 同梱）
      version: null
      sha256: null           # report の routes[].extractor_weights_sha256（kind=model_weights）
      license: Apache-2.0 (code); model artifact は上流確認が必要
    essentia_melodia:
      role: melody_f0_extractor (DSP)
      model: PredominantPitchMelodia
      source: 事前取得（実行時DL禁止・pip wheel 同梱バイナリ）
      version: null
      # Melodia は学習重みを持たない DSP 算法。pin するのは実装バイナリの指紋で、
      # report 側は kind=library_binary として明示する（重みでないものを重みと主張しない）。
      sha256: null
      license: AGPL-3.0 (essentia; manual/external 統合)
  random_seed: 0   # 合成・ペア生成の乱数 seed（決定論固定）
